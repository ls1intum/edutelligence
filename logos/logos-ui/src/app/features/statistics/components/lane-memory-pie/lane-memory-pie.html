@if (slices.length > 0) {
  <app-stats-vram-donut
    [data]="slices"
    [centerTop]="centerTop"
    [centerMiddle]="centerMiddle"
    [centerBottom]="centerBottom"
    valueSuffix=" GB"
    [valueDecimals]="2"
  />
} @else {
  <div class="lane-memory-pie__empty">
    <span>{{ emptyMessage }}</span>
  </div>
}
