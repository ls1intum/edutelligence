<div class="table-card">
  @if (loading) {
    <div class="table-loading">
      <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
      <span>Loading…</span>
    </div>
  } @else if (empty) {
    <div class="table-empty">{{ emptyMessage }}</div>
  } @else {
    <div class="table-header" role="row">
      @for (col of columns; track $index) {
        @if ($index === sortableColumn || sortableColumns.includes($index)) {
          <div
            role="columnheader"
            [attr.aria-sort]="$index === sortableColumn && sortDirection === 'asc' ? 'ascending' : $index === sortableColumn && sortDirection === 'desc' ? 'descending' : 'none'"
          >
            <button type="button" class="th-sort" (click)="sortToggle.emit($index)">
              {{ col }}
              <i class="pi {{ $index === sortableColumn ? sortIcon : 'pi-sort' }}" aria-hidden="true"></i>
            </button>
          </div>
        } @else {
          <div role="columnheader">{{ col }}</div>
        }
      }
    </div>

    <ng-content />
  }
</div>
