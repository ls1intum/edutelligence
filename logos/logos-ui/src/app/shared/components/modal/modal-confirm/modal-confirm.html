<tumaet-ui-dialog
  [visible]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [showHeader]="false"
  [ariaLabel]="title"
  size="small"
>
  <div class="confirm-body">
    <div class="confirm-icon-wrap" [class.confirm-icon-wrap--primary]="!danger">
      <i [class]="'pi ' + icon" aria-hidden="true"></i>
    </div>
    <p class="confirm-title">{{ title }}</p>
    <p class="confirm-message">{{ message }}</p>
    <ng-content select="[modal-details]" />
    <div class="confirm-error">
      <ng-content select="[modal-error]" />
    </div>
    <div class="confirm-footer">
      @if (!confirmOnly) {
        <button
          class="btn-secondary"
          type="button"
          [disabled]="loading"
          (click)="visibleChange.emit(false)"
        >
          Cancel
        </button>
      }
      <button
        [class]="danger ? 'btn-danger' : 'btn-primary'"
        type="button"
        [disabled]="loading"
        (click)="confirmed.emit()"
      >
        @if (loading) {
          <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
        }
        {{ confirmLabel }}
      </button>
    </div>
  </div>
</tumaet-ui-dialog>
