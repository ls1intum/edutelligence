# docker-compose.yml — Production GPU worker node (pulls the pre-built vLLM image)
# REGISTRY defaults to the public GHCR mirror; deployments override it with Harbor.
# For local development, use: docker compose -f docker-compose.dev.yml up --build
#
# Config split:
#   config.yml  — hardware & tuning (Ansible-managed, mounted read-only)
#   .env        — identity & credentials (GitHub secrets/variables)
#   ./data      — runtime state (bind-mounted, visible on host)
#
# tmpfs RAM cache (optional):
#   Set LOGOS_TMPFS_CACHE_PATH=/mnt/ramcache and TMPFS_SIZE=100g in .env
#   to enable a tmpfs-backed RAM cache for faster model loading.
#   When TMPFS_SIZE is unset or "0", the tmpfs mount is a no-op (size=0).
services:
  logos-workernode:
    image: ${REGISTRY:-ghcr.io/ls1intum/edutelligence}/logos-workernode-vllm:${IMAGE_TAG:-latest}
    container_name: logos-workernode
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 2m
    environment:
      # ── From .env (GitHub secrets/variables) ───────────────────────────
      LOGOS_URL: ${LOGOS_URL:-}
      LOGOS_API_KEY: ${LOGOS_API_KEY:-}
      LOGOS_ALLOW_INSECURE_HTTP: ${LOGOS_ALLOW_INSECURE_HTTP:-}
      HF_TOKEN: ${HF_TOKEN:-}
      # MAX_LANES is deprecated — the worker no longer needs an artificial
      # cap. Lane count is bounded naturally by VRAM (the capacity planner
      # decides what can fit) and by the lane port range
      # (worker.lane_port_start/end in config.yml). Any value left in .env
      # is intentionally NOT forwarded to the container so it can never
      # block eviction-driven lane creation.
      # ── tmpfs RAM cache ────────────────────────────────────────────────
      LOGOS_TMPFS_CACHE_PATH: ${LOGOS_TMPFS_CACHE_PATH:-}
      # ── Fixed container paths ──────────────────────────────────────────
      LOGOS_WORKER_NODE_CONFIG: /app/config.yml
      LOGOS_STATE_DIR: /app/data
      # Global request-lifecycle timeout (empty = per-stage defaults; benchmark sets 86400).
      LOGOS_TIMEOUT_S: ${LOGOS_TIMEOUT_S:-}
      # Stuck-detection dwell (seconds) before a no-progress lane may be killed
      # (empty = code default 180s). Raise to reduce false positives on slow lanes.
      LOGOS_STUCK_DURATION_SECONDS: ${LOGOS_STUCK_DURATION_SECONDS:-}
      HF_HOME: /usr/share/logos/models/.hf_cache
      # ── GPU / CUDA ────────────────────────────────────────────────────
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-utility,compute}
    gpus: all
    pid: host
    ipc: host # Required for NCCL shared-memory transport in tensor-parallel vLLM
    shm_size: "16g" # Default 64 MB is insufficient; NCCL hangs without adequate /dev/shm
    cap_add:
      # SYS_BOOT — lets logos_worker_node.gpu_watchdog call reboot(2) when
      # the GPU enters an unrecoverable wedge (GSP RPC failure, PCIe drop).
      # Only triggers after 3 consecutive unhealthy ticks + safety rails;
      # see logos_worker_node/gpu_watchdog.py for the full state machine.
      # SYSLOG — lets the diagnostics dump include `dmesg` output so the
      # postmortem can identify Xid / NVRM events that preceded the reboot.
      - SYS_BOOT
      - SYSLOG
    ulimits:
      memlock:
        soft: -1
        hard: -1 # Unlimited locked memory — needed for NCCL pinned buffers
      nofile:
        # One fd per in-flight client stream proxied to local vLLM, plus the
        # orchestrator websocket and vLLM control sockets. The default soft
        # limit (1024) is exhausted under ~1000 concurrent streams, causing the
        # worker to drop its session / fail requests. Raise it so high
        # concurrency degrades gracefully instead of disconnecting.
        soft: 262144
        hard: 262144
    ports:
      - "127.0.0.1:${WORKER_PORT:-80}:${WORKER_PORT:-80}"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
      # Model volume — backward-compatible source resolution (kept for one
      # release): LOGOS_MODELS_MOUNT → legacy OLLAMA_MODELS_MOUNT → the
      # the pre-existing model named volume. In-place upgrades keep
      # their cached model weights (the legacy env var / volume still
      # resolves); fresh deployments set LOGOS_MODELS_MOUNT (.env.example).
      - ${LOGOS_MODELS_MOUNT:-${OLLAMA_MODELS_MOUNT:-ollama-models}}:/usr/share/logos/models
      - ./certs:/app/certs:ro
      # Custom Jinja chat templates, referenced per model via
      # engines.vllm.model_overrides.<model>.chat_template in config.yml.
      # Mounted at the same absolute path inside the container as on the host
      # (the compose directory IS /opt/logos-workernode) so config.yml,
      # container logs and the vLLM command line all name the identical path.
      - ./chat-templates:/opt/logos-workernode/chat-templates:ro
      # tmpfs RAM cache — size=0 when TMPFS_SIZE is unset (no-op mount)
      - type: tmpfs
        target: /mnt/ramcache
        tmpfs:
          size: ${TMPFS_SIZE:-0}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,socket; s=socket.create_connection(('127.0.0.1',int(os.environ.get('WORKER_PORT',80))),2); s.close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # The worker opens its port only after its startup finishes.
      # The startup includes the FlashInfer kernel warmup, which takes minutes when the kernel cache is empty.
      # Failed checks do not count during the start period.
      # The node manager waits longer: keep NODE_MANAGER_VERIFY_TIMEOUT_S (below) at least 35 s above this value.
      start_period: 10m

  # ── Node manager (optional) ────────────────────────────────────────────────
  # Replaces the worker container on a deploy: it pulls the new image, starts
  # the new container, checks that it comes up, and starts the previous version
  # again if it does not. See logos-node-manager/README.md.
  #
  # The service only exists on hosts that enable its profile. The deploy
  # workflows write this line to .env for every worker with `node-manager: true`
  # in its matrix entry:
  #   COMPOSE_PROFILES=node-manager
  # Where the node manager runs, it is the only thing that restarts the worker.
  #
  # The worker directory is mounted at the SAME path as on the host. Compose
  # turns the relative bind mounts of the worker into absolute host paths before
  # it sends them to the Docker engine, so the path has to mean the same thing in
  # both places. The directory is read-only except for the state of the manager.
  #
  # The Docker login of the host user is mounted read-only, for registries that
  # need a login (run `docker login` on the host first). The mount does not
  # create the file: a host without a login fails to start the service, instead
  # of getting a directory in place of config.json. A new `docker login` replaces
  # that file and the mount keeps showing the old one, so recreate the service
  # after it (`docker compose up -d --force-recreate logos-node-manager`).
  #
  # The Docker socket is root on the host, and a read-only mount does not change
  # that. The container therefore gets nothing else: no published port, no new
  # privileges, no Linux capability except DAC_OVERRIDE, and a read-only root
  # filesystem. Root keeps DAC_OVERRIDE because it must read files of the deploy
  # user (for example the .env) and write a state directory that the deploy user
  # owns. See "Security model" in logos-node-manager/README.md.
  logos-node-manager:
    profiles: ["node-manager"]
    image: ${REGISTRY:-ghcr.io/ls1intum/edutelligence}/logos-node-manager:${NODE_MANAGER_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    container_name: logos-node-manager
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      NODE_MANAGER_PROJECT_DIR: ${NODE_MANAGER_PROJECT_DIR:-/opt/logos-workernode}
      # How long the manager waits for the first healthy state, in seconds. It must stay above the start period of the
      # worker health check (10 min) by the check interval (30 s) plus the poll interval of the manager (5 s): a worker
      # that opens its port at the end of the start period is seen as healthy up to 35 s later. 660 s leaves margin.
      NODE_MANAGER_VERIFY_TIMEOUT_S: ${NODE_MANAGER_VERIFY_TIMEOUT_S:-660}
      # Draining. The deploy workflows write NODE_MANAGER_DRAIN_ENABLED to .env for every worker with `node-manager: true`
      # (`true` when its matrix entry also has `drain: true`). A drain cordons the node at the orchestrator, where the
      # node is known by the key of the worker: the manager reuses LOGOS_URL and LOGOS_API_KEY, so it can cordon this
      # node and no other. Without both values the manager replaces the container without a drain.
      NODE_MANAGER_DRAIN_ENABLED: ${NODE_MANAGER_DRAIN_ENABLED:-false}
      NODE_MANAGER_ORCHESTRATOR_URL: ${LOGOS_URL:-}
      NODE_MANAGER_NODE_KEY: ${LOGOS_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${NODE_MANAGER_PROJECT_DIR:-/opt/logos-workernode}:${NODE_MANAGER_PROJECT_DIR:-/opt/logos-workernode}:ro
      - ${NODE_MANAGER_PROJECT_DIR:-/opt/logos-workernode}/node-manager:${NODE_MANAGER_PROJECT_DIR:-/opt/logos-workernode}/node-manager
      - type: bind
        source: ${NODE_MANAGER_DOCKER_CONFIG:-${HOME}/.docker/config.json}
        target: /root/.docker/config.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node-manager", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# The pre-upgrade model volume name is kept for one release so
# in-place upgrades resolve to the volume that already holds the cached
# weights (see the mount comment above).
volumes:
  logos-models:
  ollama-models:
