# docker-compose.dev.yml — Local development (builds worker node from source)
# Usage: docker compose -f docker-compose.dev.yml up --build
#
# vLLM is always installed (CUDA toolkit comes from vLLM's pip wheels —
# plain Ubuntu base, default BASE_IMAGE=ubuntu:24.04).
services:
  logos-workernode:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ubuntu:24.04}
        VLLM_PIP_SPEC: ${VLLM_PIP_SPEC:-vllm}
        NCCL_PIP_SPEC: ${NCCL_PIP_SPEC:-}
    container_name: logos-workernode
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 2m
    environment:
      LOGOS_URL: ${LOGOS_URL:-}
      LOGOS_API_KEY: ${LOGOS_API_KEY:-}
      LOGOS_ALLOW_INSECURE_HTTP: ${LOGOS_ALLOW_INSECURE_HTTP:-}
      HF_TOKEN: ${HF_TOKEN:-}
      # Set to "1" to skip auto-calibration on startup
      LOGOS_SKIP_AUTO_CALIBRATION: ${LOGOS_SKIP_AUTO_CALIBRATION:-}
      WORKER_PORT: ${WORKER_PORT:-80}
      LOGOS_WORKER_NODE_CONFIG: /app/config.yml
      LOGOS_STATE_DIR: /app/data
      HF_HOME: /usr/share/logos/models/.hf_cache
      # ── GPU / CUDA ───────────────────────────────────────────────────────
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-utility,compute}
    # GPU settings — uncomment on GPU machines with nvidia-container-runtime
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    pid: host
    ipc: host
    shm_size: "16g"
    cap_add:
      # See docker-compose.yml for rationale — kept in sync so dev hosts
      # exercise the same gpu_watchdog reboot path as production.
      - SYS_BOOT
      - SYSLOG
    ulimits:
      memlock:
        soft: -1
        hard: -1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${WORKER_PORT:-80}:${WORKER_PORT:-80}"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
      # Same backward-compatible model-volume resolution as production — see
      # docker-compose.yml (LOGOS_MODELS_MOUNT → OLLAMA_MODELS_MOUNT →
      # the pre-existing `ollama-models` volume, for one release).
      - ${LOGOS_MODELS_MOUNT:-${OLLAMA_MODELS_MOUNT:-ollama-models}}:/usr/share/logos/models
      - ./certs:/app/certs:ro
      - ./logos_worker_node:/app/logos_worker_node:ro
      # Same custom chat-template directory as production — see docker-compose.yml.
      - ./chat-templates:/opt/logos-workernode/chat-templates:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,socket; s=socket.create_connection(('127.0.0.1',int(os.environ.get('WORKER_PORT',80))),2); s.close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  logos-models:
  ollama-models:
