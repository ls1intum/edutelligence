# docker-compose.yaml — Production (pulls pre-built images from Harbor)
# For local development, use: docker compose -f docker-compose.dev.yaml up --build
services:
  traefik:
    image: traefik:v3.7.10
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Plain HTTP (default port 80) permanently redirects to HTTPS, so the
      # stack is reachable on both default ports without serving cleartext.
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.secure8080.address=:8080"
      # Per-IP rate-limit gateway (logos-rate-gateway): the public
      # entrypoints select only its catch-all router, which checks the
      # per-IP budget and forwards here — an entrypoint WITHOUT a published
      # host port, reachable only from inside the compose network. Every
      # other router in this stack hangs off it.
      - "--entrypoints.internal8090.address=:8090"
      # The gateway is a reverse proxy on this second hop: trust its
      # container address so the first hop's X-Forwarded-Proto/-For survive.
      # Without this Traefik strips them, and services lose the TLS signal
      # (the logosnode auth/session endpoints reject non-TLS callers).
      - "--entrypoints.internal8090.forwardedHeaders.trustedIPs=${LOGOS_GATEWAY_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}"
      # First hop: only sources in those ranges may set X-Forwarded-For;
      # everyone else's header is stripped before it enters the stack, so
      # the gateway's per-IP budgeting cannot be fooled by a forged header.
      # The default (the Docker bridges) matches no public client. A
      # deployment fronted by an outer reverse proxy (the chair's nginx)
      # adds that proxy's CIDR here — otherwise every client counts as
      # that one proxy IP and the per-IP isolation is lost.
      # Comma-delimited (e.g. "172.16.0.0/12,129.79.32.0/20"): Traefik's
      # CLI wants commas, so a space-delimited value would leave the outer
      # proxy untrusted (or invalidate the static config). The in-stack
      # nginx gateway normalises commas to spaces itself, so one value
      # serves both consumers.
      # One list is shared with internal8090 and the gateway's real-IP
      # configuration on purpose: the only source on internal8090 is the
      # gateway itself (its peer list is this network and Traefik), so an
      # outer-proxy entry there matches no reachable source; and in the
      # gateway, real_ip_recursive resolves the client as the rightmost
      # UNtrusted address in the chain, which is always the real client —
      # a forged entry sits to its left and is never reached.
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=${LOGOS_GATEWAY_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}"
      - "--entrypoints.secure8080.forwardedHeaders.trustedIPs=${LOGOS_GATEWAY_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--api.dashboard=true"
    ports:
      - "${LOGOS_TRAEFIK_HTTP_PORT:-80}:80"
      - "${LOGOS_TRAEFIK_HTTPS_PORT:-443}:443"
      - "${LOGOS_TRAEFIK_SECURE8080_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    labels:
      # strip-api is referenced by routers on multiple app containers (the
      # orchestrator AND the webservice). Define it here on Traefik itself so it
      # exists the instant Traefik starts. Previously it lived only on the
      # webservice, which blocks on db/keycloak health and so registered the
      # middleware long after the orchestrator had already published routers
      # referencing it — Traefik then spammed "middleware strip-api@docker does
      # not exist" for the orchestrator routes until the webservice came up.
      - "traefik.enable=true"
      - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      # The agent service is mounted at /api/agent, not /api: its routes are
      # defined without any prefix, so the whole mounted prefix has to come
      # off. stripprefix.prefixes is a list of alternatives, not a sequence
      # of strips — a "/api,/agent" list strips only the first match (/api)
      # and hands FastAPI /agent/... paths, which 404.
      - "traefik.http.middlewares.strip-api-agent.stripprefix.prefixes=/api/agent"
      # Same lifecycle reason as strip-api above: the rl-* limiters are
      # referenced by routers on THREE containers (orchestrator, webservice,
      # agent), so they must not be owned by any one of them. When the
      # orchestrator restarts, Traefik drops its dynamic configuration for a
      # moment — limiters defined here stay up throughout, so the
      # webservice/agent routes never reference a missing middleware.
      #
      # Per-service request limits (second layer; the first is the per-IP
      # budget in logos-rate-gateway, see docs/deployment.md). Generous on
      # purpose — raise via .env when a deployment needs more headroom.
      - "traefik.http.middlewares.rl-model.ratelimit.average=${LOGOS_RATE_LIMIT_MODEL_AVG:-100}"
      - "traefik.http.middlewares.rl-model.ratelimit.burst=${LOGOS_RATE_LIMIT_MODEL_BURST:-200}"
      - "traefik.http.middlewares.rl-jobs.ratelimit.average=${LOGOS_RATE_LIMIT_JOBS_AVG:-50}"
      - "traefik.http.middlewares.rl-jobs.ratelimit.burst=${LOGOS_RATE_LIMIT_JOBS_BURST:-100}"
      - "traefik.http.middlewares.rl-admin.ratelimit.average=${LOGOS_RATE_LIMIT_ADMIN_AVG:-20}"
      - "traefik.http.middlewares.rl-admin.ratelimit.burst=${LOGOS_RATE_LIMIT_ADMIN_BURST:-40}"
    networks:
      - internal
      # Second hop of the per-IP rate limiting: the gateway's only peer on
      # this network is Traefik itself (see logos-rate-gateway).
      - ratelimit

  # Front door of the stack: every public request (443, 8080) lands on this
  # nginx first, which enforces per-IP request budgets — something Traefik's
  # rateLimit middleware cannot do, it counts per service, not per client.
  # The public entrypoints select only the gateway's catch-all router; the
  # gateway then forwards to Traefik's internal8090 entrypoint, where all
  # the other routers (and their per-service limits) apply as a second
  # layer. See logos/rate-limit-gateway/nginx.conf and docs/deployment.md.
  logos-rate-gateway:
    # Configuration is baked into the image (not bind-mounted): a
    # deployment copies only the compose file to its VM, so a mount of
    # ./rate-limit-gateway/... would resolve to a missing path there.
    image: ${REGISTRY:-ghcr.io/ls1intum/edutelligence}/logos-rate-gateway:${IMAGE_TAG:-latest}
    container_name: logos-rate-gateway
    restart: unless-stopped
    depends_on:
      - traefik
    # Validate the configuration and probe the local listener.
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -q --spider http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      # Per-IP budgets: requests/second and burst per client IP. Generous —
      # this is a flood backstop, not a QoS knob. Raise in .env when a
      # deployment legitimately needs more headroom per IP.
      LOGOS_IP_RATE_LIMIT_AVG: "${LOGOS_IP_RATE_LIMIT_AVG:-30}"
      LOGOS_IP_RATE_LIMIT_BURST: "${LOGOS_IP_RATE_LIMIT_BURST:-60}"
      LOGOS_IP_CONTROL_RATE_LIMIT_AVG: "${LOGOS_IP_CONTROL_RATE_LIMIT_AVG:-5}"
      LOGOS_IP_CONTROL_RATE_LIMIT_BURST: "${LOGOS_IP_CONTROL_RATE_LIMIT_BURST:-20}"
      # IPs/CIDRs freed from the limits, space-separated (IPv4 or CIDR), e.g.
      # a corporate egress or the benchmark rig. Empty = no whitelist.
      # Malformed entries are skipped with a log line, they do not crash the
      # gateway.
      LOGOS_RATE_LIMIT_WHITELISTED_IPS: "${LOGOS_RATE_LIMIT_WHITELISTED_IPS:-}"
      # Which source ranges may set X-Forwarded-For (the Docker bridge
      # ranges; extend if your compose networks sit elsewhere).
      LOGOS_GATEWAY_TRUSTED_PROXY_CIDRS: "${LOGOS_GATEWAY_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}"
      # Where to forward: Traefik's internal entrypoint (no host port).
      LOGOS_GATEWAY_UPSTREAM: "${LOGOS_GATEWAY_UPSTREAM:-traefik:8090}"
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      # The one router left on the public entrypoints: catch-all, so 443 and
      # 8080 funnel every request through the per-IP budget first. TLS is
      # terminated here (once, for all paths), and re-signalled to the second
      # hop via X-Forwarded-Proto — see upstream.conf.
      - "traefik.http.routers.public-rate-gateway.rule=PathPrefix(`/`)"
      - "traefik.http.routers.public-rate-gateway.entrypoints=websecure,secure8080"
      - "traefik.http.routers.public-rate-gateway.tls=true"
      - "traefik.http.routers.public-rate-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.routers.public-rate-gateway.service=logos-rate-gateway-svc"
      - "traefik.http.routers.public-rate-gateway.priority=100"
      - "traefik.http.services.logos-rate-gateway-svc.loadbalancer.server.port=80"
    networks:
      # Deliberately NOT on `internal`: the gateway's only peer must be
      # Traefik, so it cannot reach the database, Keycloak, or the service
      # APIs on its own. Its container address on this network is what the
      # internal8090 entrypoint trusts (LOGOS_GATEWAY_TRUSTED_PROXY_CIDRS).
      - ratelimit

  logos-orchestrator:
    image: ${REGISTRY:-ghcr.io/ls1intum/edutelligence}/logos:${IMAGE_TAG:-latest}
    container_name: logos-orchestrator
    restart: unless-stopped
    # The single uvicorn worker holds one open fd per in-flight client stream
    # plus DB/worker-websocket fds. The default soft nofile limit (1024) means
    # that under load (~1000 concurrent streams) accept() hits EMFILE, the
    # orchestrator stops accepting connections, and Traefik returns 502 for
    # everything. Raise the soft limit to the host hard max so overload degrades
    # to slow (requests queue in the scheduler) instead of a 502 cascade.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    depends_on:
      logos-db:
        condition: service_healthy
    volumes:
      - data_volume:/src/logos
    environment:
      LOGOS_DOMAIN: "${LOGOS_DOMAIN:-localhost}"
      LOGOS_CAPACITY_PLANNER_ENABLED: "${LOGOS_CAPACITY_PLANNER_ENABLED:-true}"
      # Global request-lifecycle timeout knob. When set (>0) it overrides the
      # scheduler queue-wait, execution-context resolve, and worker stream
      # timeouts so a request effectively never times out (benchmark uses
      # 86400 to isolate scheduling from timeout-induced failures). Empty =
      # each stage keeps its own default (prod behaviour unchanged).
      LOGOS_TIMEOUT_S: "${LOGOS_TIMEOUT_S:-}"
      # Nightly calibration maintenance window (CalibrationOrchestrator). Set
      # LOGOS_CALIB_ENABLED=false to suppress it — the benchmark turns it off
      # for the duration of a run so a window session can't fire mid-benchmark.
      LOGOS_CALIB_ENABLED: "${LOGOS_CALIB_ENABLED:-true}"
      LOGOS_CALIB_WINDOW_START: "${LOGOS_CALIB_WINDOW_START:-03:00}"
      LOGOS_CALIB_WINDOW_END: "${LOGOS_CALIB_WINDOW_END:-08:00}"
      # How long the orchestrator waits for a worker to produce the next stream
      # chunk before closing the connection ("Stream timeout waiting for worker
      # response" → client sees RemoteProtocolError). The default 120s is too
      # short under model thrashing: a request for a not-yet-loaded model must
      # wait for the demand-preemptive drain to swap a busy lane AND the big
      # model to load (can exceed 120s), so it timed out before being served.
      LOGOSNODE_INFER_TIMEOUT_SECONDS: "${LOGOSNODE_INFER_TIMEOUT_SECONDS:-600}"
      LOGOSNODE_STREAM_TIMEOUT_SECONDS: "${LOGOSNODE_STREAM_TIMEOUT_SECONDS:-600}"
      # Kill switch for prefix-cache-aware placement (keeping one stream, i.e.
      # api key + prompt prefix, on the worker that already holds its KV
      # blocks). Off restores the previous random tie-break placement.
      LOGOS_PREFIX_AFFINITY_ENABLED: "${LOGOS_PREFIX_AFFINITY_ENABLED:-true}"
      LOGOS_NODE_DEV_ALLOW_INSECURE_HTTP: "${LOGOS_NODE_DEV_ALLOW_INSECURE_HTTP:-}"
      HF_TOKEN: "${HF_TOKEN:-}"
      PROMETHEUS_API_KEY: "${PROMETHEUS_API_KEY:-}"
      LOGOS_INTERNAL_SECRET: "${LOGOS_INTERNAL_SECRET:-}"
      # API docs (/docs, /redoc, /openapi.json) publish the full endpoint
      # map, internal paths included — they stay off unless a deployment
      # explicitly opts in (the dev compose does).
      LOGOS_DOCS_ENABLED: "${LOGOS_DOCS_ENABLED:-}"
      TZ: "${TZ:-Europe/Berlin}"
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"

      # The rl-* limiters these routers reference are defined on the
      # Traefik container (see there) so they outlive any single service's
      # restarts.

      # ── User-facing routes (ports 443 + 8080) ──

      # === Routing: /v1 ===
      - "traefik.http.routers.logos-orchestrator-v1.rule=PathPrefix(`/v1`)"
      - "traefik.http.routers.logos-orchestrator-v1.entrypoints=internal8090"
      - "traefik.http.routers.logos-orchestrator-v1.service=logos-orchestrator"
      - "traefik.http.routers.logos-orchestrator-v1.middlewares=rl-model"
      - "traefik.http.routers.logos-orchestrator-v1.priority=100"

      # === Routing: /openai ===
      - "traefik.http.routers.logos-orchestrator-openai.rule=PathPrefix(`/openai`)"
      - "traefik.http.routers.logos-orchestrator-openai.entrypoints=internal8090"
      - "traefik.http.routers.logos-orchestrator-openai.service=logos-orchestrator"
      - "traefik.http.routers.logos-orchestrator-openai.middlewares=rl-model"
      - "traefik.http.routers.logos-orchestrator-openai.priority=100"

      # === Routing: /jobs ===
      - "traefik.http.routers.logos-orchestrator-jobs.rule=PathPrefix(`/jobs`)"
      - "traefik.http.routers.logos-orchestrator-jobs.entrypoints=internal8090"
      - "traefik.http.routers.logos-orchestrator-jobs.service=logos-orchestrator"
      - "traefik.http.routers.logos-orchestrator-jobs.middlewares=rl-jobs"
      - "traefik.http.routers.logos-orchestrator-jobs.priority=100"

      # === Routing: /health ===
      - "traefik.http.routers.logos-orchestrator-health.rule=PathPrefix(`/health`)"
      - "traefik.http.routers.logos-orchestrator-health.entrypoints=internal8090"
      - "traefik.http.routers.logos-orchestrator-health.service=logos-orchestrator"
      - "traefik.http.routers.logos-orchestrator-health.middlewares=rl-admin"
      - "traefik.http.routers.logos-orchestrator-health.priority=100"

      # ── Admin routes ──
      # Served on the default HTTPS port (443) together with the completion
      # API — one port for everything, Traefik disambiguates by path and
      # router priority (UI catch-all 0 < orchestrator 100 < webservice 200).

      # === Routing: /api (all UI-internal endpoints) ===
      # application server strips the `/api` prefix, so adding a new admin endpoint
      # requires no change here — just a new FastAPI route under any path.
      # rl-admin, not rl-model: the gateway classifies /api as control-plane
      # traffic, so the second layer must carry the control-plane budget
      # too — otherwise the aggregate /api cap here (100 rps) would far
      # exceed the one every other /api router applies (20 rps).
      - "traefik.http.routers.logos-orchestrator-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.logos-orchestrator-api.entrypoints=internal8090"
      - "traefik.http.routers.logos-orchestrator-api.service=logos-orchestrator"
      - "traefik.http.routers.logos-orchestrator-api.middlewares=rl-admin"
      - "traefik.http.routers.logos-orchestrator-api.priority=100"

      # === Routing: /logosdb/providers/logosnode (workernode protocol) ===
      - "traefik.http.routers.logos-orchestrator-logosnode.rule=PathPrefix(`/logosdb/p\
        roviders/logosnode`)"
      - "traefik.http.routers.logos-orchestrator-logosnode.entrypoints=internal8090"
      - "traefik.http.routers.logos-orchestrator-logosnode.service=logos-orchestrator"
      - "traefik.http.routers.logos-orchestrator-logosnode.middlewares=rl-admin"
      - "traefik.http.routers.logos-orchestrator-logosnode.priority=100"

      # === Routing: /docs ===
      - "traefik.http.routers.logos-orchestrator-docs.rule=PathPrefix(`/docs`) ||
        PathPrefix(`/redoc`) || PathPrefix(`/openapi.json`)"
      - "traefik.http.routers.logos-orchestrator-docs.entrypoints=internal8090"
      - "traefik.http.routers.logos-orchestrator-docs.service=logos-orchestrator"
      - "traefik.http.routers.logos-orchestrator-docs.middlewares=rl-admin"
      - "traefik.http.routers.logos-orchestrator-docs.priority=100"

      # === Routing: /metrics (Prometheus) ===
      - "traefik.http.routers.logos-orchestrator-metrics.rule=PathPrefix(`/metrics`)"
      - "traefik.http.routers.logos-orchestrator-metrics.entrypoints=internal8090"
      - "traefik.http.routers.logos-orchestrator-metrics.service=logos-orchestrator"
      - "traefik.http.routers.logos-orchestrator-metrics.middlewares=rl-admin"
      - "traefik.http.routers.logos-orchestrator-metrics.priority=100"

      # === Routing: /api/logosdb/providers/logosnode (UI → worker admin actions) ===
      # Must outrank the webservice's /api/logosdb catch-all (priority 200):
      # calibrate_uncalibrated/status/lanes/etc. live in the orchestrator,
      # which holds the worker registry — the webservice would 404 them.
      - "traefik.http.routers.logos-orchestrator-api-logosnode.rule=PathPrefix(`/api/logosdb/providers/logosnode`)"
      - "traefik.http.routers.logos-orchestrator-api-logosnode.entrypoints=internal8090"
      - "traefik.http.routers.logos-orchestrator-api-logosnode.service=logos-orchestrator"
      # Higher-priority routers serving /api carry the limiter alongside
      # their strip middleware — a limit on the priority-100 fallback alone
      # would be bypassed by every request selected by these rules.
      - "traefik.http.routers.logos-orchestrator-api-logosnode.middlewares=strip-api,rl-admin"
      - "traefik.http.routers.logos-orchestrator-api-logosnode.priority=201"

      # Service-Port
      - "traefik.http.services.logos-orchestrator.loadbalancer.server.port=8080"
    networks:
      - internal

  logos-webservice:
    image: ${REGISTRY:-ghcr.io/ls1intum/edutelligence}/logos-webservice:${IMAGE_TAG:-latest}
    container_name: logos-webservice
    restart: unless-stopped
    depends_on:
      logos-db:
        condition: service_healthy
    environment:
      DB_HOST: logos-db
      DB_PORT: 5432
      DB_NAME: logosdb
      DB_USER: postgres
      DB_PASSWORD: root
      LOGOS_ORCHESTRATOR_URL: "http://logos-orchestrator:8080"
      LOGOS_INTERNAL_SECRET: "${LOGOS_INTERNAL_SECRET:-}"
      JDK_JAVA_OPTIONS: "-XX:MaxRAMPercentage=80.0"
      # Keycloak (also served back to the UI via /api/info)
      KEYCLOAK_ISSUER_URI: "${KEYCLOAK_ISSUER_URI:?KEYCLOAK_ISSUER_URI must be set}"
      KEYCLOAK_JWKS_URI: "${KEYCLOAK_JWKS_URI:-${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/certs}"
      KEYCLOAK_ADMIN_BASE_URL: "${KEYCLOAK_ADMIN_BASE_URL:-}"
      KEYCLOAK_REALM: "${KEYCLOAK_REALM:-tum}"
      KEYCLOAK_CLIENT_ID: "${KEYCLOAK_CLIENT_ID:-logos}"
      # Passkey WebAuthn Relying Party ID, served to the UI via /info. On the shared
      # TUM Keycloak passkeys are scoped to the parent domain, so default to it
      # rather than the full UI host (else the browser finds no matching passkey).
      KEYCLOAK_PASSKEY_RP_ID: "${KEYCLOAK_PASSKEY_RP_ID:-aet.cit.tum.de}"
      KEYCLOAK_PASSKEY_RP_NAME: "${KEYCLOAK_PASSKEY_RP_NAME:-Logos}"
      # Empty default: KeycloakProperties auto-derives audience from client id.
      KEYCLOAK_AUDIENCE: "${KEYCLOAK_AUDIENCE:-}"
      KEYCLOAK_ROLES_LOGOS_ADMIN: "${KEYCLOAK_ROLES_LOGOS_ADMIN:-itg-admin}"
      KEYCLOAK_ROLES_APP_ADMIN: "${KEYCLOAK_ROLES_APP_ADMIN:-chair-member}"
      KEYCLOAK_AUTO_PROVISION_TEAMS: "${KEYCLOAK_AUTO_PROVISION_TEAMS:-false}"
      KEYCLOAK_TEAM_ROLE_SUFFIXES: "${KEYCLOAK_TEAM_ROLE_SUFFIXES:--dev,-team,-group}"
      KEYCLOAK_SYNC_ENABLED: "${KEYCLOAK_SYNC_ENABLED:-false}"
      KEYCLOAK_SYNC_CLIENT_ID: "${KEYCLOAK_SYNC_CLIENT_ID:-logos-sync}"
      KEYCLOAK_SYNC_CLIENT_SECRET: "${KEYCLOAK_SYNC_CLIENT_SECRET:-}"
      # Origins the webservice accepts browser requests from. Browsers attach an
      # Origin header to POST requests and WebSocket handshakes even when the UI
      # and API share an origin, so the Spring CorsFilter rejects every POST/WS
      # (get_models, get_providers, latest_requests, billing, /ws/stats, …)
      # if this is empty — while same-origin GETs (/me, /users) slip through.
      # The UI is served on the default HTTPS port, so default to the
      # bare-domain origin.
      LOGOS_CORS_ALLOWED_ORIGINS: "${LOGOS_CORS_ALLOWED_ORIGINS:-https://${LOGOS_DOMAIN:-localhost}}"
    expose:
      - "8081"
    labels:
      - "traefik.enable=true"
      # strip-api middleware is defined on the Traefik container (see above).

      # === Routing: /api/me, /api/users, /api/teams, /api/info ===
      - "traefik.http.routers.webservice-identity.rule=PathPrefix(`/api/me`) || PathPrefix(`/api/users`) || PathPrefix(`/api/teams`) || Path(`/api/info`)"
      - "traefik.http.routers.webservice-identity.entrypoints=internal8090"
      - "traefik.http.routers.webservice-identity.service=logos-webservice-svc"
      - "traefik.http.routers.webservice-identity.middlewares=strip-api,rl-admin"
      - "traefik.http.routers.webservice-identity.priority=200"

      # === Routing: /api/logosdb ===
      - "traefik.http.routers.webservice-config.rule=PathPrefix(`/api/logosdb`)"
      - "traefik.http.routers.webservice-config.entrypoints=internal8090"
      - "traefik.http.routers.webservice-config.service=logos-webservice-svc"
      - "traefik.http.routers.webservice-config.middlewares=strip-api,rl-admin"
      - "traefik.http.routers.webservice-config.priority=200"

      # === Routing: the operator-facing logosnode admin actions ===
      # These require JWT auth, so they go through Spring (priority 202 beats the
      # orchestrator's logosnode catch-all at 201). Spring validates the token and proxies
      # to the orchestrator via internal secret.
      #
      # Every such action has to be named here. The rule is an exact-Path list
      # standing in front of a PathPrefix catch-all, so an action added to the UI
      # and to both services but not to this line is still routed straight to the
      # orchestrator — which does not serve Spring's paths and answers 404. That
      # is what happened to lanes/add: present end to end, unreachable in prod.
      - "traefik.http.routers.webservice-logosnode-admin.rule=Path(`/api/logosdb/providers/logosnode/calibrate_uncalibrated`) || Path(`/api/logosdb/providers/logosnode/lanes/delete`) || Path(`/api/logosdb/providers/logosnode/lanes/add`) || Path(`/api/logosdb/providers/logosnode/lanes/load_status`) || Path(`/api/logosdb/providers/logosnode/lanes/sleep`) || Path(`/api/logosdb/providers/logosnode/lanes/wake`)"
      - "traefik.http.routers.webservice-logosnode-admin.entrypoints=internal8090"
      - "traefik.http.routers.webservice-logosnode-admin.service=logos-webservice-svc"
      - "traefik.http.routers.webservice-logosnode-admin.middlewares=strip-api,rl-admin"
      - "traefik.http.routers.webservice-logosnode-admin.priority=202"

      # === Routing: /api/admin ===
      - "traefik.http.routers.webservice-admin.rule=PathPrefix(`/api/admin`)"
      - "traefik.http.routers.webservice-admin.entrypoints=internal8090"
      - "traefik.http.routers.webservice-admin.service=logos-webservice-svc"
      - "traefik.http.routers.webservice-admin.middlewares=strip-api,rl-admin"
      - "traefik.http.routers.webservice-admin.priority=200"

      # === Routing: /api/ws/stats, /api/ws/stats/v2 (WebSocket) ===
      - "traefik.http.routers.webservice-ws.rule=Path(`/api/ws/stats`) || Path(`/api/ws/stats/v2`)"
      - "traefik.http.routers.webservice-ws.entrypoints=internal8090"
      - "traefik.http.routers.webservice-ws.service=logos-webservice-svc"
      - "traefik.http.routers.webservice-ws.middlewares=strip-api,rl-admin"
      - "traefik.http.routers.webservice-ws.priority=200"

      # Service-Port
      - "traefik.http.services.logos-webservice-svc.loadbalancer.server.port=8081"
    networks:
      - internal

  logos-db:
    image: ${REGISTRY:-ghcr.io/ls1intum/edutelligence}/logos-db:${IMAGE_TAG:-latest}
    container_name: logos-db
    restart: unless-stopped
    user: postgres
    command: >
      postgres -c shared_preload_libraries=pg_cron -c cron.database_name=logosdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: logosdb
      POSTGRES_HOST: localhost
    ports:
      # Loopback only — reach it remotely via SSH tunnel (see README), never
      # exposed on the public interface.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "--username=postgres" ]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  logos-agent:
    image: ${REGISTRY:-ghcr.io/ls1intum/edutelligence}/logos-agent:${IMAGE_TAG:-latest}
    container_name: logos-agent
    # Long enough to freeze every running session before the process is
    # killed. A deploy restarts this service and the model gateway together;
    # a session frozen first survives that, one left talking to a gateway
    # being replaced loses the turn it was in the middle of.
    stop_grace_period: 30s
    restart: unless-stopped
    # Opt-in: the service does nothing until a profile enables it, so an
    # existing deployment that does not want agent sessions is unchanged by
    # this file. Enable with COMPOSE_PROFILES=agent.
    profiles: ["agent"]
    depends_on:
      logos-db:
        condition: service_healthy
      # The sessions' model endpoint is this gateway. A targeted
      # `docker compose up -d logos-agent` must bring it up with the runner,
      # or every session's model call fails DNS resolution.
      logos-agent-gateway:
        condition: service_healthy
    environment:
      DB_HOST: logos-db
      DB_PORT: 5432
      DB_NAME: logosdb
      DB_USER: postgres
      DB_PASSWORD: root
      LOGOS_ORCHESTRATOR_URL: "http://logos-orchestrator:8080"
      LOGOS_INTERNAL_SECRET: "${LOGOS_INTERNAL_SECRET:-}"

      # Identity: this service is reached from the browser, so it verifies
      # Keycloak tokens itself rather than behind the Spring webservice.
      KEYCLOAK_ISSUER_URI: "${KEYCLOAK_ISSUER_URI:?KEYCLOAK_ISSUER_URI must be set}"
      KEYCLOAK_JWKS_URI: "${KEYCLOAK_JWKS_URI:-${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/certs}"
      KEYCLOAK_AUDIENCE: "${KEYCLOAK_AUDIENCE:-}"
      KEYCLOAK_CLIENT_ID: "${KEYCLOAK_CLIENT_ID:-logos}"
      # External Keycloak role(s) that grant the required internal role — the
      # same variable (and default) the webservice reads, so one .env names
      # the deployment's admin role for both services.
      KEYCLOAK_ROLES_LOGOS_ADMIN: "${KEYCLOAK_ROLES_LOGOS_ADMIN:-itg-admin}"
      LOGOS_AGENT_REQUIRED_ROLE: "${LOGOS_AGENT_REQUIRED_ROLE:-logos_admin}"

      # The Logos key sessions call models with. Give it LOW priority so agent
      # traffic never outranks a user at the scheduler.
      LOGOS_AGENT_API_KEY: "${LOGOS_AGENT_API_KEY:-}"
      LOGOS_AGENT_DEFAULT_MODEL: "${LOGOS_AGENT_DEFAULT_MODEL:-}"

      # Sessions run in this image, on this network, under these ceilings.
      LOGOS_AGENT_WORKSPACE_IMAGE: "${REGISTRY:-ghcr.io/ls1intum/edutelligence}/logos-agent-workspace:${IMAGE_TAG:-latest}"
      # The internal session network: no external egress, the model gateway
      # is the only reachable peer. The egress network is for the runner's
      # trusted helper containers (checkout preparation, post-agent
      # commit/push, screenshots) — never for the agent itself.
      LOGOS_AGENT_SESSION_NETWORK: "${LOGOS_AGENT_SESSION_NETWORK:-logos-agent-net}"
      LOGOS_AGENT_SESSION_EGRESS_NETWORK: "${LOGOS_AGENT_SESSION_EGRESS_NETWORK:-logos-agent-egress-net}"
      # Where sessions send model traffic: the gateway that exposes only the
      # orchestrator's /v1 model surface on the session network.
      LOGOS_AGENT_SESSION_MODEL_URL: "${LOGOS_AGENT_SESSION_MODEL_URL:-http://logos-agent-gateway}"
      LOGOS_AGENT_MAX_PARALLEL_SESSIONS: "${LOGOS_AGENT_MAX_PARALLEL_SESSIONS:-10}"
      LOGOS_AGENT_SESSION_MEMORY_MB: "${LOGOS_AGENT_SESSION_MEMORY_MB:-4096}"
      LOGOS_AGENT_SESSION_CPUS: "${LOGOS_AGENT_SESSION_CPUS:-2}"
      # The uid the session image runs as; the runner chowns the per-session
      # artefact directories it creates to this user.
      LOGOS_AGENT_SESSION_UID: "${LOGOS_AGENT_SESSION_UID:-10001}"
      # Empty by default: a session ends when the agent is done, not when a
      # clock says so. Set a number of seconds only if a deployment wants
      # one — what protects capacity here is the pause and the ceilings,
      # neither of which cares how long a session has been at it.
      # Whose word the agent acts on: membership of these teams in the
      # repository's organisation. Empty falls back to "may write to this
      # repository", which is what the runner used before.
      LOGOS_AGENT_TRUSTED_TEAMS: "${LOGOS_AGENT_TRUSTED_TEAMS:-logos-developers,logos-maintainers}"
      LOGOS_AGENT_SESSION_TIMEOUT_S: "${LOGOS_AGENT_SESSION_TIMEOUT_S:-0}"

      # Capacity gates: start only below the first threshold, hand capacity
      # back above the second. Pause must exceed start or sessions flap.
      LOGOS_AGENT_START_BELOW_LOAD: "${LOGOS_AGENT_START_BELOW_LOAD:-0.60}"
      LOGOS_AGENT_PAUSE_ABOVE_LOAD: "${LOGOS_AGENT_PAUSE_ABOVE_LOAD:-0.85}"

      # What a session may reach. The workflow-scoped token stays here; the
      # session token below should carry contents + pull-request write only.
      LOGOS_AGENT_REPO_URL: "${LOGOS_AGENT_REPO_URL:-https://github.com/ls1intum/edutelligence.git}"
      LOGOS_AGENT_REPO_SLUG: "${LOGOS_AGENT_REPO_SLUG:-ls1intum/edutelligence}"
      # The account every agent token must belong to. Both tokens are checked
      # against it at startup, and the finalizer checks again before it pushes.
      LOGOS_AGENT_GITHUB_LOGIN: "${LOGOS_AGENT_GITHUB_LOGIN:-LogosOSSAgent}"
      LOGOS_AGENT_GITHUB_TOKEN: "${LOGOS_AGENT_GITHUB_TOKEN:-}"
      # Optional: a second token of the same account without 'workflow' scope,
      # handed to session containers. Falls back to the token above.
      LOGOS_AGENT_SESSION_GITHUB_TOKEN: "${LOGOS_AGENT_SESSION_GITHUB_TOKEN:-}"
      # Whether the agent's GitHub account may be used like a colleague's:
      # assignments, reviews on its pull requests, and comments addressed to
      # it queue sessions. On unless explicitly switched off — running this
      # service is already the deliberate step, and the assignment or the
      # mention is the per-item consent.
      LOGOS_AGENT_TRIGGERS_ENABLED: "${LOGOS_AGENT_TRIGGERS_ENABLED:-true}"
      LOGOS_AGENT_DEPLOY_ENABLED: "${LOGOS_AGENT_DEPLOY_ENABLED:-false}"
      LOGOS_AGENT_DEV_BASE_URL: "${LOGOS_AGENT_DEV_BASE_URL:-https://logos-dev.aet.cit.tum.de}"
      # The volume that backs the runner's per-session state (the pause mark).
      # It must name the *actual* Docker volume behind the mount below. A
      # compose volume with no explicit name is project-scoped
      # (<project>_agent_state), which is not this name — so the volume is given
      # a literal name and this matches it. That is what keeps the child's bind
      # source on the same storage the runner writes the mark into.
      LOGOS_AGENT_STATE_VOLUME: "${LOGOS_AGENT_STATE_VOLUME:-logos_agent_state}"
    volumes:
      # Needed to create session containers. This is the one privileged thing
      # the runner holds — and precisely what it never passes on: session
      # containers get no socket, no root, and no capabilities.
      - /var/run/docker.sock:/var/run/docker.sock
      - agent_artifacts:/var/lib/logos-agent/artifacts
      # Runner-owned session state, shared with the child read-only: a pause
      # mark written here is the mark the agent container reads.
      - agent_state:/var/lib/logos-agent/state
    expose:
      - "8082"
    # On purpose *not* attached to the agent network: the runner controls
    # everything through the Docker socket, and attaching it there would let
    # an agent container reach the runner's own API. The only peer on that
    # network is the gateway, and that is the whole design.
    labels:
      - "traefik.enable=true"

      # === Routing: /api/agent ===
      - "traefik.http.routers.agent-api.rule=PathPrefix(`/api/agent`)"
      - "traefik.http.routers.agent-api.entrypoints=internal8090"
      - "traefik.http.routers.agent-api.service=logos-agent-svc"
      - "traefik.http.routers.agent-api.middlewares=strip-api-agent,rl-admin"
      - "traefik.http.routers.agent-api.priority=200"

      - "traefik.http.services.logos-agent-svc.loadbalancer.server.port=8082"
    networks:
      - internal

  # The only bridge between the session network and the internal network.
  # Sessions run with permission prompts disabled and hold no credentials,
  # so they must not be able to reach the orchestrator's other endpoints
  # (or, via `internal`, the database, Keycloak, and worker APIs): this
  # gateway forwards exactly the /v1 model surface, and nothing else — and
  # it is also where the model credential lives, injected into the traffic
  # so the session containers never carry it. See agent-gateway/nginx.conf.
  logos-agent-gateway:
    # The nginx configuration is baked into this image, not mounted from the
    # host: a deployment copies only the compose file to its VM, so a bind
    # mount of ./agent-gateway/nginx.conf resolved to a missing path there,
    # Docker created an empty directory in its place, and the gateway served
    # its stock configuration and failed its health check forever.
    image: ${REGISTRY:-ghcr.io/ls1intum/edutelligence}/logos-agent-gateway:${IMAGE_TAG:-latest}
    container_name: logos-agent-gateway
    restart: unless-stopped
    profiles: ["agent"]
    # Validate the configuration and probe the local listener. `service
    # nginx status` cannot work here: nginx:alpine runs without an init
    # system, the check failed forever, the gateway stayed unhealthy, and
    # logos-agent's service_healthy dependency never released.
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -q --spider http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - logos-orchestrator
    environment:
      # The Logos key the gateway injects into the agent's model calls. The
      # image ships the configuration as a template, and its entrypoint runs
      # envsubst at container start, so the key enters the running
      # configuration here and never has to be passed to a session
      # container — nor does it sit in an image layer.
      LOGOS_AGENT_API_KEY: "${LOGOS_AGENT_API_KEY:-}"
    networks:
      - internal
      - agent

  logos-ui:
    image: ${REGISTRY:-ghcr.io/ls1intum/edutelligence}/logos-ui:${IMAGE_TAG:-latest}
    container_name: logos-ui
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - "traefik.enable=true"

      # === UI routing (default HTTPS port) ===
      # Priority 0 catch-all: the API routers (priority >= 100) win on their
      # paths and everything else serves the UI — UI + API share port 443.
      # Override: set LOGOS_DOMAIN in .env
      - "traefik.http.routers.internal-ui.rule=Host(`${LOGOS_DOMAIN:-localhost}\
        `) && PathPrefix(`/`)"
      - "traefik.http.routers.internal-ui.entrypoints=internal8090"
      - "traefik.http.routers.internal-ui.service=internal-ui-svc"
      - "traefik.http.routers.internal-ui.priority=0"

      # Shared service definition
      - "traefik.http.services.internal-ui-svc.loadbalancer.server.port=80"
    networks:
      - internal

volumes:
  data_volume:
  postgres_data:
  agent_artifacts:
  # Named literally (not project-scoped) so its Docker name is exactly the
  # value LOGOS_AGENT_STATE_VOLUME hands to the runner: a bind source is
  # resolved on the daemon host, so the two must name the same volume, or the
  # child mounts a directory the runner never writes the pause mark into.
  agent_state:
    name: logos_agent_state

networks:
  internal:
    driver: bridge
  # Second hop of the per-IP rate limiting: only Traefik and the rate
  # gateway share it, so the gateway — which sees every public request —
  # cannot reach any other service on its own.
  ratelimit:
    driver: bridge
  # The untrusted agent phase lives here. It is *internal*: Docker gives
  # containers on it no external egress at all, so the only reachable peer
  # is the gateway on the same network, which is precisely where model
  # traffic must go. The runner creates it if it does not exist.
  agent:
    name: ${LOGOS_AGENT_SESSION_NETWORK:-logos-agent-net}
    driver: bridge
    internal: true
  # The runner's trusted helper containers (checkout preparation, post-agent
  # commit/push, screenshots) run here: a plain bridge with egress, because
  # they legitimately talk to GitHub and the dev environment — and because
  # the agent itself never runs on it.
  agent-egress:
    name: ${LOGOS_AGENT_SESSION_EGRESS_NETWORK:-logos-agent-egress-net}
    driver: bridge
