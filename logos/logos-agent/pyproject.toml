[project]
name = "logos-agent"
version = "0.1.0"
description = "Runs coding agents in isolated containers on capacity Logos is not otherwise using"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard]==0.115.9",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pyjwt[crypto]>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "black==25.1.0",
    "flake8==7.1.2",
    "isort==6.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
