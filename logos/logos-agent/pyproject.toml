[project]
name = "logos-agent"
version = "0.1.0"
description = "Runs coding agents in isolated containers on capacity Logos is not otherwise using"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard]==0.142.2",
    # Pinned explicitly: starlette arrives transitively through fastapi.
    "starlette==1.7.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "sqlalchemy[asyncio]==2.1.3",
    "asyncpg==0.31.0",
    "pydantic==2.13.5",
    "pyjwt[crypto]==2.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "black==26.5.1",
    "flake8==7.4.1",
    "isort==9.0.2",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
