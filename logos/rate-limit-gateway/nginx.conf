# Per-IP rate limiting for the whole stack.
#
# Why this container exists: Traefik's rateLimit middleware counts requests
# per service, not per client, so the in-stack flood backstop cannot
# isolate one abusive IP. This gateway is where the public entrypoints
# (TLS 443, plain 8080) land first: Traefik selects it for every request,
# nginx checks the per-IP budget here, and only then forwards to Traefik's
# *internal* entrypoint (LOGOS_GATEWAY_UPSTREAM), where the real routing
# rules — and their per-service limits — apply as a second layer.
#
# Real client IP: nginx sees Traefik's container address, so the remote
# address is reconstructed from X-Forwarded-For, trusting only the Docker
# bridge ranges (LOGOS_GATEWAY_TRUSTED_PROXY_CIDRS).
#
# Whitelist: the IPs/CIDRs listed in LOGOS_RATE_LIMIT_WHITELISTED_IPS are
# freed from the limits. entrypoint.sh renders them into
# /etc/nginx/rate-gateway/whitelist.conf (a geo block); a whitelisted
# request is rewritten to an exact-match pass-location whose zone runs
# at a rate that cannot fire. (limit_req names exactly one static zone
# per location — no variables in zone=, no rate= override — so the
# exemption is a location jump. The jump target must be a plain
# exact-match location, not a named one: after `rewrite ... last`
# location matching restarts and a named location does not re-match, so
# the URI would fall back to `location /` and the if would re-fire in
# an endless internal-redirection cycle.)
#
# This file is a *template*: the stock envsubst pass fills in the ${LOGOS_*}
# values (guaranteed by entrypoint.sh) and leaves nginx $variables alone.

# proxy_pass carries the upstream in a variable (LOGOS_GATEWAY_UPSTREAM),
# which nginx resolves at runtime — that needs a resolver, and inside the
# compose network Docker's embedded DNS provides it.
resolver 127.0.0.11 valid=30s ipv6=off;

# Real client IP: nginx sees the proxy's container address, so the remote
# address is reconstructed from X-Forwarded-For, trusting only the ranges
# entrypoint.sh renders into realip.conf (one set_real_ip_from per range —
# the directive takes a single parameter each).
include /etc/nginx/rate-gateway/realip.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_status 429;

# One shared-memory zone per budget class, keyed by the real client IP —
# this is what makes the limits per-IP. The *_pass twins serve whitelisted
# IPs only; their rate is far above any realistic traffic, so they act as
# "no limit" while still keeping one (huge) bucket per IP.
limit_req_zone $binary_remote_addr zone=ip_model:10m rate=${LOGOS_IP_RATE_LIMIT_AVG}r/s;
limit_req_zone $binary_remote_addr zone=ip_model_pass:10m rate=10000r/s;
limit_req_zone $binary_remote_addr zone=ip_control:10m rate=${LOGOS_IP_CONTROL_RATE_LIMIT_AVG}r/s;
limit_req_zone $binary_remote_addr zone=ip_control_pass:10m rate=10000r/s;

# WebSocket upgrade pass-through (worker sessions, /api/ws/stats, dev /ws).
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# The geo block rendered by entrypoint.sh (whitelist).
include /etc/nginx/rate-gateway/whitelist.conf;

server {
    listen 80;
    client_max_body_size 100m;

    # Liveness probe for the compose healthcheck.
    location = /healthz {
        return 200;
    }

    # Control plane: jobs, the whole /api surface (webservice, agent,
    # logosnode operator paths), API docs, metrics, health, orchestrator
    # WebSocket.
    location ~ ^/(jobs|api|docs|redoc|metrics|health|ws)(/|$) {
        if ($rl_whitelisted) {
            rewrite ^ /__rl_pass_control last;
        }
        limit_req zone=ip_control burst=${LOGOS_IP_CONTROL_RATE_LIMIT_BURST} nodelay;
        include /etc/nginx/rate-gateway/upstream.conf;
    }

    # Model API (/v1, /openai), worker control paths (/logosdb/...), the UI
    # and everything else: the generous model budget.
    location / {
        if ($rl_whitelisted) {
            rewrite ^ /__rl_pass_model last;
        }
        limit_req zone=ip_model burst=${LOGOS_IP_RATE_LIMIT_BURST} nodelay;
        include /etc/nginx/rate-gateway/upstream.conf;
    }

    # Whitelist pass-throughs: same forwarding, budget that cannot fire.
    # Exact-match sentinels (see the header note on why not named
    # locations): the exact match beats the `location /` prefix, so the
    # whitelist if can never re-fire. proxy_pass forwards $request_uri —
    # the *original* path — so the sentinel name never reaches the
    # upstream. `internal` keeps them out of direct reach: without it a
    # client could simply request /__rl_pass_* and draw on the pass zone
    # (10000 r/s, i.e. no limit) instead of the public budget.
    location = /__rl_pass_control {
        internal;
        limit_req zone=ip_control_pass burst=${LOGOS_IP_CONTROL_RATE_LIMIT_BURST} nodelay;
        include /etc/nginx/rate-gateway/upstream.conf;
    }

    location = /__rl_pass_model {
        internal;
        limit_req zone=ip_model_pass burst=${LOGOS_IP_RATE_LIMIT_BURST} nodelay;
        include /etc/nginx/rate-gateway/upstream.conf;
    }
}
