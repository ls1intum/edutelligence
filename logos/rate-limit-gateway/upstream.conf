# Shared by the rate-limited locations: forward to Traefik's *internal*
# entrypoint. The public entrypoints only ever select the gateway, so this
# is a hop back into the same Traefik, where the routing rules (and their
# per-service rate limits) apply.

# $request_uri keeps the original path+args, so the same include serves
# both the normal locations and the named whitelist pass-throughs.
proxy_pass http://${LOGOS_GATEWAY_UPSTREAM}$request_uri;
proxy_http_version 1.1;
proxy_set_header Host $host;
# Pass the forwarded headers the first-hop Traefik set, unchanged: the
# services treat X-Forwarded-Proto as the TLS signal (the logosnode
# auth/session endpoints reject non-TLS callers) and must keep seeing
# https even though both hops through this gateway are plain HTTP.
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Forwarded-For $http_x_forwarded_for;
# WebSocket upgrade pass-through (worker sessions can be open for hours).
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# Streaming (SSE model answers) must not be buffered or cut off early.
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 86400s;
proxy_send_timeout 86400s;
