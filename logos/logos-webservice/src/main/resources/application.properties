spring.application.name=logos-webservice
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logosdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.liquibase.change-log=classpath:liquibase/changelog/master.xml
server.port=8081
logos.orchestrator.url=${LOGOS_ORCHESTRATOR_URL:}
logos.orchestrator.internal-secret=${LOGOS_INTERNAL_SECRET:}

# Inference gateway (public /v1, /openai, /jobs). When disabled, authenticated
# traffic is proxied entirely to the orchestrator.
logos.gateway.enabled=${LOGOS_GATEWAY_ENABLED:true}
logos.gateway.budget-cache-ttl-seconds=${LOGOS_GATEWAY_BUDGET_CACHE_TTL_SECONDS:15}
# Approximate per-request reservation written into log_entry_cost before a
# direct-cloud forward (micro-cents). Concurrent admissions see it immediately
# on this instance; set 0 to disable reservations (not recommended).
logos.gateway.budget-reservation-micro-cents=${LOGOS_GATEWAY_BUDGET_RESERVATION_MICRO_CENTS:1000000}

# Bounded pool for MVC StreamingResponseBody (inference streams). Without a
# queue cap, long-lived streams can accumulate unbounded work on Boot's
# default applicationTaskExecutor.
spring.task.execution.pool.core-size=${LOGOS_GATEWAY_ASYNC_CORE_SIZE:8}
spring.task.execution.pool.max-size=${LOGOS_GATEWAY_ASYNC_MAX_SIZE:64}
spring.task.execution.pool.queue-capacity=${LOGOS_GATEWAY_ASYNC_QUEUE_CAPACITY:200}
spring.task.execution.pool.thread-name-prefix=logos-gateway-
spring.mvc.async.request-timeout=${LOGOS_GATEWAY_ASYNC_TIMEOUT_MS:1800000}

# Batch uploads: the orchestrator caps a batch file at 50 MiB (and the whole
# request at file + 1 MiB of form fields). Spring's default 1 MiB per-file
# limit would reject the upload before the controller ever sees it, so the
# two limits mirror the orchestrator's.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB
# Eager parse is fine for management uploads; gateway paths bypass the
# multipart resolver entirely (see GatewayMultipartConfig).
spring.servlet.multipart.resolve-lazily=false

# --- Keycloak / OAuth2 resource server ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/tum}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8085/realms/tum/protocol/openid-connect/certs}

# Comma-separated origins allowed for browser cross-origin calls (Expo dev server, etc.)
# Empty by default — set explicitly in any deployment that needs cross-origin auth.
# Any pattern containing `*` automatically downgrades to non-credentialed CORS, per
# the W3C CORS spec; use exact origins for credentialed cross-site auth.
logos.cors.allowed-origins=${LOGOS_CORS_ALLOWED_ORIGINS:}

# --- Logos auth: claim → role/team mapping & sync ---
logos.auth.client-id=${KEYCLOAK_CLIENT_ID:logos}
# Expected token audience. Tokens minted for another client on the same realm are
# rejected. Leave empty to auto-derive from the client id (the usual case); override
# only when an explicit aud mapper produces a different value.
logos.auth.audience=${KEYCLOAK_AUDIENCE:}
# Passkey (WebAuthn) Relying Party ID + display name, served to the UI via /info.
# Leave rp-id blank to let the UI fall back to its own hostname (ok for localhost).
# On the shared TUM Keycloak set it to the parent domain (e.g. aet.cit.tum.de) so a
# passkey registered there is usable across all *.aet.cit.tum.de apps.
logos.auth.passkey.rp-id=${KEYCLOAK_PASSKEY_RP_ID:}
logos.auth.passkey.rp-name=${KEYCLOAK_PASSKEY_RP_NAME:Logos}
logos.auth.roles.logos-admin=${KEYCLOAK_ROLES_LOGOS_ADMIN:itg-admin}
logos.auth.roles.app-admin=${KEYCLOAK_ROLES_APP_ADMIN:chair-member}
# Auto-create teams from suffix-matching Keycloak roles/groups. Off by default: a claim only maps
# to a team an admin already linked via teams.keycloak_group, so users cannot self-provision teams.
logos.auth.auto-provision-teams=${KEYCLOAK_AUTO_PROVISION_TEAMS:false}
# Role-name suffixes that mark a Keycloak role as a team (comma-separated). Roles not
# ending in one of these are ignored for team provisioning (keeps offline_access etc. out).
logos.auth.team-role-suffixes=${KEYCLOAK_TEAM_ROLE_SUFFIXES:-dev,-team,-group}
logos.auth.sync-debounce-minutes=${KEYCLOAK_SYNC_DEBOUNCE_MINUTES:5}
logos.auth.sync.enabled=${KEYCLOAK_SYNC_ENABLED:false}
logos.auth.sync.cron=${KEYCLOAK_SYNC_CRON:0 0 * * * *}
logos.auth.sync.admin-base-url=${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8085}
logos.auth.sync.realm=${KEYCLOAK_REALM:tum}
logos.auth.sync.client-id=${KEYCLOAK_SYNC_CLIENT_ID:logos-sync}
logos.auth.sync.client-secret=${KEYCLOAK_SYNC_CLIENT_SECRET:}

# --- Per-IP rate limiting for endpoints that take no valid credential ---
# Covers public endpoints (/info) and the failure path of API-key auth
# (/logosdb/get_model_health): the orchestrator keeps the matching limits for
# its own /health, /v1/models and /v1/chat/completions (see logos.rate_limiter).
logos.rate-limiting.enabled=${LOGOS_RATE_LIMITING_ENABLED:true}
logos.rate-limiting.public-endpoint-requests-per-minute=${LOGOS_RATE_LIMIT_PUBLIC_RPM:60}
logos.rate-limiting.auth-failure-requests-per-minute=${LOGOS_RATE_LIMIT_AUTH_FAILURE_RPM:20}
logos.rate-limiting.trusted-proxy-cidrs=${LOGOS_RATE_LIMIT_TRUSTED_PROXY_CIDRS:172.16.0.0/12}
