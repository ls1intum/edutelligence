[project]
name = "logos-e2e"
version = "0.1.0"
description = "End-to-end suite for Logos: simulated GPUs, simulated worker nodes, real clients."
requires-python = ">=3.13"

dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "websockets>=13.0",
    # The client tier drives the real SDKs on purpose: their parsers are the
    # actual contract Logos' users depend on, and a hand-rolled HTTP client
    # would not notice when we break them.
    "openai>=1.60",
    "anthropic>=0.45",
]

[project.optional-dependencies]
# Tier 1 imports the worker package directly. Installed editable from the
# sibling directory rather than vendored, so the tests always run against the
# working tree.
worker = ["pydantic>=2.9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "gpu_sim: Tier 1 — in-process against the GPU simulator, no Docker required",
    "stack: Tier 2/3 — requires the compose stack (harness/stack) to be up",
]
filterwarnings = ["ignore::DeprecationWarning"]
