[project]
name = "logos"
version = "3.0"
description = "Logos is an LLM Engineering Platform that includes usage logging, billing, central resouce management, policy-based model selection, scheduling, and monitoring."
authors = [
    {name = "Tobias Wasner",email = "tobias.wasner@tum.de"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"

[tool.poetry.dependencies]
python = ">=3.13,<4.0.0"
fastapi = {extras = ["standard"], version = ">=0.141.1,<1.0.0"}
httpx = "^0.27.0"
shared = { path = "./shared", develop = true }
requests = "^2.32.3"
langchain = ">=0.3.23"
langchain-community = "^0.3.21"
openai = "^1.74.0"
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
psycopg2-binary = "^2.9.10"
SQLAlchemy = "^2.0.40"
grpcio = "^1.71.0"
grpcio-tools = "^1.71.0"
protobuf = "^5.27.2"
tiktoken = "^0.9.0"
python-dateutil = "^2.9.0"
sentence-transformers = "^5.0.0"
torch = ">=2.5,<3.0"
matplotlib = "^3.9.2"
aiohttp = ">=3.14.3,<4.0.0"
prometheus-client = "^0.21.0"
python-multipart = ">=0.0.30"
guidellm = {version = "0.7.2", extras = ["recommended"]}

# Security floors for packages that would otherwise only be transitive.
# The Dockerfile installs with `uv pip install .` and never copies uv.lock,
# so a constraint here is the only thing that keeps a rebuild off a
# vulnerable version.
langchain-core = ">=1.3.3"
langsmith = ">=0.8.18"
pillow = ">=12.3.0"
urllib3 = ">=2.7.0"
httpcore2 = ">=2.10.0"
httpx2 = ">=2.12.0"
starlette = ">=1.3.1"
transformers = ">=5.10.0"

[tool.poetry]
packages = [{ include = "logos", from = "src" }]

[tool.poetry.scripts]
openapi = "app.openapi:export"

[tool.poetry.group.dev.dependencies]
black = "25.1.0"
flake8 = "7.1.2"
isort = "^5.13"
autoflake = "^2.3"
pre-commit = "^4.0"
coverage = {version = "^7.0", extras = ["toml"]}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# uv: pin torch to the CPU-only PyTorch wheel index
# ---------------------------------------------------------------------------
# sentence-transformers pulls in torch as a transitive dep; this container has
# no GPU, so torch should resolve from PyTorch's CPU-only index rather than
# PyPI's default CUDA wheels (which drag in ~15 nvidia-cu12 packages). Scoping
# the extra index to just `torch` (via `explicit = true` + `tool.uv.sources`)
# means the Dockerfile's `uv pip install .` doesn't need a blanket
# `--index-strategy unsafe-best-match` search across both indexes.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Declare the `shared` path dependency to uv directly. It is already declared
# in [tool.poetry.dependencies], but uv only sees that through poetry-core's
# built metadata, which hands back an absolute directory -- so uv.lock ended up
# recording whoever last ran `uv lock` (e.g.
# /Users/<name>/.../logos/logos-orchestrator/shared). That made the lock
# machine-specific: it churned on every developer and could never be used to
# install from. Declared here, uv records the relative "../../shared" instead.
shared = { path = "../../shared" }
torch = { index = "pytorch-cpu" }

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: tests requiring a running server or database",
    "slow: tests that take more than a few seconds",
]
filterwarnings = []

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# Formatting / lint
# ---------------------------------------------------------------------------

[tool.black]
line-length = 120
target-version = ["py313"]
extend-exclude = '''
/(
  | \.venv
  | shared
  | logos-ui
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = ["shared", ".venv", "logos-ui"]
