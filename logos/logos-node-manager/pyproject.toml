[project]
name = "logos-node-manager"
version = "0.1.0"
description = "Replaces the Logos worker node container on a GPU host and rolls back a release that does not start"
readme = "README.md"
requires-python = ">=3.13,<4.0"
# No runtime dependencies on purpose: the manager only starts the docker command line, so the image stays small and
# there is nothing to keep patched in a container that holds the Docker socket.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
]

[project.scripts]
node-manager = "logos_node_manager.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logos_node_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
