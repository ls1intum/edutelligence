# The only surface session containers may reach.
#
# Sessions run on their own *internal* network with permission prompts
# disabled, so they must not be able to browse the orchestrator's internal
# and admin endpoints, and certainly not the rest of the internal network
# (database, Keycloak, worker APIs). This gateway sits on both the session
# network and the internal network and forwards nothing but the orchestrator's
# /v1 model surface — the OpenAI/Anthropic-compatible API a session talks to
# for its model calls. Everything else is refused.
#
# Model credentials: a session that holds a minted Logos key sends it, and
# the map forwards that value. When standing-key injection is configured
# (minting off, or minting with fallback), the placeholder / missing header
# is replaced with LOGOS_AGENT_API_KEY so the standing key never lives in the
# container. When minting is required without fallback, those cases map to
# empty and are rejected here — a revoked or missing session key must not
# fall through to the standing key.
server {
    listen 80;

    # Proxy the whole /v1 prefix with the original request path intact
    # (proxy_pass without a URI passes the request through unchanged).
    location /v1 {
        # Reject missing/placeholder credentials when injection is disabled
        # (see 00-agent-auth-map.conf.template and auth_injection_env.sh).
        if ($agent_authorization = "") {
            return 401;
        }
        proxy_pass http://logos-orchestrator:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $agent_authorization;
        # Model answers stream for minutes; buffering would stall the agent.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Liveness probe for the container healthcheck: proves nginx is up and
    # listening. Only reachable from the internal/agent networks — sessions
    # call /v1, and nothing outside the stack can reach this gateway.
    location = /healthz {
        return 200;
    }

    location / {
        return 404;
    }
}
