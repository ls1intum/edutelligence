# The only surface session containers may reach.
#
# Sessions run on their own network with permission prompts disabled, so they
# must not be able to browse the orchestrator's internal and admin endpoints,
# and certainly not the rest of the internal network (database, Keycloak,
# worker APIs). This gateway sits on both the session network and the
# internal network and forwards nothing but the orchestrator's /v1 model
# surface — the OpenAI/Anthropic-compatible API a session talks to for its
# model calls. Everything else is refused.
server {
    listen 80;

    # Proxy the whole /v1 prefix with the original request path intact
    # (proxy_pass without a URI passes the request through unchanged).
    location /v1 {
        proxy_pass http://logos-orchestrator:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Model answers stream for minutes; buffering would stall the agent.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        return 404;
    }
}
