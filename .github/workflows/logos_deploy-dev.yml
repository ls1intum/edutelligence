name: Logos - Deploy to Dev

on:
  workflow_dispatch:
    inputs:
      image-tag:
        type: string
        description: "Image tag to deploy (default: latest)"
        default: "latest"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      # Deploy each node independently: one unreachable host must not cancel
      # the in-flight deploys of the other (healthy) nodes.
      fail-fast: false
      # One node at a time, so that at most one worker is out of service at any
      # moment.
      max-parallel: 1
      # `node-manager: true` puts a worker under the node manager. The workflow
      # then asks the node manager of the host to replace the worker container.
      # The node manager checks the new container and rolls back if it does not
      # come up. Without the flag, the workflow runs `docker compose pull` and
      # `up -d` on the host itself. See logos/logos-node-manager/README.md.
      matrix:
        include:
          - environment: "Logos - Dev"
            compose-file: ./logos/docker-compose.yaml
            base-path: /opt/logos
          - environment: "Logos Worker - hochbruegge-vm-2"
            compose-file: ./logos/logos-workernode/docker-compose.yml
            base-path: /opt/logos-workernode
            node-manager: true
    environment:
      name: ${{ matrix.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract compose file basename
        id: extract-basename
        run: |
          BASENAME=$(basename "${{ matrix.compose-file }}")
          echo "basename=$BASENAME" >> $GITHUB_OUTPUT
          cp "${{ matrix.compose-file }}" "$BASENAME"

      - name: Copy docker compose file to VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.DEPLOYMENT_GATEWAY_HOST }}
          proxy_username: ${{ vars.DEPLOYMENT_GATEWAY_USER }}
          proxy_key: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOYMENT_GATEWAY_PORT }}
          source: ${{ steps.extract-basename.outputs.basename }}
          target: ${{ matrix.base-path }}

      - name: Create .env file
        run: |
          # Checked before it is written anywhere: this comes from whoever
          # dispatched the workflow, and a value carrying a newline would
          # add lines of its own to a file every later step reads as
          # configuration. Matched with `case` rather than a regular
          # expression because that is line-based, and a newline is exactly
          # what has to be caught.
          case "$WORKSPACE_IMAGE_TAG" in
            "" | *[!A-Za-z0-9._-]* | [!A-Za-z0-9_]* )
              echo "image-tag is not a Docker tag" >&2
              exit 1
              ;;
          esac
          if [ "${#WORKSPACE_IMAGE_TAG}" -gt 128 ]; then
            echo "image-tag is too long for a Docker tag" >&2
            exit 1
          fi
          echo "ENVIRONMENT=${{ matrix.environment }}" > .env
          echo "IMAGE_TAG=$WORKSPACE_IMAGE_TAG" >> .env
          echo "REGISTRY=${{ vars.LOGOS_HARBOR_REGISTRY }}/logos" >> .env

          echo "$SECRETS_CONTEXT" | jq -r '
            del(
              .github_token,
              .DOCKER_USERNAME,
              .DOCKER_PASSWORD,
              .DEPLOYMENT_GATEWAY_SSH_KEY,
              .VM_SSH_PRIVATE_KEY,
              .LOGOS_HARBOR_PASSWORD
            )
            | to_entries[]
            | "\(.key)=\(.value | @json)"
          ' >> .env

          echo "$VARS_CONTEXT" | jq -r '
            del(
              .DEPLOYMENT_GATEWAY_PORT,
              .DEPLOYMENT_GATEWAY_USER,
              .DEPLOYMENT_GATEWAY_HOST,
              .VM_USERNAME,
              .VM_HOST,
              .LOGOS_HARBOR_REGISTRY,
              .LOGOS_HARBOR_USER
            )
            | to_entries[]
            | "\(.key)=\(.value | @json)"
          ' >> .env

          # A worker under the node manager needs the compose profile that
          # starts the node manager service. The line comes last, so it also
          # wins over a COMPOSE_PROFILES variable of the environment.
          if [ "$NODE_MANAGER" = "true" ]; then
            echo "COMPOSE_PROFILES=node-manager" >> .env
          fi
        env:
          VARS_CONTEXT: ${{ toJson(vars) }}
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          WORKSPACE_IMAGE_TAG: ${{ inputs.image-tag || 'latest' }}
          NODE_MANAGER: ${{ matrix.node-manager }}

      - name: Copy .env file to VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.DEPLOYMENT_GATEWAY_HOST }}
          proxy_username: ${{ vars.DEPLOYMENT_GATEWAY_USER }}
          proxy_key: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOYMENT_GATEWAY_PORT }}
          source: .env
          target: ${{ matrix.base-path }}

      # The next three steps run for workers under the node manager only. The
      # node manager pulls, replaces, checks and, if need be, rolls back on the
      # host. This job only asks for it and waits for the result.
      - name: Update node manager
        if: ${{ matrix.node-manager }}
        uses: appleboy/ssh-action@v1.2.5
        env:
          LOGOS_HARBOR_PASSWORD: ${{ secrets.LOGOS_HARBOR_PASSWORD }}
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.DEPLOYMENT_GATEWAY_HOST }}
          proxy_username: ${{ vars.DEPLOYMENT_GATEWAY_USER }}
          proxy_key: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOYMENT_GATEWAY_PORT }}
          command_timeout: 15m
          envs: LOGOS_HARBOR_PASSWORD
          script: |
            set -eu
            # The node manager mounts this login to pull the worker image.
            printf '%s' "$LOGOS_HARBOR_PASSWORD" | docker login ${{ vars.LOGOS_HARBOR_REGISTRY }} -u '${{ vars.LOGOS_HARBOR_USER }}' --password-stdin
            compose() {
              docker compose -f ${{ matrix.base-path }}/${{ steps.extract-basename.outputs.basename }} --env-file=${{ matrix.base-path }}/.env "$@"
            }
            compose pull logos-node-manager
            # Recreated on every run: `docker login` replaces config.json with a new file, and the node manager
            # mounts that one file, so a container that is kept would go on with the old login.
            compose up -d --force-recreate logos-node-manager
            for attempt in $(seq 1 30); do
              if docker exec logos-node-manager node-manager ping; then
                exit 0
              fi
              sleep 2
            done
            echo "The node manager did not start." >&2
            docker logs --tail 50 logos-node-manager >&2
            exit 1

      - name: Deploy through node manager
        if: ${{ matrix.node-manager }}
        uses: appleboy/ssh-action@v1.2.5
        env:
          # Through the environment rather than into the script text: the tag
          # comes from whoever dispatched the workflow.
          WORKSPACE_IMAGE_TAG: ${{ inputs.image-tag || 'latest' }}
          DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.DEPLOYMENT_GATEWAY_HOST }}
          proxy_username: ${{ vars.DEPLOYMENT_GATEWAY_USER }}
          proxy_key: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOYMENT_GATEWAY_PORT }}
          # `deploy --wait` gives up after 40 minutes. The deployment itself
          # keeps running on the host if this connection drops, and
          # `node-manager wait <id>` attaches to it again.
          command_timeout: 45m
          envs: WORKSPACE_IMAGE_TAG,DEPLOY_ID,RUN_URL
          script: |
            set -eu
            docker exec logos-node-manager node-manager deploy --id "$DEPLOY_ID" --tag "$WORKSPACE_IMAGE_TAG" --requested-by "$RUN_URL" --wait

      - name: Show node manager log
        if: ${{ (success() || failure()) && matrix.node-manager }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.DEPLOYMENT_GATEWAY_HOST }}
          proxy_username: ${{ vars.DEPLOYMENT_GATEWAY_USER }}
          proxy_key: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOYMENT_GATEWAY_PORT }}
          script: |
            docker logs --tail 80 logos-node-manager 2>&1 || true

      - name: Pull new images
        if: ${{ !matrix.node-manager }}
        uses: appleboy/ssh-action@v1.2.5
        env:
          LOGOS_HARBOR_PASSWORD: ${{ secrets.LOGOS_HARBOR_PASSWORD }}
          LOGOS_HARBOR_REGISTRY: ${{ vars.LOGOS_HARBOR_REGISTRY }}
          # Through the environment rather than into the script text: this
          # value comes from whoever dispatched the workflow, and a shell
          # command built by string substitution is a command they get to
          # help write.
          WORKSPACE_IMAGE_TAG: ${{ inputs.image-tag || 'latest' }}
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.DEPLOYMENT_GATEWAY_HOST }}
          proxy_username: ${{ vars.DEPLOYMENT_GATEWAY_USER }}
          proxy_key: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOYMENT_GATEWAY_PORT }}
          command_timeout: 30m
          envs: LOGOS_HARBOR_PASSWORD,LOGOS_HARBOR_REGISTRY,WORKSPACE_IMAGE_TAG
          script: |
            printf '%s' "$LOGOS_HARBOR_PASSWORD" | docker login ${{ vars.LOGOS_HARBOR_REGISTRY }} -u '${{ vars.LOGOS_HARBOR_USER }}' --password-stdin
            docker compose -f ${{ matrix.base-path }}/${{ steps.extract-basename.outputs.basename }} --env-file=${{ matrix.base-path }}/.env pull

      - name: Deploy with docker compose
        if: ${{ !matrix.node-manager }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.DEPLOYMENT_GATEWAY_HOST }}
          proxy_username: ${{ vars.DEPLOYMENT_GATEWAY_USER }}
          proxy_key: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOYMENT_GATEWAY_PORT }}
          script: |
            # Scale logos-webservice from the node's .env without sourcing it
            # (sourcing would evaluate $(...) / backticks in values).
            ENV_FILE="${{ matrix.base-path }}/.env"
            # Default 1. Cloud RPM/TPM are shared across replicas via Redis;
            # raising replicas is for crash/deploy failover. Opt in with
            # LOGOS_WEBSERVICE_REPLICAS in .env — see
            # docs/deployment.md#inference-gateway-replicas.
            REPLICAS=1
            if [ -f "$ENV_FILE" ]; then
              RAW="$(grep -E '^[[:space:]]*LOGOS_WEBSERVICE_REPLICAS=' "$ENV_FILE" | tail -n1 | cut -d= -f2- | tr -d '\\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
              if [ -n "$RAW" ]; then
                case "$RAW" in
                  ''|*[!0-9]*)
                    echo "Invalid LOGOS_WEBSERVICE_REPLICAS='$RAW' (want positive integer); using 1" >&2
                    REPLICAS=1
                    ;;
                  *)
                    if [ "$RAW" -ge 1 ]; then
                      REPLICAS="$RAW"
                    else
                      echo "LOGOS_WEBSERVICE_REPLICAS=$RAW must be >= 1; using 1" >&2
                      REPLICAS=1
                    fi
                    ;;
                esac
              fi
            fi
            COMPOSE_FILE="${{ matrix.base-path }}/${{ steps.extract-basename.outputs.basename }}"
            if [ "$(basename "$COMPOSE_FILE")" = "docker-compose.yaml" ]; then
              docker compose -f "$COMPOSE_FILE" --env-file="$ENV_FILE" up -d --remove-orphans --scale "logos-webservice=${REPLICAS}"
            else
              docker compose -f "$COMPOSE_FILE" --env-file="$ENV_FILE" up -d --remove-orphans
            fi

      # Skipped under the node manager: `prune -af` would delete the previous
      # worker image, which a rollback needs. The node manager removes only the
      # image that is two versions old.
      - name: Clean up old images
        if: ${{ !matrix.node-manager }}
        uses: appleboy/ssh-action@v1.2.5
        env:
          LOGOS_HARBOR_PASSWORD: ${{ secrets.LOGOS_HARBOR_PASSWORD }}
          LOGOS_HARBOR_REGISTRY: ${{ vars.LOGOS_HARBOR_REGISTRY }}
          # Through the environment rather than into the script text: this
          # value comes from whoever dispatched the workflow, and a shell
          # command built by string substitution is a command they get to
          # help write.
          WORKSPACE_IMAGE_TAG: ${{ inputs.image-tag || 'latest' }}
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.DEPLOYMENT_GATEWAY_HOST }}
          proxy_username: ${{ vars.DEPLOYMENT_GATEWAY_USER }}
          proxy_key: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOYMENT_GATEWAY_PORT }}
          envs: LOGOS_HARBOR_PASSWORD,LOGOS_HARBOR_REGISTRY,WORKSPACE_IMAGE_TAG
          script: |
            docker image prune -af
            # After the prune, not before it. The session image is not a
            # compose service — the runner starts containers from it through
            # the Docker socket — so nothing references it between sessions
            # and `prune -af` deletes it. That is how a host ends up failing
            # every launch with a 404 for an image the deploy just pulled.
            if grep -q '^COMPOSE_PROFILES=.*agent' ${{ matrix.base-path }}/.env; then
              printf '%s' "$LOGOS_HARBOR_PASSWORD" | docker login "$LOGOS_HARBOR_REGISTRY" -u '${{ vars.LOGOS_HARBOR_USER }}' --password-stdin
              docker pull "$LOGOS_HARBOR_REGISTRY/logos/logos-agent-workspace:$WORKSPACE_IMAGE_TAG"
            fi
