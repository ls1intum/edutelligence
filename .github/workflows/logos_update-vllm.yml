name: Logos - Update vLLM

on:
  workflow_dispatch:
    inputs:
      vllm-version:
        type: string
        description: "vLLM version to pin (e.g. v0.25.1). Leave empty to use the latest PyPI release."
        default: ""
  schedule:
    # Hourly check for a new vLLM release on PyPI. Cheap: one PyPI API call +
    # one git ls-remote per run. If the Dockerfile pin is already current (or
    # an update PR/branch already exists), the run is a no-op.
    - cron: "17 * * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-vllm:
    runs-on: ubuntu-latest
    env:
      DOCKERFILE: logos/logos-workernode/Dockerfile
      EFFORT_MODULE: logos/logos-orchestrator/src/logos/pipeline/effort_normalization.py
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Use the PAT (when configured) for the branch push as well, so the
          # push and the PR are attributed to a real user and CI triggers on
          # the auto-created PR. Falls back to the default workflow token.
          token: ${{ secrets.LOGOS_VLLM_UPDATE_PAT || github.token }}

      - name: Determine target version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.vllm-version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            RAW="$INPUT_VERSION"
          else
            RAW=$(curl -fsSL https://pypi.org/pypi/vllm/json | jq -r '.info.version')
          fi
          # Normalize: strip an optional leading "v", validate it looks like a version.
          VERSION="${RAW#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?([.a-z0-9]*)?$'; then
            echo "::error::'$RAW' is not a valid vLLM version string"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=logos/vllm-$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target vLLM version: v$VERSION"

      - name: Check whether an update is needed
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          # The pin may carry extras (vllm[audio]==vX.Y.Z). Capture only the
          # version: matching the extras as part of it would make the pin never
          # compare equal to the PyPI version, and this workflow would open the
          # same "update" PR every hour.
          CURRENT=$(sed -nE 's/^ARG VLLM_PIP_SPEC="vllm(\[[^]]*\])?==v?([0-9][0-9a-z.]*)"$/\2/p' "$DOCKERFILE")
          echo "Current pin: v$CURRENT"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "Dockerfile already pins vllm==v$VERSION — nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Branch $BRANCH already exists — update PR is already open/pending."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Update Dockerfile pin
        if: steps.check.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Carry the current extras (e.g. [audio]) over to the new pin.
          # Rewriting the line as a bare "vllm==v<version>" would silently
          # uninstall the features that depend on them — the [audio] extra is
          # what makes /v1/audio/transcriptions able to decode uploads at all.
          EXTRA=$(sed -nE 's/^ARG VLLM_PIP_SPEC="vllm(\[[^]]*\])?==.*"$/\1/p' "$DOCKERFILE")
          sed -i -E "s|^ARG VLLM_PIP_SPEC=.*$|ARG VLLM_PIP_SPEC=\"vllm${EXTRA}==v$VERSION\"|" "$DOCKERFILE"
          grep -F "vllm${EXTRA}==v$VERSION" "$DOCKERFILE" >/dev/null || {
            echo "::error::Failed to update VLLM_PIP_SPEC in $DOCKERFILE"
            exit 1
          }
          git diff -- "$DOCKERFILE"

      - name: Update reasoning-effort snapshot label
        if: steps.check.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # VLLM_REASONING_EFFORT_VALUES documents which vLLM release its
          # Literal was copied from; without this the label drifts behind the
          # pin. Only the label is bumped — whether the tuple itself gained a
          # value is a review question, and runtime normalization is
          # drift-proof either way (unknown values fall back to the learned scale's
          # default). Non-fatal: a missing label must not block the pin bump.
          sed -i -E "s|^(# Snapshot of vLLM )[^ ]+('s ChatCompletionRequest\.reasoning_effort Literal,)$|\1$VERSION\2|" "$EFFORT_MODULE"
          if grep -Fq "# Snapshot of vLLM $VERSION's ChatCompletionRequest" "$EFFORT_MODULE"; then
            git diff -- "$EFFORT_MODULE"
          else
            echo "::warning::Could not update the vLLM snapshot label in $EFFORT_MODULE — update it by hand."
            git checkout -- "$EFFORT_MODULE"
          fi

      - name: Create branch, commit and pull request
        id: pr
        if: steps.check.outputs.needed == 'true'
        env:
          # PRs created with the default GITHUB_TOKEN do not trigger CI
          # workflows (recursive-workflow protection). Set the
          # LOGOS_VLLM_UPDATE_PAT secret (a PAT with repo scope) so the
          # PR's build/lint checks run automatically.
          GH_TOKEN: ${{ secrets.LOGOS_VLLM_UPDATE_PAT || github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$DOCKERFILE" "$EFFORT_MODULE"
          git commit -m "\`Logos\`: Update vLLM to v$VERSION"
          git push -u origin "$BRANCH"

          # Embed the upstream release notes in the PR body so reviewers do not
          # have to leave GitHub. Contributor lists are dropped (noise + size);
          # the rest is capped so we stay under GitHub's PR-body limit. Body
          # assembly is done in Python so shell never expands $ / backticks
          # inside the release markdown.
          BODY_FILE="$(mktemp)"
          NOTES_RAW="$(mktemp)"
          if ! gh release view "v$VERSION" --repo vllm-project/vllm --json body -q .body >"$NOTES_RAW" 2>/dev/null \
             || [ ! -s "$NOTES_RAW" ]; then
            echo "::warning::Could not fetch vLLM v$VERSION release notes; linking to the release page instead."
            : >"$NOTES_RAW"
          fi
          DOCKERFILE="$DOCKERFILE" EFFORT_MODULE="$EFFORT_MODULE" VERSION="$VERSION" \
          NOTES_RAW="$NOTES_RAW" BODY_FILE="$BODY_FILE" python3 <<'PY'
          import os, pathlib, re, textwrap

          version = os.environ["VERSION"]
          dockerfile = os.environ["DOCKERFILE"]
          effort_module = os.environ["EFFORT_MODULE"]
          release_url = f"https://github.com/vllm-project/vllm/releases/tag/v{version}"
          notes = pathlib.Path(os.environ["NOTES_RAW"]).read_text(encoding="utf-8").strip()
          if notes:
              notes = re.split(r"\n## (?:New )?Contributors\b", notes, maxsplit=1)[0].rstrip()
              # GitHub PR bodies are capped at 65536; leave room for the wrapper.
              max_notes = 50000
              if len(notes) > max_notes:
                  notes = notes[:max_notes].rstrip() + "\n\n… (truncated; see the full release page.)"
              notes_block = (
                  f"<details>\n<summary>vLLM v{version} release notes</summary>\n\n"
                  f"{notes}\n</details>"
              )
          else:
              notes_block = (
                  f"Release notes could not be fetched automatically — "
                  f"see [{release_url}]({release_url})."
              )

          body = textwrap.dedent(f"""\
          ## Motivation

          Keep the workernode's inference stack current: bump the default vLLM pin to [v{version}]({release_url}).

          ## Description

          Bumps the version in the `VLLM_PIP_SPEC` build arg default in `{dockerfile}` to v{version} — extras carried by the pin (e.g. `[audio]`, which the speech-to-text endpoints need) are preserved — and the `VLLM_REASONING_EFFORT_VALUES` snapshot label in `{effort_module}` alongside it. Torch and FlashInfer are resolved from vLLM's own dependency pins at build time, so no other changes are needed.

          Please check the release notes for new `ChatCompletionRequest.reasoning_effort` values: only the label is bumped automatically, the tuple is not. A new value must be placed in `EFFORT_LEVELS` (a unit test checks this); runtime normalization is unaffected either way — unknown values fall back to the learned scale's default.

          ## Release notes

          {{notes_block}}

          ---
          *This PR was created automatically by the `Logos - Update vLLM` workflow.*
          """)
          # notes_block is inserted after the f-string so release markdown cannot
          # accidentally introduce format placeholders.
          body = body.replace("{notes_block}", notes_block)
          pathlib.Path(os.environ["BODY_FILE"]).write_text(body, encoding="utf-8")
          PY
          rm -f "$NOTES_RAW"

          PR_URL=$(gh pr create \
            --title "\`Logos\`: Update vLLM to v$VERSION" \
            --body-file "$BODY_FILE")
          rm -f "$BODY_FILE"
          echo "Created $PR_URL"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Close superseded update PRs
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.LOGOS_VLLM_UPDATE_PAT || github.token }}
          BRANCH: ${{ steps.version.outputs.branch }}
          NEW_PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          # Any other open PR whose head branch matches logos/vllm-<version> is
          # an update PR for an older release, now superseded by the PR just
          # created. Close it and delete its branch. The [0-9] anchor keeps
          # non-version branches (e.g. logos/vllm-update-workflow) untouched.
          gh pr list --state open --limit 100 --json number,headRefName \
            | jq -r --arg branch "$BRANCH" \
                '.[]
                 | select(.headRefName != $branch)
                 | select(.headRefName | test("^logos/vllm-[0-9][0-9a-z.]*$"))
                 | .number' \
            | while read -r pr; do
                echo "Closing superseded update PR #$pr"
                gh pr close "$pr" --delete-branch \
                  --comment "Superseded by $NEW_PR_URL — a newer vLLM release is available."
              done
