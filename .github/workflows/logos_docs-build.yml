name: Build Logos Documentation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: tj-actions/changed-files@v45
        id: changed-docs
        with:
          files: logos/docs/**
      - uses: tj-actions/changed-files@v45
        id: changed-workflow
        with:
          files: .github/workflows/logos_docs-build.yml
      - id: changes
        run: |
          if [ "${{ steps.changed-docs.outputs.any_changed }}" = "true" ] || [ "${{ steps.changed-workflow.outputs.any_changed }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: logos/docs/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: logos/docs
      - name: Build documentation
        run: npm run build
        working-directory: logos/docs
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: logos-docs
          path: logos/docs/build
          retention-days: 1
