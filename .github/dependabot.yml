version: 2
updates:
  - package-ecosystem: "pip"
    directory: "iris"
    schedule:
      interval: "weekly"
    # Same limits as the Iris rules in renovate.json: Langfuse SDK 4+ drops
    # update_current_trace and SDK 5 needs a newer Langfuse server, and
    # weaviate-client 4.x requires protobuf below 7.
    ignore:
      - dependency-name: "langfuse"
        versions: [">=4"]
      - dependency-name: "protobuf"
        versions: [">=7"]
    groups:
      iris-python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
  # Athena is many small poetry projects rather than one. The globs cover the
  # top level, the sibling packages beside it (assessment_module_manager,
  # athena, evaluation, llm_core, tests) and the exercise modules
  # two levels down. Directories without a pip manifest, such as the docs and
  # playground npm projects, are simply skipped.
  - package-ecosystem: "pip"
    directories:
      - "athena"
      - "athena/*"
      - "athena/modules/*/*"
    schedule:
      interval: "weekly"
    groups:
      athena-python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
  # The npm side: two docusaurus sites and the Athena playground. Dependabot raises one pull request per directory.
  - package-ecosystem: "npm"
    directories:
      - "athena/docs"
      - "athena/playground"
      - "iris/docs"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
