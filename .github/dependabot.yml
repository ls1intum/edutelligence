version: 2
updates:
  - package-ecosystem: "pip"
    directory: "iris"
    schedule:
      interval: "weekly"
    groups:
      iris-python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
  # Athena is many small poetry projects rather than one. The globs cover the
  # top level, the sibling packages beside it (assessment_module_manager,
  # athena, evaluation, llm_core, log_viewer, tests) and the exercise modules
  # two levels down. Directories without a pip manifest, such as the docs and
  # playground npm projects, are simply skipped.
  - package-ecosystem: "pip"
    directories:
      - "athena"
      - "athena/*"
      - "athena/modules/*/*"
    schedule:
      interval: "weekly"
    groups:
      athena-python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "atlas/AtlasMl"
    schedule:
      interval: "weekly"
    groups:
      atlas-python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
  # The npm side: three docusaurus sites and the Athena playground. Dependabot raises one pull request per directory.
  - package-ecosystem: "npm"
    directories:
      - "athena/docs"
      - "athena/playground"
      - "atlas/docs"
      - "iris/docs"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
