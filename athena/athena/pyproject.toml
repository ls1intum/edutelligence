[tool.poetry]
name = "athena"
version = "3.0"
description = "This is a helper module for easier development of Athena modules. It provides communication functionality with the Assessment Module manager, as well as helper functions for storage."
authors = ["Paul Schwind <paul.schwind@tum.de>"]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.15,<3.16"
fastapi = "0.162.0"
uvicorn = "0.54.0"
httpx = "0.28.1"
gitpython = "3.2.1"
sqlalchemy = {extras = ["mypy"], version = "2.1.6"}
psycopg2 = "2.9.13"

[tool.poetry.group.dev.dependencies]
types-requests = "2.33.0.20261006"
pydantic = "2.14.1"
prospector = { version = "1.20.0", extras = ["with_mypy"] }

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
