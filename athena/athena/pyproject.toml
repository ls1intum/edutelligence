[tool.poetry]
name = "athena"
version = "2.7"
description = "This is a helper module for easier development of Athena modules. It provides communication functionality with the Assessment Module manager, as well as helper functions for storage."
authors = ["Paul Schwind <paul.schwind@tum.de>"]
license = "MIT"

[tool.poetry.dependencies]
python = "3.14.*"
fastapi = "0.141.1"
uvicorn = "0.52.3"
httpx = "0.28.1"
gitpython = "3.1.59"
sqlalchemy = {extras = ["mypy"], version = "2.0.52"}
psycopg2 = "2.9.12"

[tool.poetry.group.dev.dependencies]
types-requests = "2.33.0.20260712"
pydantic = "2.13.4"
prospector = { version = "1.19.1", extras = ["with_mypy"] }

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
