[tool.poetry]
name = "evaluation"
version = "3.0"
description = ""
authors = ["Dominik Remo <47261058+DominikRemo@users.noreply.github.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "3.15.*"
pandas = "2.3.3"
matplotlib = "3.11.2"
langid = "1.1.6"
mysql-connector-python = "9.7.0"
python-dotenv = "1.2.4"
langchain-openai = "^1.8.0"
langchain = "^1.5.0"
langchain-community = "^0.4.2"
ipykernel = "7.4.0"
tqdm = "4.70.1"

# Security floors for packages that are otherwise transitive only. Without
# these, regenerating poetry.lock can resolve back onto a vulnerable release.
aiohttp = ">=3.14.3"
orjson = ">=3.11.6"
pillow = ">=12.3.0"
tornado = ">=6.5.8"
urllib3 = ">=2.7.0"
Pygments = ">=2.20.0"
fonttools = ">=4.60.2"
requests = ">=2.33.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
