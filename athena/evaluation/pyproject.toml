[tool.poetry]
name = "evaluation"
version = "2.7"
description = ""
authors = ["Dominik Remo <47261058+DominikRemo@users.noreply.github.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "3.12.*"
pandas = "2.2.3"
matplotlib = "3.10.0"
langid = "1.1.6"
mysql-connector-python = "9.1.0"
python-dotenv = "1.2.2"
langchain-openai = "^1.1.14"
langchain = "^1.3.9"
langchain-community = "^0.4.2"
ipykernel = "7.2.0"
tqdm = "4.67.3"

# Security floors for packages that are otherwise transitive only. Without
# these, regenerating poetry.lock can resolve back onto a vulnerable release.
aiohttp = ">=3.14.3"
langchain-classic = ">=1.0.7"
langsmith = ">=0.8.18"
orjson = ">=3.11.6"
pillow = ">=12.3.0"
tornado = ">=6.5.8"
urllib3 = ">=2.7.0"
httpcore2 = ">=2.10.0"
httpx2 = ">=2.12.0"
Pygments = ">=2.20.0"
fonttools = ">=4.60.2"
marshmallow = ">=3.26.2"
requests = ">=2.33.0"
langgraph = ">=1.0.10"
langgraph-checkpoint = ">=4.1.1"
langgraph-sdk = ">=0.3.15"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
