[tool.poetry]
name = "atlasml"
version = "2.7"
description = ""
authors = ["Maximilian Anzinger <anzinger@cit.tum.de>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.141.1"
uvicorn = "^0.53.0"
weaviate-client = "^4.23.1"
datasets = "^5.0.1"
sentence-transformers = "^6.0.1"
pydantic-settings = "^2.15.0"
matplotlib = "^3.11.2"
scipy = "^1.18.1"
apscheduler = "^3.11.3"
openai = "==3.13.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.69.1"}
markdown = "^3.10.3"
bs4 = "^0.0.2"

# Security floors for packages that are otherwise transitive only. Without
# these, regenerating poetry.lock can resolve back onto a vulnerable release.
aiohttp = ">=3.14.3"
pillow = ">=12.3.0"
protobuf = ">=5.29.6"
soupsieve = ">=2.8.4"
urllib3 = ">=2.7.0"
# weaviate-client enforces a protobuf/grpcio pairing at import time
# (weaviate/proto/v1/__init__.py): protobuf >= 6.30.0 requires grpcio
# >= 1.72.0. Keep grpcio above that line so a protobuf 6 resolution cannot
# land next to a grpcio that rejects it.
grpcio = ">=1.72.0"
cryptography = ">=50.0.0"
pyarrow = ">=23.0.1"
starlette = ">=1.3.1"
transformers = ">=5.10.0"
filelock = ">=3.20.3"
fonttools = ">=4.60.2"
idna = ">=3.15"
python-dotenv = ">=1.2.2"
requests = ">=2.33.0"
setuptools = ">=83.0.0"
torch = ">=2.13.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-cov = "^7.1.0"
ruff = "^0.16.7"
black = "^26.3.1"


[tool.poetry.group.test.dependencies]
pytest = "^8.4.2"
pytest-asyncio = "^1.4.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Enable all rules by default
lint.select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
lint.ignore = []

# Allow autofix for all enabled rules (when `--fix` is used)
lint.fixable = ["ALL"]
lint.unfixable = []

# Exclude a variety of commonly ignored directories.
lint.exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.12
target-version = "py312"

[tool.ruff.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.per-file-ignores]
"tests/*" = ["PLR2004"]  # Ignore magic number warnings in tests

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"