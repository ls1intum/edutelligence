[tool.poetry]
name = "memiris"
version = "2.7"
description = ""
authors = ["Timor Morrien <timor.morrien@tum.de>"]
readme = "README.md"
packages = [
    {include = "memiris", from = "src"},
    {include = "memiris_tests", from = "tests"}
]
include = ["src/memiris/py.typed"]

[tool.poetry.dependencies]
python = ">=3.13,<4.0.0"
weaviate-client = "^4.23.1"
jinja2 = "^3.1.6"
ollama = "^0.6.2"
openai = ">=2.54,<4.0"
pylint-per-file-ignores = "^3.2.1"
langfuse = "^4.15.2"
langchain = "^1.4.0"
langchain-classic = "^1.0.7"
langchain-core = "^1.3.3"
langchain-community = "^0.4.2"
langchain-ollama = "^1.1.0"
langchain-openai = "^1.6.2"

# Security floors for packages that are otherwise transitive only. Without
# these, regenerating poetry.lock can resolve back onto a vulnerable release.
aiohttp = ">=3.14.3"
langgraph-checkpoint = ">=3.0.0"
langsmith = ">=0.8.18"
orjson = ">=3.11.6"
protobuf = ">=5.29.6"
urllib3 = ">=2.7.0"
cryptography = ">=50.0.0"
httpcore2 = ">=2.10.0"
httpx2 = ">=2.12.0"
# weaviate-client enforces a protobuf/grpcio pairing at import time
# (weaviate/proto/v1/__init__.py): protobuf >= 6.30.0 requires grpcio
# >= 1.72.0. Pin grpcio to match rather than relying on it resolving high
# enough on its own.
grpcio = ">=1.78.0"

[tool.poetry.group.dev.dependencies]
mypy = "^2.3.1"
pylint = "^4.0.8"
black = "^26.3.1"
isort = "^9.0.1"
yamllint = "^1.38.0"
bandit = "^1.9.4"
pytest = "^9.1.1"
coverage = "^7.16.0"
detect-secrets = "^1.5.0"
prettier = "^0.0.7"
pre-commit = "^4.6.2"
types-PyYAML = "^6.0.12.20260906"
types-requests = "^2.33.0.20260906"
# testcontainers is held below 4.15.0: that release makes the Weaviate module
# create its own docker network, which fails with
# "invalid pool request: Pool overlaps with other one on this address space"
# and takes the whole weaviate suite down (35 errors). Reproduced on CI and
# locally; 4.14.2 is the newest release that works. Revisit when upstream fixes
# it -- 4.15.0 is currently the latest.
testcontainers = ">=4.14.2,<4.16.0"
pytest-mock = "^3.15.1"

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B311"]

[tool.mypy]

[[tool.mypy.overrides]]
module = "langfuse.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pylint."MESSAGES CONTROL"]
disable = ["not-context-manager"]

[tool.coverage.run]
branch = true
source = ["src"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
# fail_under = 80
# omit = ["tests/*", "your_module_name/__init__.py"]

[tool.coverage.html]
directory = "htmlcov"

[virtualenvs]
create = true
in-project = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
