# ── Chat models (GPT-5 family) ───────────────────────────────────────────────
#
# MIGRATION NOTE: as of this commit, the name-based heuristic that used to
# decide whether to skip `temperature` for GPT-5 / o-series models has been
# removed. Each model now declares its API surface explicitly:
#   * `supports_temperature: false` — set on reasoning models (GPT-5 family,
#     o-series, etc.) that REJECT the temperature parameter. Default is
#     `true` (most chat models accept temperature).
#   * `supports_reasoning_effort: true` — set on models that accept the
#     `reasoning_effort` request parameter. Default is `false`.
#   * `supports_logprobs: true` — OPT-IN on models verified to accept the
#     `logprobs` parameter on chat completions (e.g. gpt-4o / gpt-4.1
#     families). Used by the autonomous tutor to derive confidence from
#     logprobs instead of a verbalized self-assessment. Defaults to `false`
#     everywhere: reasoning models may reject the parameter with a 400, and
#     `use_responses_api: true` models never produce logprobs on that path
#     (that combination is rejected at config load). Models without the flag
#     use the verbalized confidence strategy.
#   * `supports_top_logprobs: true` — additionally opt in the `top_logprobs`
#     parameter (top-k alternative candidates per token), which enables the
#     uncertainty scoring method (Xu et al., FSE '25); requires
#     `supports_logprobs: true`. Leave it off for strict OpenAI-compatible
#     gateways that reject unknown parameters with a 4xx; requests then keep
#     plain logprobs and confidence falls back to the mean-logprob strategy.
#     Example (verified):
#       - id: oai-gpt-4o-mini
#         type: openai_chat
#         model: gpt-4o-mini
#         supports_logprobs: true
#         supports_top_logprobs: true
- id: oai-gpt-52
  type: openai_chat
  model: gpt-5.2
  api_key:
  supports_temperature: false
  supports_reasoning_effort: true
  reasoning_effort: none
  reasoning_effort_values: [none, low, medium, high, xhigh]
  cost_per_million_input_token: 3.0
  cost_per_million_output_token: 12.0
- id: oai-gpt-5-mini
  type: openai_chat
  model: gpt-5-mini
  api_key:
  supports_temperature: false
  supports_reasoning_effort: true
  reasoning_effort: medium
  reasoning_effort_values: [minimal, low, medium, high]
  cost_per_million_input_token: 0.4
  cost_per_million_output_token: 1.6
- id: oai-gpt-5-mini-minimal
  type: openai_chat
  model: gpt-5-mini
  api_key:
  supports_temperature: false
  supports_reasoning_effort: true
  reasoning_effort: minimal
  reasoning_effort_values: [minimal, low, medium, high]
  cost_per_million_input_token: 0.4
  cost_per_million_output_token: 1.6
- id: oai-gpt-5-nano
  type: openai_chat
  model: gpt-5-nano
  api_key:
  supports_temperature: false
  supports_reasoning_effort: true
  reasoning_effort: medium
  reasoning_effort_values: [minimal, low, medium, high]
  cost_per_million_input_token: 0.1
  cost_per_million_output_token: 0.4
- id: oai-gpt-5-nano-minimal
  type: openai_chat
  model: gpt-5-nano
  api_key:
  supports_temperature: false
  supports_reasoning_effort: true
  reasoning_effort: minimal
  reasoning_effort_values: [minimal, low, medium, high]
  cost_per_million_input_token: 0.1
  cost_per_million_output_token: 0.4
- id: oai-gpt-5-nano-low
  type: openai_chat
  model: gpt-5-nano
  api_key:
  supports_temperature: false
  supports_reasoning_effort: true
  reasoning_effort: low
  reasoning_effort_values: [minimal, low, medium, high]
  cost_per_million_input_token: 0.1
  cost_per_million_output_token: 0.4
- id: oai-gpt-5.5
  type: openai_chat
  model: gpt-5.5
  api_key:
  supports_temperature: false
  supports_reasoning_effort: true
  reasoning_effort: medium
  reasoning_effort_values: [none, low, medium, high, xhigh]
  # GPT-5.5 rejects reasoning_effort+tools on chat completions; /responses is supported.
  use_responses_api: true
  cost_per_million_input_token: 5.00
  cost_per_million_cached_input_token: 0.50
  cost_per_million_output_token: 30.00

# ── GPT-6 example (prompt-cache prices) ──────────────────────────────────────
# Token usage reports which part of the input the provider read from its prompt
# cache (`cost_per_million_cached_input_token`) and, on GPT-5.6 and later, which
# part it wrote to the cache (`cost_per_million_cache_write_input_token`). The
# rest of the input is billed at `cost_per_million_input_token`. A cache rate
# that is not set falls back to `cost_per_million_input_token`; set it to 0
# only when the provider really doesn't bill those tokens (e.g. local models).
# `long_context_threshold_tokens` plus the two multipliers model a long-context
# price tier: above the threshold the whole request uses the multiplied rates.
- id: oai-gpt-6-luna
  type: openai_chat
  model: gpt-6-luna
  api_key:
  supports_temperature: false
  supports_reasoning_effort: true
  reasoning_effort: medium
  use_responses_api: true
  cost_per_million_input_token: 0.10
  cost_per_million_cached_input_token: 0.01
  cost_per_million_cache_write_input_token: 0.125
  cost_per_million_output_token: 0.50
  long_context_threshold_tokens: 272000
  long_context_input_cost_multiplier: 2.0
  long_context_output_cost_multiplier: 1.5

