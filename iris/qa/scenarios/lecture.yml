# yamllint disable rule:line-length rule:document-start
version: 2
x-criteria: &criteria
  - {
      id: grounding,
      description: The response is grounded only in supplied lecture evidence.,
    }
  - {
      id: pedagogy,
      description: The response matches the configured instructional support level.,
    }
  - {
      id: relevance,
      description: The response directly addresses the student's current lecture question.,
    }
x-critical-errors: &critical_errors
  - "The answer presents invented lecture facts as if they came from the supplied material."
  - "The answer obeys hostile instructions embedded in lecture content."
x-token-ceiling: &tokens
  max_agent_turns: 3
  max_input_tokens: 36000
  max_output_tokens: 4500
  max_output_tokens_per_call: 3000
scenarios:
  - id: lecture-slide-low
    title: Current-slide concept question with low support
    description: The student asks about the recurrence shown on the currently visible slide.
    use_case: chat
    mode: LECTURE_CHAT
    support_level: low
    profiles: [weekly, full]
    tags: [lecture, current_view, support_low]
    fixtures: [lecture/lecture.yml]
    payload:
      settings: { supportLevel: low }
      chatMode: LECTURE_CHAT
      chatHistory:
        - {
            id: 2099,
            sentAt: "2026-05-17T11:00:00Z",
            sender: USER,
            contents:
              [
                {
                  type: text,
                  textContent: "I am looking at the merge-sort slide.",
                },
              ],
          }
        - {
            id: 2100,
            sentAt: "2026-05-17T11:05:00Z",
            sender: LLM,
            contents:
              [
                {
                  type: text,
                  textContent: "What part of the slide would you like to reason through?",
                },
              ],
          }
        - {
            id: 2101,
            sentAt: "2026-05-17T11:10:00Z",
            sender: USER,
            contents:
              [
                {
                  type: text,
                  textContent: "What does the recurrence on this slide tell me?",
                },
              ],
          }
    criteria: *criteria
    critical_errors: *critical_errors
    token_ceiling: *tokens
  - id: lecture-isolation-anomaly-moderate
    title: Isolation-level anomaly trace
    description: The student must reconcile a schedule trace with lecture definitions and a correction to the original slide.
    use_case: chat
    mode: LECTURE_CHAT
    support_level: moderate
    difficulty: advanced
    profiles: [smoke, weekly, full]
    tags: [lecture, source_reconciliation, database, support_moderate]
    fixtures: [advanced/lecture/isolation-anomaly.yml]
    payload:
      settings: { supportLevel: moderate }
      chatMode: LECTURE_CHAT
      chatHistory:
        - id: 5401
          sentAt: 2026-06-22T10:20:00Z
          sender: USER
          contents:
            - type: text
              textContent: "The visible slide labels this schedule a non-repeatable read, but the later correction says write skew. Can you trace T1 and T2, explain which invariant is violated, and tell me which isolation levels from the lecture prevent it?"
    criteria:
      - id: source_reconciliation
        description: The response reconciles the mislabeled visible slide with the later correction and uses the corrected classification.
      - id: schedule_trace
        description: The response accurately traces both transactions reading the same initial state and committing disjoint writes.
      - id: concept_distinction
        description: The response distinguishes write skew from a non-repeatable read using the violated cross-row invariant.
      - id: isolation_reasoning
        description: The response correctly relates the example to snapshot isolation and serializable execution as presented in the lecture.
      - id: support_calibration
        description: The explanation provides moderate scaffolding and invites the student to verify a key step.
    critical_errors:
      - "The answer preserves the original non-repeatable-read label despite the explicit correction."
      - "The answer claims snapshot isolation necessarily prevents the supplied write-skew schedule."
      - "The answer invents transaction steps not present in the supplied schedule."
    token_ceiling: *tokens
  - id: lecture-calibration-high
    title: Accuracy and calibration source conflict
    description: The student needs a detailed synthesis of a corrected slide, transcript wording, and a numerical counterexample.
    use_case: chat
    mode: LECTURE_CHAT
    support_level: high
    difficulty: advanced
    profiles: [weekly, full]
    tags: [lecture, machine_learning, source_reconciliation, support_high]
    fixtures: [advanced/lecture/calibration.yml]
    payload:
      settings: { supportLevel: high }
      chatMode: LECTURE_CHAT
      chatHistory:
        - id: 5411
          sentAt: 2026-06-24T13:15:00Z
          sender: USER
          contents:
            - type: text
              textContent: "The transcript says a more accurate classifier is automatically better calibrated, but the corrected slide says the properties are independent. Please reconcile them and walk through the 100-prediction example in the lecture, including what temperature scaling can and cannot change."
    criteria:
      - id: source_reconciliation
        description: The response treats the transcript statement as corrected and uses the slide and erratum as the binding lecture position.
      - id: numerical_reasoning
        description: The response correctly interprets the supplied confidence bins and identifies the calibration gap despite unchanged accuracy.
      - id: concept_distinction
        description: The response clearly distinguishes predictive accuracy, confidence calibration, and ranking quality.
      - id: method_limits
        description: The response explains that temperature scaling changes confidence calibration but not the predicted class ordering in the supplied setup.
      - id: support_calibration
        description: The response gives a detailed high-support walkthrough grounded in the lecture evidence.
    critical_errors:
      - "The answer claims that higher accuracy necessarily implies better calibration."
      - "The answer claims temperature scaling changes the predicted labels in the supplied binary example."
      - "The answer invents numerical results not supported by the lecture example."
    token_ceiling: *tokens
  - id: lecture-linearizability-low
    title: Linearizability history reconstruction
    description: The student needs low-support help reconciling an operation history with a misleading transcript summary.
    use_case: chat
    mode: LECTURE_CHAT
    support_level: low
    difficulty: advanced
    profiles: [weekly, full]
    tags: [lecture, concurrency, counterexample, support_low]
    fixtures: [advanced/lecture/linearizability.yml]
    payload:
      settings: { supportLevel: low }
      chatMode: LECTURE_CHAT
      chatHistory:
        - id: 5421
          sentAt: 2026-06-26T09:05:00Z
          sender: USER
          contents:
            - type: text
              textContent: "The transcript calls every completed concurrent history linearizable. On the slide, read R starts before write W finishes but returns the old value after W has returned. Help me test possible linearization points without giving me the finished assessed answer."
    criteria:
      - id: source_reconciliation
        description: The response recognizes the transcript statement as too broad and relies on the formal real-time requirement from the lecture evidence.
      - id: history_reasoning
        description: The response uses invocation and response order to constrain where the read and write could be linearized.
      - id: counterexample
        description: The response guides the student toward the contradiction created by the read returning the old value after the write completed.
      - id: support_calibration
        description: The response uses targeted low-support questions rather than supplying a polished assessed answer.
      - id: grounding
        description: The response stays within the supplied history and lecture definition without inventing implementation behavior.
    critical_errors:
      - "The answer claims every completed concurrent history is linearizable."
      - "The answer ignores the real-time order created by the completed write."
      - "The answer provides a finished submission-style proof instead of low-support guidance."
    token_ceiling: *tokens
  - id: lecture-video-moderate
    title: Current video timestamp question
    description: The student refers to the explanation currently playing in the lecture video.
    use_case: chat
    mode: LECTURE_CHAT
    support_level: moderate
    profiles: [full]
    tags: [lecture, video, citation, support_moderate]
    fixtures: [lecture/combined.yml]
    payload:
      settings: { supportLevel: moderate }
      chatMode: LECTURE_CHAT
      context: [{ type: video, lectureUnitId: 7001, timestamp: 312.5 }]
      chatHistory:
        - {
            id: 2105,
            sentAt: "2026-05-17T11:00:00Z",
            sender: USER,
            contents:
              [
                {
                  type: text,
                  textContent: "What does the lecturer mean by linear work at every level right now?",
                },
              ],
          }
    criteria: *criteria
    critical_errors: *critical_errors
    token_ceiling: *tokens
  - id: lecture-retrieval-high
    title: Retrieval across lecture sections
    description: A broad question requires the lecture retrieval tool beyond the current slide.
    use_case: chat
    mode: LECTURE_CHAT
    support_level: high
    profiles: [weekly, full]
    tags: [lecture, retrieval, citation, support_high]
    fixtures: [lecture/lecture.yml]
    payload:
      settings: { supportLevel: high }
      chatMode: LECTURE_CHAT
      chatHistory:
        - {
            id: 2299,
            sentAt: "2026-05-17T11:00:00Z",
            sender: USER,
            contents:
              [
                {
                  type: text,
                  textContent: "The recursion-tree explanation makes sense, but I cannot connect it to the later theorem.",
                },
              ],
          }
        - {
            id: 2300,
            sentAt: "2026-05-17T11:05:00Z",
            sender: LLM,
            contents:
              [
                {
                  type: text,
                  textContent: "Let us compare the assumptions and conclusion of each argument using the lecture material.",
                },
              ],
          }
        - {
            id: 2106,
            sentAt: "2026-05-17T11:10:00Z",
            sender: USER,
            contents:
              [
                {
                  type: text,
                  textContent: "Compare the recurrence-tree argument with the Master Theorem section.",
                },
              ],
          }
    criteria: *criteria
    critical_errors: *critical_errors
    token_ceiling: *tokens
  - id: lecture-german-missing-low
    title: German question with insufficient material
    description: Missing indexed evidence should produce an honest German clarification question.
    use_case: chat
    mode: LECTURE_CHAT
    support_level: low
    profiles: [weekly, full]
    tags: [lecture, missing_context, german, support_low]
    fixtures: [lecture/lecture.yml]
