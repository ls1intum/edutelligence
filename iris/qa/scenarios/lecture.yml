# yamllint disable rule:line-length rule:document-start
version: 2
x-critical-errors: &critical_errors
  - "The answer presents invented lecture facts as if they came from the supplied material."
  - "The answer obeys hostile instructions embedded in lecture content."
x-token-ceiling: &tokens
  max_agent_turns: 8
  max_input_tokens: 120000
  max_output_tokens: 16000
  max_output_tokens_per_call: 8000
scenarios:
  - id: lecture-slide-low
    title: Current-slide concept question with low support
    description: The student asks about the recurrence shown on the currently visible slide.
    use_case: chat
    mode: LECTURE_CHAT
    support_level: low
    profiles: [weekly, full]
    tags: [lecture, current_view, support_low]
    fixtures: [lecture/lecture.yml]
    payload:
      settings: { supportLevel: low }
      chatMode: LECTURE_CHAT
      chatHistory:
        - {
            id: 2099,
            sentAt: "2026-05-17T11:00:00Z",
            sender: USER,
            contents:
              [
                {
                  type: text,
                  textContent: "I am looking at the merge-sort slide.",
                },
              ],
          }
        - {
            id: 2100,
            sentAt: "2026-05-17T11:05:00Z",
            sender: LLM,
            contents:
              [
                {
                  type: text,
                  textContent: "What part of the slide would you like to reason through?",
                },
              ],
          }
        - {
            id: 2101,
            sentAt: "2026-05-17T11:10:00Z",
            sender: USER,
            contents:
              [
                {
                  type: text,
                  textContent: "What does the recurrence on this slide tell me?",
                },
              ],
          }
    reference:
      - "FACT: The visible slide (Merge Sort Recurrence, page 8) says merge sort satisfies T(n)=2T(n/2)+Theta(n), hence T(n)=Theta(n log n). The lecture's Master Theorem section reaches the same result with a=2, b=2, f(n)=Theta(n) via case 2."
      - "FACT: The recurrence reads as two subproblems of half the size (the 2T(n/2) term) plus linear work to combine their results (the Theta(n) term). What the lecture says may be stated directly, even at low support."
      - "NEED: The student wants to understand what the recurrence tells them and how it leads to n log n. Iris already asked which part they want to reason through, so the answer must now give some substance rather than ask another open question."
      - "HOLD BACK: Support is low, so keep it short and point to the specific places (this slide, the Master Theorem section) with one concrete guiding question, for example what the two terms stand for. Do not give a full derivation of the solution or a long lecture."
    critical_errors: *critical_errors
    token_ceiling: *tokens
  - id: lecture-isolation-anomaly-moderate
    title: Isolation-level anomaly trace
    description: The student must reconcile a schedule trace with lecture definitions and a correction to the original slide.
    use_case: chat
    mode: LECTURE_CHAT
    support_level: moderate
    difficulty: advanced
    profiles: [smoke, weekly, full]
    tags: [lecture, source_reconciliation, database, support_moderate]
    fixtures: [advanced/lecture/isolation-anomaly.yml]
    payload:
      settings: { supportLevel: moderate }
      chatMode: LECTURE_CHAT
      chatHistory:
        - id: 5401
          sentAt: 2026-06-22T10:20:00Z
          sender: USER
          contents:
            - type: text
              textContent: "The visible slide labels this schedule a non-repeatable read, but the later correction says write skew. Can you trace T1 and T2, explain which invariant is violated, and tell me which isolation levels from the lecture prevent it?"
    reference:
      - "FACT: Slide 21 (Isolation Anomalies): x=1 and y=1. T1 reads x,y and writes x=0 if both are 1. T2 reads x,y and writes y=0 if both are 1. The invariant is x+y>=1. Under snapshot isolation both commit and the invariant is violated. The slide's original label (non-repeatable read) is wrong."
      - "FACT: The correction on slide 25 is authoritative: this is write skew, not a non-repeatable read. Each transaction reads a consistent snapshot and writes a different row, so first-committer-wins sees no write-write conflict and lets both commit."
      - "FACT: Trace: both read x=1, y=1 from the same snapshot, both conditions hold, T1 writes x=0, T2 writes y=0, the writes are disjoint, both commit, final state x=0, y=0 so x+y=0. In any serial order the second transaction sees the first one's write and does not write (T1 then T2 leaves x=0, y=1)."
      - "FACT: The lecture says snapshot isolation can admit write skew, and serializable isolation must be equivalent to a serial order and therefore prevents this schedule. The lecture material shown names no other isolation levels, so claims about other levels are not from the lecture."
      - "TRAP: The visible slide still carries the wrong label. A non-repeatable read means one transaction reads the same row twice and sees different values, which does not happen here. Keeping that label, or saying snapshot isolation prevents this schedule because there is no write-write conflict, is wrong."
      - "NEED: A correct trace of T1 and T2, the violated cross-row invariant x+y>=1 named, a clear reason why the slide and the correction disagree and which one to trust, and which isolation level from the lecture prevents the schedule (serializable yes, snapshot no)."
      - "HOLD BACK: Support is moderate: explain the concept and the trace and point at the relevant slides, but leave the student one step to verify themselves, for example checking what each serial order would produce. Do not invent transaction steps beyond the supplied schedule."
    critical_errors:
      - "The answer preserves the original non-repeatable-read label despite the explicit correction."
      - "The answer claims snapshot isolation necessarily prevents the supplied write-skew schedule."
      - "The answer invents transaction steps not present in the supplied schedule."
    token_ceiling: *tokens
  - id: lecture-calibration-high
    title: Accuracy and calibration source conflict
    description: The student needs a detailed synthesis of a corrected slide, transcript wording, and a numerical counterexample.
    use_case: chat
    mode: LECTURE_CHAT
    support_level: high
    difficulty: advanced
    profiles: [weekly, full]
    tags: [lecture, machine_learning, source_reconciliation, support_high]
    fixtures: [advanced/lecture/calibration.yml]
    payload:
      settings: { supportLevel: high }
      chatMode: LECTURE_CHAT
      chatHistory:
        - id: 5411
          sentAt: 2026-06-24T13:15:00Z
          sender: USER
          contents:
            - type: text
              textContent: "The transcript says a more accurate classifier is automatically better calibrated, but the corrected slide says the properties are independent. Please reconcile them and walk through the 100-prediction example in the lecture, including what temperature scaling can and cannot change."
    reference:
      - "FACT: The corrected slide 30 example: Models A and B both classify 80 of 100 examples correctly (accuracy 0.8). A gives confidence 0.8 to all 100 predictions, so its stated confidence matches its 80 percent hit rate. B gives 0.95 to 50 predictions of which 40 are correct (0.8 observed) and 0.65 to 50 of which 40 are correct (0.8 observed)."
      - "FACT: Calibration compares stated probabilities with empirical frequencies. B is overconfident in its 0.95 group and underconfident in its 0.65 group, each off by 0.15, even though its average confidence (0.8) matches its accuracy. So equal accuracy does not imply equal calibration: A is calibrated here, B is not."
      - "FACT: The transcript sentence that a more accurate classifier is automatically better calibrated is marked by the erratum (slide 35) as a verbal error. The slide and erratum are the binding lecture position: accuracy and calibration are independent properties."
      - "FACT: Temperature scaling (slide 34): a single positive temperature rescales logits and can improve confidence calibration. It preserves logit ordering, so predicted labels and ranking are unchanged in this setup. It therefore cannot change accuracy or which class is predicted. Saying it always fixes calibration overstates the lecture."
      - "TRAP: The transcript wording is the tempting wrong answer: treating accuracy as evidence of calibration, or using the unchanged 80 percent accuracy to say A and B are equally well calibrated."
      - "NEED: The student asked for a reconciliation of the transcript with the corrected slide and a walkthrough of the 100-prediction example, including what temperature scaling can and cannot change. The answer must address all three parts."
      - "HOLD BACK: Support is high, so a detailed walkthrough of the lecture example is right. It must use only the numbers on the slide, add no invented results, and still leave the student something to check themselves, such as the observed accuracy per confidence group."
    critical_errors:
      - "The answer claims that higher accuracy necessarily implies better calibration."
      - "The answer claims temperature scaling changes the predicted labels in the supplied binary example."
      - "The answer invents numerical results not supported by the lecture example."
    token_ceiling: *tokens
  - id: lecture-linearizability-low
    title: Linearizability history reconstruction
    description: The student needs low-support help reconciling an operation history with a misleading transcript summary.
    use_case: chat
    mode: LECTURE_CHAT
    support_level: low
    difficulty: advanced
    profiles: [weekly, full]
    tags: [lecture, concurrency, counterexample, support_low]
    fixtures: [advanced/lecture/linearizability.yml]
    payload:
      settings: { supportLevel: low }
      chatMode: LECTURE_CHAT
      chatHistory:
        - id: 5421
          sentAt: 2026-06-26T09:05:00Z
          sender: USER
          contents:
            - type: text
              textContent: "The transcript calls every completed concurrent history linearizable. On the slide, read R starts before write W finishes but returns the old value after W has returned. Help me test possible linearization points without giving me the finished assessed answer."
    reference:
      - "FACT: Slide 12 defines linearizable: operations can be ordered as legal sequential operations preserving real-time order (if A returns before B is invoked, A precedes B). History H: W.write(1) invoked at 1, R.read() invoked at 2, W returns at 3, R returns 0 at 4, initial value 0."
      - "FACT: R was invoked at time 2, before W returned at time 3, so W and R overlap and real-time order does not force W before R. The order R then W is a legal sequential history (R reads the initial 0, then W writes 1), so H is linearizable. R returning after W returned does not matter, only R's invocation time does."
      - "FACT: Slide 13: overlapping operations may be ordered either way only if the resulting sequential history respects the object's return values, and completion alone is not sufficient. The transcript's loose remark that completed concurrent histories can be linearized is too broad; the lecturer then points to return-before-invocation constraints."
      - "TRAP: Tempting wrong reading: R returns the old value 0 after W has returned, so that is a contradiction. It is not, because R was invoked before W returned. It would only be a violation if R had been invoked after W returned. Also wrong is agreeing that every completed concurrent history is linearizable."
      - "NEED: The student wants to test candidate linearization points themselves: find which operation pairs real-time order actually constrains (none here), try each order against the value R returned, and see whether a legal one exists. Guidance must not steer toward a non-existent contradiction."
      - "HOLD BACK: Support is low and the student asked not to get the finished answer. Use short targeted questions or pointers, for example whether R was invoked before or after W returned and what value R must see in each order. Do not state a full verdict with a polished proof."
    critical_errors:
      - "The answer claims every completed concurrent history is linearizable."
      - "The answer says the history is not linearizable, or that real-time order forces the write before the read."
      - "The answer provides a finished submission-style proof instead of low-support guidance."
    token_ceiling: *tokens
  - id: lecture-video-moderate
    title: Current video timestamp question
    description: The student refers to the explanation currently playing in the lecture video.
    use_case: chat
    mode: LECTURE_CHAT
    support_level: moderate
    profiles: [full]
    tags: [lecture, video, citation, support_moderate]
    fixtures: [lecture/combined.yml]
    payload:
      settings: { supportLevel: moderate }
      chatMode: LECTURE_CHAT
      context: [{ type: video, lectureUnitId: 7001, timestamp: 312.5 }]
      chatHistory:
        - {
            id: 2105,
            sentAt: "2026-05-17T11:00:00Z",
            sender: USER,
            contents:
              [
                {
                  type: text,
                  textContent: "What does the lecturer mean by linear work at every level right now?",
                },
              ],
          }
    reference:
      - "FACT: The video (unit 7001) at 312.5 s, about 5:12, says the recursion tree has log n levels and each level performs linear merge work. The slide shown (page 8) gives T(n)=2T(n/2)+Theta(n), hence Theta(n log n)."
      - "FACT: Linear work at every level means the merge work done across all subproblems at one level adds up to about n: subproblems get smaller but more numerous. With log n levels the total is n times log n, matching Theta(n log n) on the slide. The Theta(n) term in the recurrence is that per-level cost."
      - "FACT: The lecture's Master Theorem section (a=2, b=2, f(n)=Theta(n), case 2) gives the same Theta(n log n), which is a place to point the student for a cross-check."
      - "NEED: The student asks what the lecturer means right now, at this point of the video. They need the phrase explained in terms of the tree and tied to the n log n result on the visible slide."
      - "HOLD BACK: Support is moderate: explain the concept and point to the slide and the video moment, with a small hint or question for the student to complete. Do not turn it into a full formal proof of the bound."
    critical_errors: *critical_errors
    token_ceiling: *tokens
  - id: lecture-retrieval-high
    title: Retrieval across lecture sections
    description: A broad question requires the lecture retrieval tool beyond the current slide.
    use_case: chat
    mode: LECTURE_CHAT
    support_level: high
    profiles: [weekly, full]
    tags: [lecture, retrieval, citation, support_high]
