  - id: lecture-dijkstra-erratum-moderate
    title: Dijkstra wording conflict and counterexample
    description: The student must reconcile a verbal slip, the visible invariant, an erratum, and a negative-edge trace.
    use_case: chat
    mode: LECTURE_CHAT
    support_level: moderate
    difficulty: advanced
    profiles: [weekly, full]
    tags: [lecture, source_reconciliation, counterexample, support_moderate]
    fixtures: [challenge/lecture/dijkstra-erratum.yml]
    payload:
      settings: { supportLevel: moderate }
      chatMode: LECTURE_CHAT
      chatHistory:
        - id: 5431
          sentAt: 2026-06-17T10:55:00Z
          sender: USER
          contents:
            - type: text
              textContent: "The video says Dijkstra needs positive weights, the visible slide says non-negative, and someone told me a negative edge is fine if there is no negative cycle. Can you reconcile the lecture sources and trace the supplied s-a-b example?"
    reference:
      - "FACT: Slide 14 states the invariant: when a vertex u is removed from the priority queue with minimum tentative distance, dist[u] is final, provided every edge weight is non-negative. The video says 'positive' while summarizing the slide, then points back to the displayed non-negative assumption."
      - "FACT: The erratum (slide 18) says 'positive' at 08:42 is a verbal slip. Zero-weight edges are permitted. The proof needs w(u,v)>=0 so extending a path cannot lower its length. Non-negative is the lecture's condition; zero-weight edges do not break the invariant."
      - "FACT: Slide 19 counterexample: s->a=2, s->b=5, b->a=-4. Dijkstra removes a first with distance 2 and settles it. Then b is processed and the edge b->a gives 5-4=1, shorter than 2, but implementations that never reopen settled vertices keep 2. The true shortest distance to a is 1 via s->b->a."
      - "FACT: Bellman-Ford (preview slide) handles negative edges and reports reachable negative cycles. It has a different invariant and runtime, so it is the place for graphs with negative edges."
      - "TRAP: The claim that a negative edge is fine as long as there is no negative cycle. The example graph has no cycle at all and still breaks a Dijkstra that never reopens settled vertices. Shortest paths being well defined is not the same as Dijkstra's invariant holding. Also wrong: calling zero-weight edges a violation."
      - "NEED: The student wants the three sources reconciled (video 'positive', slide non-negative, the no-negative-cycle claim) and the s-a-b example traced to see premature distance 2 versus the later 1."
      - "HOLD BACK: Support is moderate: explain the concept and point at the slides, but keep a meaningful step for the student, for example finishing the b->a relaxation or deciding what a settled vertex's distance should be. Do not present rules the lecture does not state as lecture content."
    critical_errors:
      - "The answer says a zero-weight edge violates the lecture's Dijkstra precondition."
      - "The answer says the supplied negative-edge graph is safe for an implementation that never reopens settled vertices."
      - "The answer presents an unsupported rule as if it were stated in the lecture."
    token_ceiling: *tokens
