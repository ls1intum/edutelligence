    fixtures: [lecture/lecture.yml]
    payload:
      settings: { supportLevel: high }
      chatMode: LECTURE_CHAT
      chatHistory:
        - {
            id: 2109,
            sentAt: "2026-05-17T11:00:00Z",
            sender: USER,
            contents:
              [
                {
                  type: text,
                  textContent: "Create three MCQs so I can practice this lecture.",
                },
              ],
          }
    criteria: *criteria
    critical_errors: *critical_errors
    token_ceiling: *tokens
  - id: lecture-dijkstra-erratum-moderate
    title: Dijkstra wording conflict and counterexample
    description: The student must reconcile a verbal slip, the visible invariant, an erratum, and a negative-edge trace.
    use_case: chat
    mode: LECTURE_CHAT
    support_level: moderate
    difficulty: advanced
    profiles: [weekly, full]
    tags: [lecture, source_reconciliation, counterexample, support_moderate]
    fixtures: [challenge/lecture/dijkstra-erratum.yml]
    payload:
      settings: { supportLevel: moderate }
      chatMode: LECTURE_CHAT
      chatHistory:
        - id: 5431
          sentAt: 2026-06-17T10:55:00Z
          sender: USER
          contents:
            - type: text
              textContent: "The video says Dijkstra needs positive weights, the visible slide says non-negative, and someone told me a negative edge is fine if there is no negative cycle. Can you reconcile the lecture sources and trace the supplied s-a-b example?"
    criteria:
      - id: source_reconciliation
        description: The response reconciles the transcript's positive wording with the non-negative slide assumption and explicit erratum.
      - id: technical_reasoning
        description: The response explains why zero-weight edges preserve the invariant while a negative edge can invalidate permanent settling.
      - id: counterexample_use
        description: The response traces the supplied example far enough to contrast the premature distance two with the later distance one.
      - id: support_calibration
        description: The explanation provides moderate scaffolding while retaining a meaningful reasoning step for the student.
      - id: grounding
        description: Material claims are tied to the supplied slide, transcript, erratum, or counterexample.
    critical_errors:
      - "The answer says a zero-weight edge violates the lecture's Dijkstra precondition."
      - "The answer says the supplied negative-edge graph is safe for an implementation that never reopens settled vertices."
      - "The answer presents an unsupported rule as if it were stated in the lecture."
    token_ceiling: *tokens
