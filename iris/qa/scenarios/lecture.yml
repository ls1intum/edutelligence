          }
        - {
            id: 2106,
            sentAt: "2026-05-17T11:10:00Z",
            sender: USER,
            contents:
              [
                {
                  type: text,
                  textContent: "Compare the recurrence-tree argument with the Master Theorem section.",
                },
              ],
          }
    reference:
      - "FACT: Slide 8 (Merge Sort Recurrence) states T(n)=2T(n/2)+Theta(n), hence T(n)=Theta(n log n). The Master Theorem section, found only through retrieval and not on the current slide, says that for a=2, b=2 and f(n)=Theta(n), case 2 yields Theta(n log n)."
      - "FACT: Both arguments reach Theta(n log n). Tree view: log n levels each costing about linear work. Theorem view: plug a=2, b=2, f(n)=Theta(n) into the theorem. Case 2 (standard knowledge) is the situation where f(n) matches n^(log_b a)=n, so every level costs about the same and the levels multiply the cost."
      - "NEED: The student understands the tree but cannot connect it to the theorem. They need the two arguments compared, with the assumptions and conclusion of each, and an explicit link from the tree's per-level work and number of levels to the theorem's parameters. Iris already announced this comparison, so it must be delivered."
      - "HOLD BACK: Support is high, so a detailed connecting explanation with a rich example is appropriate. Do not present theorem cases or lecture content beyond what the retrieved text supports as if it were in the lecture, and leave the student a question to apply the link, for example what changes if the merge cost were different."
    critical_errors: *critical_errors
    token_ceiling: *tokens
