  - id: text-causal-claim-low
    title: Correlation and causal-claim diagnosis
    description: The student needs low-support help finding selection bias and reverse-causality gaps in a short empirical argument.
    use_case: chat
    mode: TEXT_EXERCISE_CHAT
    support_level: low
    difficulty: advanced
    profiles: [weekly, full]
    tags: [text, causal_reasoning, evidence, support_low]
    fixtures: [advanced/text/causal-claim.yml]
    payload:
      settings: { supportLevel: low }
      chatMode: TEXT_EXERCISE_CHAT
      chatHistory:
        - id: 5521
          sentAt: 2026-06-27T09:30:00Z
          sender: USER
          contents:
            - type: text
              textContent: "My draft concludes that attending optional tutorials causes higher exam scores because attendees averaged twelve points more. Ask me the right questions to find what is missing; please don't rewrite it."
    reference:
      - "FACT: The data: 180 students; 60 voluntarily attended at least four optional tutorials and averaged 78 exam points, the other 120 averaged 66 (a 12-point difference). Nobody was randomly assigned. Attendees entered with an average prior-course grade of 1.7 versus 2.5 for non-attendees, so the groups already differed before the tutorials."
      - "FACT: The draft's claims fail: a large sample reduces random error but not systematic selection bias, so it cannot rule out selection. A difference in group averages is not an effect on 'every student', and an observational comparison cannot 'prove' a causal effect."
      - "FACT: The draft dismisses reverse causality by assuming that only students expecting to do well stay away. That direction is asserted without evidence; stronger or more motivated students may be the ones who attend, so attendance may partly reflect performance rather than cause it. The grade scale is not stated; on the common 1.0 to 5.0 scale lower is better, so attendees were likely stronger entrants."
      - "FACT: What the data supports is a descriptive 12-point association. A causal conclusion would need random assignment or at least comparison of students with similar prior achievement, adjustment for prior grade, or before/after data, and even then unmeasured motivation would remain. No regression results or other figures are given and none should be invented."
      - "NEED: The student asked to be asked the right questions. They need to be led, by questions, to compare attendees and non-attendees before the tutorials (the prior-grade figures) and to ask who chooses to attend and why, so that they discover the gap in their own causal claim."
      - "HOLD BACK: Low support: a few short, specific guiding questions (for example pointing at the prior-grade figures and at the word 'voluntarily' in the problem statement), not an explanation of selection bias, not an exhaustive list of the draft's errors, and no rewrite of the argument."
      - "TRAP: The draft's 'large sample' and reverse-causality reasoning sound technical and may be accepted or only half challenged. Also tempting: delivering the full diagnosis despite low support, or inventing regression or p-value results."
    critical_errors:
      - "The answer endorses the twelve-point difference as a causal effect."
      - "The answer invents random assignment or baseline equivalence."
      - "The answer rewrites the student's argument into a finished submission."
    token_ceiling: *tokens
  - id: text-amortized-proof-moderate
    title: Amortized-analysis proof repair
    description: The draft mixes aggregate and accounting arguments and double-counts array-copy costs.
    use_case: chat
    mode: TEXT_EXERCISE_CHAT
    support_level: moderate
    difficulty: advanced
    profiles: [weekly, full]
    tags: [text, proof_review, amortized_analysis, support_moderate]
    fixtures: [advanced/text/amortized-proof.yml]
    payload:
      settings: { supportLevel: moderate }
      chatMode: TEXT_EXERCISE_CHAT
      chatHistory:
        - id: 5531
          sentAt: 2026-06-30T11:10:00Z
          sender: USER
          contents:
            - type: text
              textContent: "I tried to prove dynamic-array append is O(1) amortized, but my sum says O(n log n) and my credit argument seems to pay for copies twice. Help me separate the approaches and repair the reasoning, not write the proof for me."
    reference:
      - "FACT: With doubling, resizes happen when the array holds 1, 2, 4, 8, ... elements and each copies that many. These copy costs form a geometric series summing to less than 2n, so n appends cost n insertions plus under 2n copies, below 3n, which is O(n). The draft's n log n multiplies the number of resizes by the largest copy; most resizes copy far less, so it is a loose upper bound, not the true cost."
      - "FACT: Charging three credits per append (one for the insertion, two saved) is a valid accounting scheme: when a full array of capacity m is reached, the m/2 elements added since the previous resize carry m saved credits, enough to pay for copying all m elements. The draft's flaw is not the credit count but spending the saved credits at the resize and also adding the actual copy cost, so the same copy is paid twice."
      - "FACT: Aggregate and accounting analyses are separate proofs of the same O(n) bound. The draft mixes them and says credits plus direct costs give O(n) 'even though' the aggregate gives O(n log n). Two correct analyses cannot give different true totals; the true total lies between n and 3n, so the n log n figure is just a poor bound that signals an error in that sum."
      - "NEED: The student has to find why their sum overshoots (what each resize actually copies, and how those costs add up as a series) and why saved credits must not be counted on top of the direct copy cost. They need to separate the two methods and choose one clean proof."
      - "HOLD BACK: Moderate support: explain the concepts and give targeted hints (for example ask what each resize really copies, or where the credits at a resize come from), but do not write the completed summation or a credit invariant ready to paste, and do not give a finished proof."
      - "TRAP: The credit details look right (three credits, two saved), so the tempting wrong fixes are to change the credit count, to call the aggregate method itself wrong rather than the sum too loose, to accept n log n as correct, or to merge the two methods into one argument."
    critical_errors:
      - "The answer endorses the draft's O(n log n) total copying cost for geometric capacity doubling."
      - "The answer uses the same operation credits twice to pay for one resize."
      - "The answer replaces the draft with a complete submission-ready proof."
    token_ceiling: *tokens
  - id: text-experiment-report-high
    title: Leakage and uncertainty in an experiment report
    description: The report combines train-test leakage, repeated test-set tuning, and an unsupported significance claim.
    use_case: chat
    mode: TEXT_EXERCISE_CHAT
    support_level: high
    difficulty: advanced
    profiles: [weekly, full]
    tags: [text, experiment, statistics, support_high]
    fixtures: [advanced/text/experiment-report.yml]
    payload:
      settings: { supportLevel: high }
      chatMode: TEXT_EXERCISE_CHAT
      chatHistory:
        - id: 5541
          sentAt: 2026-07-02T10:00:00Z
          sender: USER
          contents:
            - type: text
              textContent: "Please give detailed feedback on my evaluation section. I normalized before splitting, chose the model after checking the test set six times, and called a 0.7-point gain significant without intervals. Help me plan a defensible re-evaluation without writing the section for me."
    reference:
      - "FACT: The draft standardized all 1,200 examples and then split 80/20 (960 train, 240 test). Fitting the scaling on all data lets test examples influence preprocessing, which is leakage. Preprocessing statistics must be learned on training data only (within each training fold if cross-validating) and then applied to held-out data."
      - "FACT: Six variants were trained and the test accuracy checked after each, keeping the best. That is model selection on the test set, so the reported 84.8% is optimistically biased and the test set is no longer untouched, which the task requires. Selection needs separate validation data (a validation split or cross-validation, nested if tuning and estimating together), with the final test used once. This test set was already consulted six times, so a fresh split is needed."
      - "FACT: Reported accuracies are 84.1% for the baseline and 84.8% for the selected model, a 0.7 point difference of roughly 1 to 2 of 240 test examples. Having 240 examples does not make a difference significant: one accuracy near 84% on 240 examples has a standard error of about 2.4 points. No interval, test or repeated run was reported, so the significance claim is unsupported (not proven false)."
      - "NEED: The student wants detailed feedback and a plan for a defensible re-evaluation. They need an ordered plan: split first and reserve the test set, fit preprocessing on training data only, select models on validation evidence, evaluate baseline and chosen model once on the untouched test set, then report a paired comparison with uncertainty (repeated runs or an interval) and word the conclusion accordingly."
      - "HOLD BACK: High support: detailed step by step reasoning and examples from a different domain (for instance practising on a copy of the exam) are expected, but no replacement text for the evaluation section and no pre-computed final intervals or test results."
      - "TRAP: The draft pairs correct-looking arithmetic with the phrase 'statistically significant'. Tempting wrong moves: treating normalizing first as harmless, accepting 240 examples as justification, or overcorrecting by declaring the difference definitively non-significant or computing a p-value from data that was not given."
    critical_errors:
      - "The answer says normalizing before the split is harmless."
      - "The answer treats repeated test-set tuning as an unbiased final evaluation."
      - "The answer calls the reported gain statistically significant without supporting uncertainty evidence."
    token_ceiling: *tokens
  - id: text-astar-proof-high
    title: Interacting A-star proof errors
    description: The student needs detailed feedback on numerical admissibility errors and an invalid no-reopen argument.
    use_case: chat
    mode: TEXT_EXERCISE_CHAT
    support_level: high
    difficulty: advanced
    profiles: [smoke, weekly, full]
    tags: [text, proof_review, multi_error, support_high]
    fixtures: [challenge/text/astar-review.yml]
    payload:
      settings: { supportLevel: high }
      chatMode: TEXT_EXERCISE_CHAT
      chatHistory:
        - id: 5551
          sentAt: 2026-06-17T11:55:00Z
          sender: USER
          contents:
            - type: text
              textContent: "Please review every step of my A-star argument. Check the actual heuristic numbers, whether admissibility implies consistency, and whether my implementation may permanently close nodes. Give detailed revision guidance but do not write the final submission."
    reference:
      - "FACT: Graph edges: s->a=2, s->b=2, a->b=0.5, b->g=2. True remaining costs are d(a,g)=0.5+2=2.5 and d(b,g)=2. The draft's h(a)=3 exceeds 2.5, so it is NOT admissible, contrary to the draft's claim that every value is at most the true remaining cost. h(b)=1 and h(g)=0 are fine."
      - "FACT: The proposed increase h(b)=2.5 is also inadmissible because d(b,g)=2. The justification 'the best complete route from s costs 4' (true: s->b->g) uses the wrong quantity: admissibility compares h(n) with the remaining cost from n, so for b the bound is 2, not 4."
      - "FACT: Admissibility does not imply consistency. 'f never decreases along an edge' is what consistency gives, which needs h(n) <= c(n,n') + h(n') on every edge. On a->b the draft's values give 3 > 0.5 + 1, and f(a)=2+3=5 while f of b reached through a is 2.5+1=3.5, a decrease. Lowering h(a) to 2.5 would not fix it while h(b)=1."
