      - "FACT: The exercise asks to compare BFS and DFS for finding routes: completeness, memory use and when shortest-path guarantees apply. The draft claims BFS is always faster, DFS cannot find shortest paths, BFS uses less memory because it does not recurse, and BFS suits every route planner. Several are wrong or too strong, and completeness is missing."
      - "FACT: Correct background for checking claims: both searches take O(V+E); BFS finds a fewest-edge path, which is shortest only for unweighted or equal-cost edges; DFS finds a path if one exists but not necessarily a shortest one; BFS may hold O(V) nodes in its frontier while DFS holds the current path; with a visited set both are complete on finite graphs."
