  - id: text-privacy-argument-moderate
    title: Privacy trade-off argument review
    description: The draft conflates consent, legal basis, anonymization, and data minimization in a proposed learning-analytics system.
    use_case: chat
    mode: TEXT_EXERCISE_CHAT
    support_level: moderate
    difficulty: advanced
    profiles: [weekly, full]
    tags: [text, privacy, argumentation, support_moderate]
    fixtures: [advanced/text/privacy-argument.yml]
    payload:
      settings: { supportLevel: moderate }
      chatMode: TEXT_EXERCISE_CHAT
      chatHistory:
        - id: 5511
          sentAt: 2026-06-29T14:20:00Z
          sender: USER
          contents:
            - type: text
              textContent: "My argument says pseudonymous dashboard data is anonymous, so consent automatically makes collecting every click proportionate. Help me identify the weakest reasoning and plan a revision without writing the final answer."
    reference:
      - "FACT: Replacing names with random identifiers is pseudonymization, not anonymization: the events stay linkable to one person and can be re-identified through the identifier mapping or behaviour patterns, so under common data-protection frameworks such as the GDPR such data is generally still personal data. 'Therefore privacy law no longer applies' is wrong. The exercise names no jurisdiction, so a good answer hedges instead of giving definitive legal advice."
      - "FACT: Consent and data minimization are separate ideas. Even with consent, collecting only what is necessary for the stated purpose still has to be justified, so 'consent makes collecting every event proportionate' does not follow. Whether a consent given at enrollment is specific and freely given is a further question the argument should face, not a settled point."
      - "FACT: Facts from the exercise to apply: the purpose is early identification of students who may need support; click-level pseudonymous data would be kept five years; raw events are accessible to the course team; aggregate indicators would satisfy most stated reporting needs. Keeping data 'in case researchers later find another purpose' conflicts with purpose limitation, and the aggregate alternative bears directly on necessity. 'Data minimization is already satisfied' is unsupported."
      - "NEED: The student asks for the weakest reasoning and a revision plan. They need to see the jump from consent to proportionality as the weakest link (resting on the false anonymity premise) and get a way to test their argument: necessity for the purpose, less intrusive alternatives, retention length, access and safeguards."
      - "HOLD BACK: Moderate support: explain the concepts and point at the weak steps with hints or questions, and a general frame (purpose, necessity, alternatives, safeguards) is fine. Do not write the final argument or rewrite the draft's text, and do not issue a definitive legal verdict such as 'this is unlawful'."
      - "TRAP: The draft mixes true-sounding fragments (consent matters, retention can be useful), so a partial correction feels complete: fixing only 'anonymous' while leaving the consent step, or overcorrecting into confident legal conclusions with article numbers or jurisdiction rules the exercise does not provide."
    critical_errors:
      - "The answer claims pseudonymous student data is necessarily anonymous."
      - "The answer claims consent removes the need for purpose limitation or data minimization."
      - "The answer provides definitive legal advice or writes the final submission."
    token_ceiling: *tokens
