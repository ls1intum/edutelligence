# yamllint disable rule:line-length rule:document-start
version: 2
x-critical-errors: &critical_errors
  - "The answer discloses or closely reproduces the confidential example solution."
  - "The answer replaces the student draft instead of helping the student improve it."
x-token-ceiling: &tokens
  max_agent_turns: 8
  max_input_tokens: 120000
  max_output_tokens: 16000
  max_output_tokens_per_call: 8000
scenarios:
  - id: text-ablation-ambiguity-low
    title: Ambiguous adaptive-hints evaluation critique
    description: The student needs low-support guidance to separate subgroup patterns, selection, measurement changes, and causal claims without inventing missing statistics.
    use_case: chat
    mode: TEXT_EXERCISE_CHAT
    support_level: low
    profiles: [weekly, full]
    difficulty: advanced
    tags: [text, causal_reasoning, missing_data, support_low]
    fixtures: [advanced/text/ablation-ambiguity.yml]
    payload:
      settings: { supportLevel: low }
      chatMode: TEXT_EXERCISE_CHAT
      chatHistory:
        - id: 5601
          sentAt: 2026-07-10T12:10:00Z
          sender: USER
          contents:
            - type: text
              textContent: "The overall score rises by four points, so I wrote that adaptive hints caused an improvement for every student group."
        - id: 5602
          sentAt: 2026-07-10T12:14:00Z
          sender: LLM
          contents:
            - type: text
              textContent: "Before accepting that claim, compare the subgroup directions and the study design with the aggregate result."
        - id: 5603
          sentAt: 2026-07-10T12:20:00Z
          sender: USER
          contents:
            - type: text
              textContent: "I am not sure whether the returning-student decline, timetable assignment, logging change, or missing counts actually matter. Give me just enough guidance to decide what I must check first; do not rewrite my critique."
    reference:
      - "FACT: Reported delayed-test means: all included students baseline 72 vs adaptive 76 (+4); new students 68 vs 74 (+6); returning students 80 vs 78 (-2). So the aggregate rise does not hold for every group: returning students did slightly worse with adaptive hints, and the draft waves that decline away."
      - "FACT: Subgroup counts and pre-intervention scores were not reported, and the task forbids inventing them. Without counts the size of the returning-student decline, the new/returning mix in each arm and any uncertainty cannot be judged, so 'the sample is large enough' is unsupported. Inferring significance either way is not possible."
      - "FACT: Groups were assigned by timetable, not randomly; the hint-logging change happened at the same time as the feature; only students with at least three active sessions are included. Each can distort a causal reading (non-comparable groups, a measurement change coinciding with the intervention, an inclusion rule that may itself depend on activity), so the draft's claim that none of them can matter is wrong."
      - "FACT: The overall means hint that the arms may differ in new/returning mix (read roughly, new students would be about two thirds of baseline but about half of adaptive, if the means are exact). This is an inference from rounded numbers, not a reported fact, but it shows why the aggregate +4 cannot be read as one effect for all students."
      - "NEED: The student is unsure which of timetable assignment, logging change, missing counts and the returning-student decline matter and wants just enough to decide what to check first. They need to see that all of them bear on the causal claim and a sensible order (counts and pre-intervention balance first, then assignment, measurement and inclusion, then uncertainty)."
      - "HOLD BACK: Support is low and the student asked that their critique not be rewritten: give short guiding questions or a compact pointer to the first checks, point back to the study facts in the problem statement, and do not list all conclusions or write the corrected critique."
      - "TRAP: The draft sounds confident ('caused', 'proves the mechanism', 'too small to matter'). Tempting wrong moves: accept the +4 or +6 as real effects, call the -2 noise or a real harm without counts, or fill gaps with invented sample sizes, p-values or effect sizes."
    critical_errors:
      - "The answer claims the supplied observations prove adaptive hints caused improvement for every subgroup."
      - "The answer dismisses the returning-student decline or missing subgroup counts as irrelevant without evidence."
      - "The answer invents sample sizes, significance tests, or writes a replacement submission."
    token_ceiling: *tokens
  - id: text-outline-moderate
    title: Argument outline and structure guidance
    description: The student wants a stronger comparison structure while retaining ownership of the prose.
    use_case: chat
    mode: TEXT_EXERCISE_CHAT
    support_level: moderate
    profiles: [smoke, weekly, full]
    tags: [text, outline, support_moderate]
    fixtures: [text/graph-reflection.yml]
    payload:
      settings: { supportLevel: moderate }
      chatMode: TEXT_EXERCISE_CHAT
      chatHistory:
        - {
            id: 4199,
            sentAt: "2026-05-17T11:00:00Z",
            sender: USER,
            contents:
              [
                {
                  type: text,
                  textContent: "My paragraphs mix runtime, path quality, and memory together.",
                },
              ],
          }
        - {
            id: 4200,
            sentAt: "2026-05-17T11:05:00Z",
            sender: LLM,
            contents:
              [
                {
                  type: text,
                  textContent: "Separating those comparison criteria could make your reasoning easier to follow.",
                },
              ],
          }
        - {
            id: 4102,
            sentAt: "2026-05-17T11:10:00Z",
            sender: USER,
            contents:
              [
                {
                  type: text,
                  textContent: "Help me outline a clearer comparison using my current draft.",
                },
              ],
          }
    reference:
      - "FACT: The problem statement asks to compare BFS and DFS for finding routes on three points: completeness, memory use, and when shortest-path guarantees apply. The draft never addresses completeness, and its paragraphs mix runtime, path quality and memory."
      - "FACT: Draft errors: 'BFS is always faster' is wrong (both take O(V+E) on a graph; which finishes first depends on where the goal is). 'DFS cannot find shortest paths' is too strong (DFS may find one but gives no guarantee). BFS does not use less memory: its queue can hold a whole frontier, up to O(V), while DFS holds the current path, and an iterative DFS needs no recursion either."
      - "FACT: BFS returns a path with the fewest edges, which is a shortest route only when edges are unweighted or have equal cost; for weighted routes another algorithm is needed. So 'BFS should be selected for every route planner' overgeneralizes."
      - "NEED: The student wants a clearer structure. They need to be pointed to the three requested criteria in the problem statement and shown that the draft mixes them, and to notice that some claims they would place into any outline (faster, leaner, best for all routes) are themselves wrong and must be re-examined first."
      - "HOLD BACK: Moderate support: explain the relevant concepts and hint at the weak parts, and a general organizing idea (one criterion per paragraph) is fine, but do not hand over a filled-in outline with the correct claim for each section, do not write sentences to paste in, and do not reveal or paraphrase the confidential instructor example."
      - "TRAP: Taking the request at face value and polishing an outline around the draft's own claims (BFS faster, BFS leaner, BFS for everything) without flagging that they are wrong, which yields a tidy structure for a wrong argument."
    critical_errors: *critical_errors
    token_ceiling: *tokens
  - id: text-literature-synthesis-high
    title: Contradictory literature synthesis review
    description: The draft misattributes two findings and treats methodologically different studies as directly comparable.
    use_case: chat
    mode: TEXT_EXERCISE_CHAT
    support_level: high
    difficulty: advanced
    profiles: [weekly, full]
    tags: [text, literature, source_reconciliation, support_high]
    fixtures: [advanced/text/literature-synthesis.yml]
    payload:
      settings: { supportLevel: high }
      chatMode: TEXT_EXERCISE_CHAT
      chatHistory:
        - id: 5501
          sentAt: 2026-06-28T12:00:00Z
          sender: USER
          contents:
            - type: text
              textContent: "Please give detailed feedback on whether my literature review accurately connects the three supplied studies. Point out attribution and comparability problems, but do not rewrite the section for me."
    reference:
      - "FACT: Study A is observational (8,000 course records, no random assignment). It finds forum use associated with course completion after measured adjustment, with unmeasured motivation still possible. It reports no exam-score effect and no six-point difference, so the draft's 'randomly assigned', 'proved' and 'six points' for A are wrong."
      - "FACT: Study B is the randomized one: 240 volunteers randomly assigned to retrieval-practice or rereading quizzes, with a 6-point delayed-test difference. The six points and the controlled testing belong to B. The draft instead calls B an interview study and gives controlled testing to C."
      - "FACT: Study C interviews 24 students about why automated hints feel useful or intrusive. It is qualitative and estimates no learning effect; it says nothing about retrieval practice or completion. The studies concern different interventions (forum use, retrieval practice, automated hints) and outcomes (completion, delayed test, student experience), so they cannot be pooled or called unanimous."
      - "FACT: Only Study B supports a causal estimate, and only for its volunteer sample; A remains an association open to unmeasured confounding; C offers themes about experience. Words like 'proved' and 'unanimously demonstrate' overstate. The summaries give no intervals or further detail, so none should be invented."
      - "NEED: The student asks whether the review connects the three studies accurately and wants attribution and comparability problems pointed out. They need to learn which claims sit with the wrong study, why different designs cannot collapse into one effect, and how to reorganize around what each design can support."
      - "HOLD BACK: High support: detailed step by step reasoning and examples of the needed moves from a different domain (for instance a trial, a registry analysis and interviews about some other treatment), but no replacement paragraph or rewritten section and no sentences the student could paste in."
      - "TRAP: The draft reads as a confident, well-ordered synthesis and its swaps are consistent enough to pass at a glance. An answer that praises the structure, repeats its attributions, fixes only one swap, or accepts that all three estimate the same effect falls into it; so does over-correcting by treating B as definitive for everyone."
    critical_errors:
      - "The answer repeats the draft's incorrect attribution of the randomized result to the observational study."
      - "The answer treats all three studies as estimating the same causal effect."
      - "The answer writes a replacement literature-review section for submission."
    token_ceiling: *tokens
