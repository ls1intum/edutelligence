      user: { langKey: de }
      chatMode: COURSE_CHAT
      chatHistory:
        - {
            id: 3112,
            sentAt: "2026-05-17T11:00:00Z",
            sender: USER,
            contents:
              [
                {
                  type: text,
                  textContent: "Erstelle drei Multiple-Choice-Fragen zu Sortieralgorithmen.",
