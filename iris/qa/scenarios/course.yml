  - id: course-one-mcq-moderate
    title: One course MCQ for practice
    description: An explicit request for one question should produce the single-MCQ widget contract.
    use_case: chat
    mode: COURSE_CHAT
    support_level: moderate
    profiles: [weekly, full]
    tags: [course, mcq, support_moderate]
    fixtures: [base/chat.yml]
    payload:
      settings: { supportLevel: moderate }
      chatMode: COURSE_CHAT
      chatHistory:
        - {
            id: 3109,
            sentAt: "2026-05-16T10:00:00Z",
            sender: USER,
            contents:
              [
                {
                  type: text,
                  textContent: "Give me one MCQ about stable sorting.",
                },
              ],
          }
        - id: 3110
          sentAt: "2026-05-16T10:00:12Z"
          sender: LLM
          contents:
            - type: json
              jsonContent:
                type: mcq
                question: Which algorithm is stable in its usual implementation?
                options:
                  - { text: Selection sort, correct: false }
                  - { text: Insertion sort, correct: true }
                  - { text: Heap sort, correct: false }
                  - { text: Quicksort, correct: false }
                explanation: Insertion sort preserves the order of equal keys.
                response: { selectedIndex: 1, submitted: true }
        - {
            id: 3111,
            sentAt: "2026-05-16T10:01:00Z",
            sender: USER,
            contents:
              [
                {
                  type: text,
                  textContent: "That was too easy. Give me one harder MCQ about insertion sort.",
                },
              ],
          }
    criteria: *criteria
