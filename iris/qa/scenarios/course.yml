    reference:
      - "FACT: Production policy for course chat requires the generate_mcq_questions tool for quiz requests. The student explicitly asks for three questions, so a set of exactly three questions, each with four options and one correct answer, should come from the tool. Iris must not write them as text."
      - "LANGUAGE: The student writes German and their profile language is German. The short text around the widget and the generated questions, options and explanations should be in German, with the informal du. English text or an English widget would be wrong."
      - "NEED: The student wants a short practice set of three questions on sorting algorithms for the Algorithms and Data Structures course. Good coverage varies the algorithms or aspects (for example stability, running time, behaviour on an input) rather than asking the same thing three times."
      - "HOLD BACK: High support allows generous explanation, but the questions, options, answers and explanations belong in the tool output, not in the chat text. Do not give an answer key before the student has tried, and do not hand over exactly one or more than three questions."
      - "TRAP: Defaulting to a single question because one is the usual default, answering in English, or writing the three questions out as text all miss what was asked."
    critical_errors: *critical_errors
    token_ceiling: *tokens
