  - id: prog-hm-inference-high
    title: Higher-order type-inference investigation
    description: The student needs to connect three higher-order failures to interactions among scheme instantiation, free-variable analysis, unification, and substitution semantics.
    use_case: chat
    mode: PROGRAMMING_EXERCISE_CHAT
    support_level: high
    difficulty: advanced
    profiles: [weekly, full]
    tags: [programming, multi_file, type_systems, state_reasoning, support_high]
    fixtures: [advanced/programming/hm-inference.yml]
    payload:
      settings: { supportLevel: high }
      chatMode: PROGRAMMING_EXERCISE_CHAT
      chatHistory:
        - id: 5101
          sentAt: 2026-07-23T14:50:00Z
          sender: USER
          contents:
            [
              {
                type: text,
                textContent: "The basic identity tests and the test using id once at Int and once at Bool both pass. An earlier assistant therefore said let-polymorphism must be correct and blamed the expression parser.",
              },
            ]
        - id: 5102
          sentAt: 2026-07-23T15:10:00Z
          sender: USER
          contents:
            [
              {
                type: text,
                textContent: "The parser regression group passes. Please inspect the latest repository and reconstruct the three higher-order failures. Decide whether they share one cause, trace the relevant type variables and substitutions, and give me tests that distinguish the responsibilities without writing the finished inferencer.",
              },
            ]
    reference:
      - "FACT: Submission 941 builds and the public tests pass. The hidden higher-order group has 3 failed and 7 passed, while the parser and AST regression groups pass (12 passed). The parser is therefore not the cause, and the earlier assistant's claim is unsupported."
      - "FACT: Failure 1 (let id used at Int and again as a generic function): Scheme.instantiate in scheme.py ignores its `fresh` argument and renames the quantified variables to TVariable(0), TVariable(1) and so on at every use. Constraining one use of id (to Int) therefore constrains the later use, giving Int to Int. The Int and Bool test passes because each use's result type is already concrete before the shared variable matters."
      - "FACT: Failure 2 (lambda x. x x): free_type_variables in types.py returns only the variables of a function type's result and skips its argument. The occurs check in _bind uses it, so binding a variable to a type that contains it in argument position is accepted and a recursive-looking type is returned instead of InfiniteTypeError. Generalization in let uses the same helper."
      - "FACT: Failure 3 (lambda f. lambda x. f (f x)): Substitution.compose in substitution.py merges two dictionaries without applying the later substitution to the earlier mapping's values, and lets the earlier mapping win on a clash; apply_type replaces a variable by its mapped type in one step without applying again. Chains such as a1 to a2 and a2 to a3 are not followed, so f's argument and result stay different variables."
      - "FACT: The three failures come from three different defects in three places (scheme instantiation, the free-variable helper, substitution composition and application). They do not share one cause."
      - "NEED: The student wants all three failures reconstructed with the relevant type variables and substitutions traced, a verdict on whether they share a cause, and small tests that separate the responsibilities, without the finished inferencer."
      - "HOLD BACK: High support allows a detailed conceptual walkthrough and small diagnostic traces. It must not supply corrected instantiate, free-variable, compose or apply code, or a complete or near-complete Algorithm W implementation."
      - "TRAP: Blaming the parser, treating the passing Int and Bool test as proof that instantiation is fresh, or explaining all three failures with a single cause."
    critical_errors:
      - "The answer treats the parser as the main cause despite the passing parser and AST regression groups."
      - "The answer concludes that passing concrete Int and Bool uses proves every scheme instantiation is fresh."
      - "The answer reveals a complete or near-complete Algorithm W implementation."
    token_ceiling:
      max_agent_turns: 8
      max_input_tokens: 240000
      max_output_tokens: 16000
      max_output_tokens_per_call: 8000
