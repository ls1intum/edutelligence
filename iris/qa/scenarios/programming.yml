  - id: prog-off-by-one-high
    title: High-support off-by-one debugging
    description: Detailed feedback should include a small trace and targeted correction direction.
    use_case: chat
    mode: PROGRAMMING_EXERCISE_CHAT
    support_level: high
    profiles: [weekly, full]
    tags: [programming, feedback, off_by_one, support_high]
