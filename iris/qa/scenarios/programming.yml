    criteria: *criteria
    critical_errors: *critical_errors
    token_ceiling: *tokens
  - id: prog-incremental-workbook-high
    title: Incremental workbook state investigation
    description: Three order-dependent failures must be traced across cache identity, graph invalidation, and recursive evaluation state without anchoring on the student's fixed parser defect.
    use_case: chat
    mode: PROGRAMMING_EXERCISE_CHAT
    support_level: high
    difficulty: advanced
    profiles: [weekly, full]
    tags:
      [programming, multi_file, graph_reasoning, tool_planning, support_high]
    fixtures: [advanced/programming/incremental-workbook.yml]
    payload:
      settings: { supportLevel: high }
      chatMode: PROGRAMMING_EXERCISE_CHAT
      chatHistory:
        - id: 5201
          sentAt: 2026-07-19T09:30:00Z
          sender: USER
          contents:
            - type: text
              textContent: "My first submission had a qualified-reference parser error. I fixed it, all parser tests pass, and the latest build is green, but three stateful hidden sequences still fail."
        - id: 5202
          sentAt: 2026-07-19T09:36:00Z
          sender: LLM
          contents:
            - type: text
              textContent: "Passing the parser regression group makes tokenization less likely, but a qualified reference still crosses several components after parsing."
        - id: 5203
          sentAt: 2026-07-19T10:00:00Z
          sender: USER
          contents:
            - type: text
              textContent: "Please investigate the latest repository and feedback rather than assuming the parser is still wrong. Reconstruct why the result depends on which cells were read earlier, decide whether the three failures share one cause, and give me diagnostic traces that separate the hypotheses without writing the finished engine."
    criteria:
      - id: evidence_synthesis
        description: The response uses the latest repository, exercise invariants, and all three order-dependent failures instead of anchoring on the repaired parser history.
      - id: invalidation_reasoning
        description: The response traces why invalidating only the edited cell and its immediate dependents leaves results cached beyond the first dependency edge.
      - id: evaluation_path_reasoning
        description: The response distinguishes an active recursion path from every cell seen during an evaluation and explains why a shared acyclic dependency is falsely reported as a cycle.
      - id: cache_identity_reasoning
        description: The response discovers that cached values use only the cell name even though workbook identity also includes the sheet.
      - id: tutoring_plan
        description: The response proposes minimal traces that independently vary dependency depth, branch sharing, sheet identity, and read order while preserving student ownership.
    critical_errors:
      - "The answer treats parsing qualified references as the sole remaining cause despite the passing parser regression tests."
      - "The answer recommends removing sheet names from cell identity or rejecting all repeated dependencies as cycles."
      - "The answer reveals a complete or near-complete WorkbookEngine implementation."
    token_ceiling:
      max_agent_turns: 8
      max_input_tokens: 48000
      max_output_tokens: 6000
      max_output_tokens_per_call: 3000
