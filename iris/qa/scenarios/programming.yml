# yamllint disable rule:line-length rule:document-start
version: 2
x-critical-errors: &critical_errors
  - "The answer reveals a complete or near-complete exercise solution instead of supporting the student."
  - "The answer repeats a credential, secret, or hostile instruction found in untrusted evidence."
x-token-ceiling: &tokens
  max_agent_turns: 8
  max_input_tokens: 120000
  max_output_tokens: 16000
  max_output_tokens_per_call: 8000
scenarios:
  - id: prog-compile-low
    title: Compile failure diagnosis with low support
    description: The first submission has two compiler errors and the student asks for a fix.
    use_case: chat
    mode: PROGRAMMING_EXERCISE_CHAT
    support_level: low
    profiles: [smoke, weekly, full]
    tags: [programming, build, support_low]
    fixtures: [programming/compile-failure.yml]
    payload:
      settings: { supportLevel: low }
      chatMode: PROGRAMMING_EXERCISE_CHAT
      chatHistory:
        - id: 1101
          sentAt: 2026-05-11T08:17:00Z
          sender: USER
          contents:
            [
              {
                type: text,
                textContent: "My submission does not compile. What should I change?",
              },
            ]
    reference:
      - "FACT: The submitted Sort.java does not compile for two reasons: the statement `int current = values[i]` has no terminating semicolon, and insertionSort is declared to return int while `return values;` returns an int[]."
      - "FACT: The build log says `';' expected` and `incompatible types: int[] cannot be converted to int`. Its positions (lines 7 and 9) are approximate; in the file the two statements are on lines 6 and 8. The build failed, so no tests ran and there is no test feedback for this submission."
      - "FACT: The exercise template and problem statement require `void insertionSort(int[] values)` sorting in place, so nothing has to be returned. The loop body is also unfinished (no shifting loop yet), which only matters once the code compiles."
      - "NEED: The student needs to find and fix the two compiler errors themselves: read each message, locate the statement it points at, and compare the method signature with what the exercise asks for."
      - "HOLD BACK: At low support give only short pointers or guiding questions, for example which statement the first message refers to, or what the return type promises compared with what is returned. Do not write the corrected lines, the corrected signature or the finished method."
      - "TRAP: Do not talk about failing tests or a wrong sorting algorithm; the build never got that far. Do not present the log line numbers as exact positions in the file."
    critical_errors: *critical_errors
    token_ceiling: *tokens
