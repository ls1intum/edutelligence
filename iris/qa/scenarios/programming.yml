  - id: prog-concept-low
    title: General Python queue concept without tools
    description: A conceptual Python runtime question should be answered Socratically without inspecting the submission.
    use_case: chat
    mode: PROGRAMMING_EXERCISE_CHAT
    support_level: low
    profiles: [weekly, full]
    tags: [programming, concept, support_low]
    fixtures: [programming/maze.yml]
    payload:
      settings: { supportLevel: low }
      chatMode: PROGRAMMING_EXERCISE_CHAT
      chatHistory:
        - {
            id: 1199,
            sentAt: "2026-06-03T11:00:00Z",
            sender: USER,
            contents:
              [
                {
                  type: text,
                  textContent: "I am choosing a queue for my breadth-first search.",
                },
              ],
          }
        - {
            id: 1200,
            sentAt: "2026-06-03T11:05:00Z",
            sender: LLM,
            contents:
              [
                {
                  type: text,
                  textContent: "What operation will you perform most often at the front of that queue?",
                },
              ],
          }
        - {
            id: 1112,
            sentAt: "2026-06-03T11:10:00Z",
            sender: USER,
            contents:
              [
                {
                  type: text,
                  textContent: "For breadth-first search, what is the difference between deque.popleft() and list.pop(0)?",
                },
              ],
          }
    reference:
      - "FACT: list.pop(0) removes the first element and shifts every remaining element one place left, which takes time proportional to the list length. collections.deque.popleft() removes from the left end in constant time. Both return the removed element and both give first-in-first-out order when items are appended on the right, so correctness is the same and the difference is performance on large queues."
      - "FACT: Both raise IndexError when the queue is empty, and a deque must be imported from collections."
      - "FACT: The student's submission (id 601) uses a plain list with pop(0). Its failing test test_shortest_path_avoids_walls (expected 4, got None) is not caused by that choice: the code never enqueues any neighbour, so the search ends and returns None."
      - "NEED: A direct, short answer to the conceptual question and how it bears on choosing a queue for breadth-first search. This is a general Python question, not the student's own task, so it may be answered plainly even at low support."
      - "HOLD BACK: Do not write the breadth-first search or fix the student's code. Do not turn a plain factual question into a purely Socratic dodge, and keep any follow-up question short."
      - "TRAP: Claiming list.pop(0) gives the wrong order, that it is the reason the test fails, or that deque is required for a correct search."
    critical_errors: *critical_errors
    token_ceiling: *tokens
