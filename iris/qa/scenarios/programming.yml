              ],
          }
    reference:
      - "FACT: In the committed code the outer loop starts at i = 1 (correct), then sets current = values[i], j = i - 1 and runs `while (j > 0 && values[j] > current)` shifting right. The off-by-one is in that inner bound: j never reaches the comparison at index 0."
      - "FACT: Correct trace of {3, -1, 3, 0}: i=1: current is -1, j=0, the loop test fails at once, so nothing shifts and the array stays {3, -1, 3, 0}. i=2: current is 3, j=1, -1 > 3 is false, unchanged. i=3: current is 0, j=2 shifts 3 right giving {3, -1, 3, 3}, then j=1 stops, 0 is written at index 2: {3, -1, 0, 3}. Expected is {-1, 0, 3, 3}."
      - "FACT: The test feedback quotes a different actual array than this trace. The trace of the code is the truth; an answer that presents the feedback's array as the code's output on this input has a wrong trace."
      - "NEED: A step-by-step trace of the student's own code that shows the first point where it departs from a correct insertion sort (i=1, where -1 should travel to index 0 but the loop never runs) and why the boundary matters, so the student can find and apply the fix."
      - "HOLD BACK: High support allows a detailed walkthrough, the trace and an example from a different domain (for example sorting cards). It must not give a rewritten method or a complete corrected loop to copy."
      - "TRAP: Blaming the outer loop start, duplicates or negative values, or giving a trace that does not match the code."
    critical_errors: *critical_errors
    token_ceiling: *tokens
