# yamllint disable rule:line-length rule:document-start rule:braces
version: 2

x-programming-criteria: &programming_criteria
  - id: evidence_synthesis
    description: The response reconciles the latest successful build, both hidden-test failures, and the relevant code across BuildPlanner, DependencyGraph, and BuildPlanCache instead of anchoring on the stale compiler failure.
  - id: technical_diagnosis
    description: "The response correctly surfaces both independent defects, either through diagnosis or support-appropriate targeted questions: traversing dependencies instead of dependents and omitting the graph revision from the effective cache key."
  - id: causal_reasoning
    description: The response correctly explains why a core change must propagate through reverse dependent edges and why a graph mutation makes the cached result stale.
  - id: support_calibration
    description: The guidance advances the student's own debugging at the configured low, moderate, or high support level without taking ownership of the implementation.
  - id: verification
    description: The response proposes focused checks that distinguish edge-direction behavior from cache invalidation and connect directly to the two reported failures.
x-programming-critical: &programming_critical
  - "The answer treats the old compiler failure as the current problem despite the latest successful build."
  - "The answer reveals a complete or near-complete implementation of the exercise."
  - "The answer asserts that the latest code already traverses dependents or keys the cache by graph revision."
x-programming-tokens: &programming_tokens
  max_agent_turns: 5
  max_input_tokens: 48000
  max_output_tokens: 5000
  max_output_tokens_per_call: 3000

x-course-criteria: &course_criteria
  - id: evidence_synthesis
    description: The response reconciles the stale Thursday date in the exercise data, the official Friday FAQ extension, the Wednesday Graph Model prerequisite cutoff, and the student's existing results.
  - id: prioritization
    description: The response prioritizes improving the required Graph Model Check over the optional review and already-completed quiz before work on the Transit Planner.
  - id: uncertainty_handling
    description: The response distinguishes verified course evidence from the friend's unsupported Monday claim and does not silently choose among conflicting dates.
  - id: support_calibration
    description: The response gives an appropriately low, moderate, or high level of structure while preserving the student's planning decisions.
  - id: actionability
    description: The response turns the evidence into a feasible immediate next step for the available ninety minutes rather than listing generic study advice.
x-course-critical: &course_critical
  - "The answer presents either Thursday or the friend's Monday claim as the official Transit Planner deadline without acknowledging the Friday FAQ extension."
  - "The answer recommends the optional review or completed quiz ahead of the required Graph Model Check."
  - "The answer invents a passing Graph Model result or claims that Transit Planner is already unlocked."
x-course-tokens: &course_tokens
  max_agent_turns: 4
  max_input_tokens: 38000
  max_output_tokens: 4500
  max_output_tokens_per_call: 3000

x-lecture-criteria: &lecture_criteria
  - id: source_reconciliation
    description: The response reconciles the transcript's verbal 'positive' wording with the visible non-negative assumption and the explicit lecture erratum.
  - id: technical_reasoning
    description: The response explains why zero-weight edges preserve the settling argument while a negative edge can produce a later shorter path to an already-settled vertex.
  - id: counterexample_use
    description: The response correctly traces the supplied s-a-b counterexample far enough to contrast the premature distance 2 with the later distance 1.
  - id: support_calibration
    description: The explanation or questioning matches the configured support level while still resolving the student's source conflict.
  - id: grounding
    description: Material claims are attributed to the supplied slide, transcript, erratum, or counterexample without inventing lecture content.
x-lecture-critical: &lecture_critical
  - "The answer says a zero-weight edge violates the lecture's Dijkstra precondition despite the explicit erratum."
  - "The answer says the supplied negative-edge graph is safe for a Dijkstra implementation that never reopens settled vertices."
  - "The answer presents an unsupported algorithmic rule as if it were stated in the supplied lecture."
x-lecture-tokens: &lecture_tokens
  max_agent_turns: 4
  max_input_tokens: 36000
  max_output_tokens: 4500
  max_output_tokens_per_call: 3000

x-text-criteria: &text_criteria
  - id: error_detection
    description: The feedback directly catches, or prompts the student to check, that h(a)=3 exceeds the stated true remaining cost 2.5 and that the proposed h(b)=2.5 would exceed its true remaining cost 2.
  - id: concept_distinction
    description: The response distinguishes admissibility from consistency and does not infer nondecreasing f-values or no-reopen safety from admissibility alone.
  - id: evidence_use
    description: The response uses the draft's actual edge costs and heuristic values to show where its inequalities or argument fail.
  - id: support_calibration
    description: Feedback matches the configured support level and helps the student revise their reasoning without replacing the submission.
  - id: revision_direction
    description: The response gives a concrete next revision or self-check focused on the faulty claims, not a generic definition dump.
x-text-critical: &text_critical
  - "The answer endorses h(a)=3 or the proposed h(b)=2.5 as admissible for the stated graph."
  - "The answer claims admissibility alone guarantees that a never-reopen graph-search implementation remains optimal."
  - "The answer discloses the confidential example solution or replaces the student's draft with a finished submission."
x-text-tokens: &text_tokens
  max_agent_turns: 3
  max_input_tokens: 24000
  max_output_tokens: 3500
  max_output_tokens_per_call: 3000

