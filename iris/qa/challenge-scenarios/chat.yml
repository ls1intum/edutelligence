    mode: PROGRAMMING_EXERCISE_CHAT
    support_level: low
    profiles: [full]
    tags:
      [challenge, programming, multi_file, conflicting_evidence, support_low]
    fixtures: [challenge/programming/build-planner.yml]
    payload:
      settings: { supportLevel: low }
      chatMode: PROGRAMMING_EXERCISE_CHAT
      chatHistory:
        - id: 5101
          sentAt: 2026-06-15T08:25:00Z
          sender: USER
          contents:
            [
              {
                type: text,
                textContent: "My first submission did not compile; it mentioned a missing semicolon.",
              },
            ]
        - id: 5102
          sentAt: 2026-06-15T08:26:00Z
          sender: LLM
          contents:
            [
              {
                type: text,
                textContent: "First verify that syntax issue and submit again so we can inspect the current result.",
              },
            ]
        - id: 5103
          sentAt: 2026-06-17T08:58:00Z
          sender: USER
          contents:
            [
              {
                type: text,
                textContent: "That was two submissions ago. The current build succeeds, but changing core omits api and web, and after I add cli -> api the repeated result still omits cli. Help me decide what to inspect first without giving me the solution.",
