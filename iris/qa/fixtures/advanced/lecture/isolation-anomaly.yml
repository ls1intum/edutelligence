          pageNumber: 21
          text: "Example, originally mislabeled non-repeatable read: x=1 and y=1. T1 reads x,y and writes x=0 if both are 1. T2 reads x,y and writes y=0 if both are 1. Under snapshot isolation both commit, violating x+y>=1."
