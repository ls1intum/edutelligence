        lectureUnitId: 7201
        lectureUnitName: Isolation Anomalies Correction
        pageNumber: 25
        text: "Correction to slide 21: this is write skew, not a non-repeatable read. Each transaction reads a consistent snapshot and writes a different row, so first-committer-wins does not detect a write-write conflict."
        link: /courses/42/lectures/6201?lectureUnitId=7201&page=25
      - uuid: isolation-levels
        lectureUnitId: 7201
        lectureUnitName: Isolation Guarantees
        pageNumber: 18
        text: "Snapshot isolation can admit write skew. Serializable isolation must produce an outcome equivalent to a serial order and therefore prevents this invariant-violating schedule."
        link: /courses/42/lectures/6201?lectureUnitId=7201&page=18
