    faqs:
      - id: 8501
        question: What is the 2026 checkpoint deadline?
        answer: The team checkpoint is due Friday, 3 July 2026 at 18:00. There is no automatic grace period for this checkpoint.
        link: /courses/42/faq/8501
      - id: 8502
        question: Does submitting an extension request change the deadline?
        answer: No. A request changes no deadline until the examination office sends written approval. Students should plan for the original deadline while a request is pending.
        link: /courses/42/faq/8502
      - id: 8503
        question: Does an individual accommodation extend a team deadline?
        answer: An approved individual accommodation applies only to the named student. The course coordinator must confirm a separate team arrangement; teammates are not automatically covered.
        link: /courses/42/faq/8503
      - id: 7501
        question: Was there a grace period in 2025?
        answer: The 2025 pilot checkpoint had a blanket 48-hour grace period. This archived rule does not apply to later course editions.
        link: /courses/42/faq/7501
