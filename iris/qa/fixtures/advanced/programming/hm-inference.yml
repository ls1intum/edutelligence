programmingExercise:
  id: 9602
  title: Principal Type Inference
  problemStatement: |
    Implement Algorithm W for variables, integer and Boolean literals,
    lambdas, application, non-recursive let bindings, and pairs. Let-bound
    schemes must be instantiated independently at every use. Inference must
    reject infinite types, produce a principal type rather than an unsound
    over-general type, and compose substitutions in semantic application
    order. Equivalent fresh-variable names are accepted by the tests.
  startDate: 2026-07-15T08:00:00Z
  endDate: 2026-07-29T18:00:00Z
  programmingLanguage: PYTHON
  templateRepository: { $repository: advanced/hm-inference/template }
  solutionRepository: { $repository: advanced/hm-inference/solution }
  testRepository: { $repository: advanced/hm-inference/tests }
