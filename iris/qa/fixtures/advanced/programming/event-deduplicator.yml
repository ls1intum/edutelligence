programmingExercise:
  id: 9401
  title: Partitioned Event Deduplicator
  problemStatement: |
    Accept an event unless the same event id has already been observed in the
    same partition during the configured window. Identical ids in different
    partitions are independent. Event timestamps and stored timestamps are in
    milliseconds; the constructor receives the window in seconds. Keep keying,
    storage, and service responsibilities separate.
  startDate: 2026-06-10T08:00:00Z
  endDate: 2026-06-22T18:00:00Z
  programmingLanguage: JAVA
  templateRepository: { $repository: advanced/event-deduplicator/template }
  solutionRepository: { $repository: advanced/event-deduplicator/solution }
  testRepository: { $repository: advanced/event-deduplicator/tests }
