programmingExercise:
  id: 9501
  title: Retry-safe Multi-tenant Batch Processing
  problemStatement: |
    Process a batch of account debits identified by tenant and request id. A
    successfully processed batch must not be applied again within the same
    tenant, while another tenant may reuse the same request id. Applying a
    batch is all-or-nothing: if any debit cannot be applied, every balance must
    remain unchanged and the batch may be retried later. Keep orchestration,
    balance storage, idempotency identity, retry configuration, and audit output
    in their existing responsibilities.
  startDate: 2026-07-01T08:00:00Z
  endDate: 2026-07-15T18:00:00Z
  programmingLanguage: JAVA
  templateRepository: { $repository: advanced/batch-retry/template }
  solutionRepository: { $repository: advanced/batch-retry/solution }
  testRepository: { $repository: advanced/batch-retry/tests }
