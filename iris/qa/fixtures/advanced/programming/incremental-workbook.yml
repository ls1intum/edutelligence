extends: [base/chat.yml]
programmingExercise:
  id: 9601
  title: Incremental Multi-sheet Workbook
  problemStatement: |
    Implement a workbook evaluator for integer values and additive formulas.
    A cell is identified by both sheet and cell name. Formula dependencies may
    form a directed acyclic graph: sharing one dependency along two branches is
    valid, while a dependency on the active evaluation path is a cycle. Cached
    values are allowed, but changing a cell or formula must invalidate every
    affected result across any number of dependency edges without evicting
    unrelated cells. Qualified references such as `Inputs!A1` may cross sheets.
  startDate: 2026-07-08T08:00:00Z
  endDate: 2026-07-22T18:00:00Z
  programmingLanguage: PYTHON
  templateRepository: { $repository: advanced/incremental-workbook/template }
  solutionRepository: { $repository: advanced/incremental-workbook/solution }
  testRepository: { $repository: advanced/incremental-workbook/tests }
