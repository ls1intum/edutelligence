        question: What unlocks the Concurrent Service Capstone?
        answer: Both Thread Safety and Locking Design must reach at least 80 percent mastery. The dashboard can lag behind a newly graded attempt by up to two hours; the assessment result remains authoritative.
        link: /courses/42/faq/8322
