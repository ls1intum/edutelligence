    faqs:
      - id: 8311
        question: Can project-team roles be reassigned in team chat?
        answer: No. The role shown on the milestone page remains binding until a tutor approves the change in Artemis. Team chat can document a proposal but does not itself change ownership.
        link: /courses/42/faq/8311
      - id: 8312
        question: What may a reviewer do while an implementation is blocked?
        answer: A reviewer may clarify acceptance criteria, prepare non-destructive tests, and request tutor review of a role-change proposal. They must not submit another member's implementation as their own.
        link: /courses/42/faq/8312
