programmingExerciseDTO:
  id: 9603
  title: Recoverable Event-Time Stream Runtime
  problemStatement: |
    Implement a two-input event-time runtime. Checkpoints must represent a
    consistent cut even when barriers arrive at different times. Keyed state
    must remain reachable when restoring with different parallelism. Event-time
    windows advance using the minimum watermark of currently active inputs;
    an input becomes idle only after the configured inactivity timeout.
  programmingLanguage: PYTHON
  templateRepository: { $repository: advanced/stream-recovery/template }
  solutionRepository: { $repository: advanced/stream-recovery/solution }
  testRepository: { $repository: advanced/stream-recovery/tests }
