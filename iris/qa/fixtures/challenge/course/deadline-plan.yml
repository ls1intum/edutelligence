        question: Was the Transit Planner deadline extended after the CI outage?
        answer: Yes. The official deadline is Friday, 19 June 2026 at 18:00 Europe/Berlin. Artemis may continue to display the original Thursday deadline until the next course sync. The Graph Model Check prerequisite still closes Wednesday at 13:00.
