extends: [base/chat.yml]
programmingExercise:
  id: 9101
  title: Incremental Build Planner
  problemStatement: |
    Implement a planner for a directed module graph. If module A declares B as
    a dependency, an implementation change in B requires rebuilding B, A, and
    every transitive dependent of A. Return each affected module exactly once.
    Reusing a cached plan is allowed only while both the changed-module set and
    graph revision are unchanged. The graph can gain dependencies between calls.
    Do not expose or replace the provided graph and cache abstractions.
  startDate: 2026-06-08T08:00:00Z
  endDate: 2026-06-18T18:00:00Z
  programmingLanguage: JAVA
  templateRepository: { $repository: challenge/build-planner/template }
  solutionRepository: { $repository: challenge/build-planner/solution }
  testRepository: { $repository: challenge/build-planner/tests }
