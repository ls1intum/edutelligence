api_keys:
  - token: "secret"

weaviate:
  host: "localhost"
  port: 8001
  grpc_port: 50051
  # Set to true when pointing at a TLS-terminated (reverse-proxied) Weaviate.
  http_secure: false
  grpc_secure: false
  # Optional: Weaviate API key (omit or leave empty for anonymous access).
  # api_key: "your-weaviate-api-key"

memiris:
  enabled: true
  sleep_enabled: true
  llm_configuration:
    embeddings:
      - mxbai-embed-large
      - nomic-embed-text
    learning_extractor:
      local: gemma3
      cloud: gemma3
    learning_deduplicator:
      local: gemma3
      cloud: gemma3
    memory_creator:
      local: gpt-oss
      cloud: gpt-oss
    sleep_tool_llm:
      local: gpt-oss
      cloud: gpt-oss
    sleep_json_llm:
      local: gemma3
      cloud: gemma3

local_llm_enabled: true # Set to false to disable local LLM support entirely

# Programming-exercise guide refinement:
# - blocking: run the guide rewrite before the answer is sent; this is the
#   default and reflects production behavior.
# - shadow: send the answer first, then run guide refinement for evidence collection.
# - off: disable guide refinement entirely.
exercise_guide_refinement: blocking
# Shadow sampling rate, only used when exercise_guide_refinement is shadow.
exercise_guide_refinement_shadow_sample: 1.0

langfuse:
  enabled: false # Set to true to enable LangFuse tracing
  public_key: "pk-lf-..." # Your LangFuse public key
  secret_key: "sk-lf-..." # Your LangFuse secret key  # pragma: allowlist secret
  host: "https://cloud.langfuse.com" # Or your self-hosted instance URL

transcription:
  enabled: false # Set to true to enable video transcription
  temp_dir: "tmp/transcription" # Temporary directory for video/audio files
  chunk_duration_seconds: 900 # Audio chunk size in seconds for Whisper
  whisper_model: "whisper-1" # Model ID in llm_config.yml (e.g. whisper-1-openai or whisper-1-azure)
  whisper_max_workers: 2 # Parallel Whisper API requests per job
  whisper_request_timeout_seconds: 300 # Timeout per Whisper request
  whisper_max_retries: 6 # Max retries per chunk on failure
  download_timeout_seconds: 3600 # Video download timeout
  extract_audio_timeout_seconds: 600 # Audio extraction timeout
  no_speech_filter_threshold: 0.8 # Filter silent segments (0.0-1.0)

env_vars:
  SOME: "value"

# Values are LLM entry IDs (the "id" field in llm_config.yml).
llm_configuration:
  # Unified chat pipeline (COURSE_CHAT, LECTURE_CHAT, PROGRAMMING_EXERCISE_CHAT,
  # TEXT_EXERCISE_CHAT all resolve through this single pipeline id).
  chat_pipeline:
    default:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini
      # Guard detection quality requires medium reasoning effort (eval-backed).
      guide:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini
    advanced:
      chat:
        local: oai-gpt-52
        cloud: oai-gpt-5.5
      # Guard detection quality requires medium reasoning effort (eval-backed).
      guide:
        local: oai-gpt-52
        cloud: oai-gpt-5-mini

  autonomous_tutor_pipeline:
    default:
      chat:
        local: gpt-oss
        cloud: oai-gpt-5-mini

  tutor_suggestion_pipeline:
    default:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini
    advanced:
      chat:
        local: oai-gpt-52
        cloud: oai-gpt-52

  competency_extraction_pipeline:
    default:
      chat:
        local: oai-gpt-52
        cloud: oai-gpt-52

  inconsistency_check_pipeline:
    default:
      solver:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini
      prettify:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini

  rewriting_pipeline:
    faq:
      rewriting:
        local: oai-gpt-52
        cloud: oai-gpt-52
      consistency:
        local: oai-gpt-52
        cloud: oai-gpt-52
    problem_statement:
      rewriting:
        local: oai-gpt-52
        cloud: oai-gpt-52
      consistency:
        local: oai-gpt-52
        cloud: oai-gpt-52

  lecture_unit_page_ingestion_pipeline:
    default:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini
      embedding: oai-embedding-small
    advanced:
      chat:
        local: oai-gpt-52
        cloud: oai-gpt-52
      embedding: azure-embedding-large

  faq_ingestion_pipeline:
    default:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini
      embedding: oai-embedding-small

  transcription_ingestion_pipeline:
    default:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini
      # Vision-capable model used by the light transcription pipeline to
      # detect slide-number changes from video frames. Must be a chat model
      # that accepts image inputs (e.g. gpt-4.1-mini, gpt-5-mini).
      vision_chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini
      embedding: oai-embedding-small

  lecture_unit_segment_summary_pipeline:
    default:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini
      embedding: oai-embedding-small

  lecture_unit_summary_pipeline:
    default:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini

  lecture_unit_pipeline:
    default:
      embedding: oai-embedding-small

  lecture_retrieval_pipeline:
    default:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini-minimal
      embedding: oai-embedding-small
      reranker: cohere

  lecture_unit_segment_retrieval_pipeline:
    default:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini
      embedding: oai-embedding-small
      reranker: cohere

  lecture_transcriptions_retrieval_pipeline:
    default:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini
      embedding: oai-embedding-small
      reranker: cohere

  faq_retrieval_pipeline:
    default:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini-minimal
      embedding: oai-embedding-small

  citation_pipeline:
    default:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini-minimal
      keyword_summary:
        local: oai-gpt-5-nano
        cloud: oai-gpt-5-nano-minimal
    advanced:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini-minimal

  interaction_suggestion_pipeline:
    course:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-nano-minimal
    exercise:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-nano-minimal

  session_title_generation_pipeline:
    default:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-nano-minimal

  code_feedback_pipeline:
    default:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-mini

  summary_pipeline:
    default:
      chat:
        local: oai-gpt-5-mini
        cloud: oai-gpt-5-nano

  global_search_pipeline:
    default:
      hyde:
        local: gpt-oss
        cloud: oai-gpt-5-nano-minimal
      answer:
        local: gpt-oss
        cloud: oai-gpt-5-mini-minimal
      embedding: oai-embedding-small

  mcq_generation_pipeline:
    default:
      chat:
        local: gpt-oss
        cloud: oai-gpt-5-nano-low
