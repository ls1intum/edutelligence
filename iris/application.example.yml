  lecture_unit_segment_summary_pipeline:
    default:
      chat:
        local: qwen3.8-27b
        cloud: oai-gpt-5-mini
      embedding: oai-embedding-small

  lecture_unit_summary_pipeline:
    default:
      chat:
        local: qwen3.8-27b
        cloud: oai-gpt-5-mini

  lecture_unit_pipeline:
    default:
      embedding: oai-embedding-small

  lecture_retrieval_pipeline:
    default:
      chat:
        local: qwen3.8-27b
        cloud: oai-gpt-5-mini-minimal
