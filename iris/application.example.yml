api_keys:
  - token: "secret"

weaviate:
  host: "localhost"
  port: 8001
  grpc_port: 50051
  # Set to true when pointing at a TLS-terminated (reverse-proxied) Weaviate.
  http_secure: false
  grpc_secure: false
  # Optional: Weaviate API key (omit or leave empty for anonymous access).
  # api_key: "your-weaviate-api-key"

memiris:
  enabled: true
  sleep_enabled: true
  llm_configuration:
    embeddings:
      - mxbai-embed-large
      - nomic-embed-text
    learning_extractor:
      local: qwen3.8-27b
      cloud: gemma3
    learning_deduplicator:
      local: qwen3.8-27b
      cloud: gemma3
    memory_creator:
      local: qwen3.8-27b
      cloud: gpt-oss
    sleep_tool_llm:
      local: qwen3.8-27b
      cloud: gpt-oss
    sleep_json_llm:
      local: qwen3.8-27b
      cloud: gemma3
  # Concurrent memory groups during sleep; each issues its own LLM requests.
  # Keep it below the parallel capacity of the local model's serving lanes.
  sleep_max_threads: 4

course_memory:
  enabled: true # Set to false to disable the Course Memory feature
  alpha: 0.5 # Hybrid fusion weight (Weaviate convention: 0=BM25/keyword, 1=dense/vector)
  similarity_threshold: 0.85 # Minimum cosine certainty (0-1) for a retrieved entry; certainty = (1 + cosine) / 2
  result_limit: 5 # Max verified Q/A pairs returned per query
  query_rewrite_enabled: true # Rewrite context-poor questions before retrieval
  context_message_limit: 20 # Preceding thread messages used for context

autonomous_tutor:
  organizational_evidence_guard:
    # Every reply Artemis would publish unreviewed (confidence >= 0.85) is checked by an LLM: it
    # lists the organizational facts (dates, rooms, scope, deadlines, grading, registration) and
    # whether tutor-verified Course Memory answers state each of them. FAQs and community-resolved
    # entries do not count. A reply with an unsupported fact, or a failed check, is capped to
    # confidence_cap, so Artemis routes it to tutor review. Artemis publishes at >= 0.85, reviews in
    # [0.70, 0.85), discards below 0.70.
    enabled: true
    llm_check_enabled: true # false: cap every such reply ("review everything"), no LLM check
    confidence_cap: 0.75

local_llm_enabled: true # Set to false to disable local LLM support entirely

langfuse:
  enabled: false # Set to true to enable LangFuse tracing
  public_key: "pk-lf-..." # Your LangFuse public key
  secret_key: "sk-lf-..." # Your LangFuse secret key  # pragma: allowlist secret
  host: "https://cloud.langfuse.com" # Or your self-hosted instance URL

transcription:
  enabled: false # Set to true to enable video transcription
  temp_dir: "tmp/transcription" # Temporary directory for video/audio files
  chunk_duration_seconds: 900 # Audio chunk size in seconds for Whisper
  whisper_model: "whisper-1" # Model ID in llm_config.yml (e.g. whisper-1-openai or whisper-1-azure)
  whisper_max_workers: 2 # Parallel Whisper API requests per job
  whisper_request_timeout_seconds: 300 # Timeout per Whisper request
  whisper_max_retries: 6 # Max retries per chunk on failure
  download_timeout_seconds: 3600 # Video download timeout
  extract_audio_timeout_seconds: 600 # Audio extraction timeout
  no_speech_filter_threshold: 0.8 # Filter silent segments (0.0-1.0)

env_vars:
  SOME: "value"

# Values are LLM entry IDs (the "id" field in llm_config.yml).
llm_configuration:
  # Unified chat pipeline (COURSE_CHAT, LECTURE_CHAT, PROGRAMMING_EXERCISE_CHAT,
  # TEXT_EXERCISE_CHAT all resolve through this single pipeline id).
  chat_pipeline:
    default:
      chat:
        local: qwen3.8-27b
        cloud: oai-gpt-5-mini
      # Guard detection quality requires medium reasoning effort (eval-backed).
      guide:
        local: qwen3.8-27b
        cloud: oai-gpt-5-mini
    advanced:
      chat:
        local: qwen3.8-27b
        cloud: oai-gpt-5.5
      # Guard detection quality requires medium reasoning effort (eval-backed).
      guide:
        local: qwen3.8-27b
        cloud: oai-gpt-5-mini

  autonomous_tutor_pipeline:
    default:
      chat:
        local: qwen3.8-27b
        cloud: oai-gpt-5-mini

  struggle_intervention_pipeline:
    default:
      chat:
        local: qwen3.8-27b
        cloud: oai-gpt-5-mini

  tutor_suggestion_pipeline:
    default:
      chat:
        local: qwen3.8-27b
        cloud: oai-gpt-5-mini
    advanced:
      chat:
        local: qwen3.8-27b
        cloud: oai-gpt-52

  competency_extraction_pipeline:
    default:
      chat:
        local: qwen3.8-27b
        cloud: oai-gpt-52

  inconsistency_check_pipeline:
    default:
      solver:
        local: qwen3.8-27b
        cloud: oai-gpt-5-mini
      prettify:
        local: qwen3.8-27b
        cloud: oai-gpt-5-mini

  rewriting_pipeline:
    faq:
      rewriting:
        local: qwen3.8-27b
        cloud: oai-gpt-52
      consistency:
        local: qwen3.8-27b
        cloud: oai-gpt-52
    problem_statement:
      rewriting:
        local: qwen3.8-27b
        cloud: oai-gpt-52
      consistency:
        local: qwen3.8-27b
        cloud: oai-gpt-52

  lecture_unit_page_ingestion_pipeline:
    default:
