[tool.poetry]
name = "iris"
version = "2.7"
description = "An LLM microservice for the learning platform Artemis"
authors = ["Timor Morrien <timor.morrien@tum.de>", "Patrick Bassner <patrick.bassner@tum.de>"]
readme = "README.md"
packages = [{include = "iris", from = "src"}]
include = ["src/iris/py.typed"]

[tool.poetry.dependencies]
python = ">=3.13,<4.0.0"
fastapi = "^0.141.1"
jinja2 = "^3.1.6"
langchain = "^1.2.10"
langchain-classic = "^1.0.7"
ollama = "^0.6.2"
openai = "^2.54.0"
psutil = "^7.2.2"
pydantic = "^2.13.5"
PyMuPDF = "^1.28.2"
pytz = "2026.3.post1"
PyYAML = "6.0.3"
requests = "^2.34.2"
sentry-sdk = {version = "^2.69.1", extras = ["starlette", "fastapi", "openai"]}
uvicorn = "^0.52.4"
weaviate-client = "^4.23.1"
langchain-core="^1.6.2"
langfuse="^3.15.0"
langchain-text-splitters="^1.1.2"
langchain-experimental="^0.4.2"  # 0.4.1 imports langchain_community.chat_models.ollama, removed in community 0.4.2
langchain-openai="^1.6.2"
cohere = "^7.1.1"
types-pyyaml = "^6.0.12.20260906"
types-pytz = "^2026.3.1.20260727"
httpx = {version = "^0.28.1", extras = ["http2"]}
memiris = {path = "../memiris", develop = true}
apscheduler = "^3.11.3"
onnxruntime = "^1.30.0"
transformers = "^5.10.0"
joblib = "1.6.0"
scikit-learn = "1.9.1"
ffmpeg-python = "^0.2.0"
opencv-python-headless = "^5.0.0"
yt-dlp = "^2026.8.19"

# Security floors for packages that are otherwise transitive only. Without
# these, regenerating poetry.lock can resolve back onto a vulnerable release.
aiohttp = ">=3.14.3"
langsmith = ">=0.8.18"
orjson = ">=3.11.6"
protobuf = ">=6.33.5"
urllib3 = ">=2.7.0"
# weaviate-client enforces a protobuf/grpcio pairing at import time
# (weaviate/proto/v1/__init__.py): protobuf >= 6.30.0 requires grpcio
# >= 1.72.0. The protobuf floor above is in that range, so pin grpcio to
# match rather than relying on it happening to resolve high enough.
grpcio = ">=1.72.0"
cryptography = ">=50.0.0"
httpcore2 = ">=2.10.0"
httpx2 = ">=2.12.0"
starlette = ">=1.3.1"
Pygments = ">=2.20.0"
authlib = ">=1.6.12"
filelock = ">=3.20.3"
h2 = ">=4.4.1"
python-dotenv = ">=1.2.2"
setuptools = ">=83.0.0"
virtualenv = ">=20.36.1"
torch = ">=2.13.0"

[tool.poetry.group.train.dependencies]
setfit = "^1.2.0"
# optimum[onnxruntime] is intentionally NOT declared here. It pulls in
# optimum-onnx, which still requires transformers <4.58.0 and so pinned the
# whole lock -- including the transformers that ships in the runtime image --
# to a version with three high severity advisories. Nothing installs this
# group: neither CI nor the Dockerfile passes --with train, and the image
# downloads the pre-built ONNX model rather than exporting it. The export step
# in models/global_search_intent/train.py needs optimum installed alongside
# this group, e.g. `poetry run pip install "optimum[onnxruntime]"`, until
# optimum-onnx supports transformers 5.
datasets = "^5.0.1"
scikit-learn = "^1.9.1"
pandas = "^3.0.5"

[tool.poetry.group.dev.dependencies]
mypy = "^2.3.1"
pylint = "^4.0.8"
black = "^26.5.1"
isort = "^9.0.1"
yamllint = "^1.38.0"
bandit = "^1.9.4"
pytest = "^9.1.1"
coverage = "^7.16.0"
detect-secrets = "^1.5.0"
pre-commit = "^4.6.2"
autoflake = "^2.4.0"

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
mypy_path = "src"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
# fail_under = 80
# omit = ["tests/*", "your_module_name/__init__.py"]

[tool.coverage.html]
directory = "htmlcov"

[virtualenvs]
create = true
in-project = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
