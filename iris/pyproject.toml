[tool.poetry]
name = "iris"
version = "2.7"
description = "An LLM microservice for the learning platform Artemis"
authors = ["Timor Morrien <timor.morrien@tum.de>", "Patrick Bassner <patrick.bassner@tum.de>"]
readme = "README.md"
packages = [{include = "iris", from = "src"}]
include = ["src/iris/py.typed"]

[tool.poetry.dependencies]
python = ">=3.13,<4.0.0"
fastapi = "^0.141.1"
jinja2 = "^3.1.6"
langchain = "^1.2.10"
langchain-classic = "^1.0.1"
ollama = "^0.6.2"
openai = "^2.54.0"
psutil = "^7.2.2"
pydantic = "^2.13.4"
PyMuPDF = "^1.28.2"
pytz = "2026.3.post1"
PyYAML = "6.0.3"
requests = "^2.34.2"
sentry-sdk = {version = "^2.68.1", extras = ["starlette", "fastapi", "openai"]}
uvicorn = "^0.52.4"
weaviate-client = "^4.23.0"
langchain-core="^1.6.1"
langfuse="^3.15.0"
langchain-text-splitters="^1.1.2"
langchain-experimental="^0.4.1"
langchain-openai="^1.6.0"
cohere = "^7.1.0"
types-pyyaml = "^6.0.12.20260815"
types-pytz = "^2026.3.1.20260727"
httpx = {version = "^0.28.1", extras = ["http2"]}
memiris = {path = "../memiris", develop = true}
apscheduler = "^3.11.3"
onnxruntime = "^1.29.0"
transformers = "^4.57.6"
joblib = "1.5.3"
scikit-learn = "1.9.0"
ffmpeg-python = "^0.2.0"
opencv-python-headless = "^5.0.0"
yt-dlp = "^2026.8.19"

[tool.poetry.group.train.dependencies]
setfit = "^1.1.0"
optimum = {version = "^2.0.0", extras = ["onnxruntime"]}
datasets = "^5.0.1"
scikit-learn = "^1.9.0"
pandas = "^3.0.5"

[tool.poetry.group.dev.dependencies]
mypy = "^2.3.1"
pylint = "^4.0.7"
black = "^26.5.1"
isort = "^9.0.1"
yamllint = "^1.38.0"
bandit = "^1.9.4"
pytest = "^9.1.1"
coverage = "^7.15.4"
detect-secrets = "^1.5.0"
pre-commit = "^4.6.2"
autoflake = "^2.4.0"

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
mypy_path = "src"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
# fail_under = 80
# omit = ["tests/*", "your_module_name/__init__.py"]

[tool.coverage.html]
directory = "htmlcov"

[virtualenvs]
create = true
in-project = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
