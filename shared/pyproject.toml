[project]
name = "shared"
version = "3.0"
description = "Shared python library for EduTelligence"
authors = [
    { name = "Felix T.J. Dietrich", email = "felixtj.dietrich@tum.de" },
    { name = "Patrick Bassner", email = "bassner@tum.de" },
    { name = "Maximilian Sölch", email = "maximilian.soelch@tum.de" },
    { name = "Maximilian Anzinger", email = "maximilian.anzinger@tum.de" },
    { name = "Tobias Wasner", email = "tobias.wasner@tum.de" }
]
readme = "README.md"
requires-python = ">=3.11,<4.0.0"

dependencies = [
    "fastapi[standard] >= 0.141.1",
    # Security floor. python-multipart arrives through fastapi's "standard"
    # extra, which only asks for >= 0.0.18. Consumers install shared from this
    # manifest rather than from poetry.lock, so this constraint is what keeps
    # them off a vulnerable version.
    "python-multipart >= 0.0.30",
    # Security floor. starlette arrives through fastapi; fastapi 0.115 capped it
    # below 0.47, so this also requires the fastapi floor above to be recent
    # enough to allow the 1.x line.
    "starlette >= 1.3.1",
    "Pygments >= 2.20.0",
    "idna >= 3.20",
    "python-dotenv >= 1.2.2",
]

[tool.poetry.group.dev.dependencies]
black = "26.5.1"
flake8 = "7.3.0"

[virtualenvs]
create = true
in-project = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
